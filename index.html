 tiếp, thương lượng, bán hàng và ảnh hưởng.\n\nLưu ý: phần này không chép dài nguyên văn từ sách khác. Các ý được chuyển hóa thành ví dụ ứng dụng để người đọc dùng được ngay.","html":"\u003ch2>Phần VII - Kho tình huống ứng dụng từ sách giao tiếp và bán hàng\u003c/h2>\n\u003cp>Phần này là lớp “thực chiến hóa” của cuốn sách. Các tình huống dưới đây được đặt theo đúng những bối cảnh thường gặp khi tiếp khách, bán hàng, làm dịch vụ và giao tiếp công sở. Mỗi tình huống có bối cảnh, lỗi thường gặp, cách nói nên dùng và bài học được diễn giải từ các sách kinh điển về giao tiếp, thương lượng, bán hàng và ảnh hưởng.\u003c/p>\n\u003cp>Lưu ý: phần này không chép dài nguyên văn từ sách khác. Các ý được chuyển hóa thành ví dụ ứng dụng để người đọc dùng được ngay.\u003c/p>"},{"id":"35-khi-khach-buoc-vao-voi-ve-ngoai-khong-giong-khach-co-tien","level":2,"title":"35. Khi khách bước vào với vẻ ngoài không giống “khách có tiền”","audio":"https://files.catbox.moe/76s9vu.mp3","duration":null,"text":"Khi khách bước vào với vẻ ngoài không giống “khách có tiền”\n\nBối cảnh: Khách ăn mặc giản dị, đi dép, hỏi nhiều, nói chậm. Nhân viên vội kết luận đây là khách không có khả năng mua, nên tiếp qua loa. Đây chính là cái bẫy “nhìn mặt bắt hình dong” trong bán hàng.\n\nLỗi thường gặp:\nChào khách bằng giọng nhạt hơn khách khác.\nChỉ giới thiệu dòng rẻ nhất vì nghĩ khách không đủ tiền.\nDùng câu hỏi làm khách thấy bị đánh giá: “Anh/chị định mua thật hay xem thôi?”\nKhông giải thích kỹ vì nghĩ giải thích cũng vô ích.\n\nCách xử lý có EQ:\n\nHãy tiếp khách theo cùng một chuẩn tối thiểu trong 60 giây đầu. Đừng vội phân loại bằng mắt. Hỏi nhu cầu thật trước, ngân sách sau. Nếu cần hỏi ngân sách, hãy hỏi bằng cách mở lựa chọn, không hỏi kiểu soi túi tiền.\n\nMẫu câu:\n“Anh/chị đang muốn tìm sản phẩm dùng cho mình, cho gia đình hay cho công việc ạ?”\n“Mình ưu tiên bền, đẹp, tiện, hay tối ưu chi phí hơn?”\n“Em có thể đưa ra ba mức lựa chọn để mình so sánh: tiết kiệm, cân bằng và cao cấp.”\n“Mẫu cao cấp hơn không phải lúc nào cũng phù hợp hơn. Em sẽ hỏi kỹ nhu cầu trước rồi mới đề xuất.”\n\nVí dụ cụ thể:\n\nMột khách đi xe cũ bước vào showroom nội thất, mặc áo thun đã bạc màu. Nhân viên A chỉ tay về khu hàng giảm giá. Nhân viên B hỏi: “Anh/chị đang làm nhà mới hay thay đồ cho nhà đang ở?” Khách đáp đang hoàn thiện biệt thự cho bố mẹ. Nhân viên B không bán ngay bộ đắt tiền, mà hỏi tiếp phong cách, diện tích, người sử dụng, thời hạn giao hàng. Kết quả, khách mua gói trọn bộ vì cảm thấy được tôn trọng và được tư vấn thật.\n\nLiên hệ sách kinh điển:\nTừ *Đắc Nhân Tâm* của Dale Carnegie: con người muốn được coi trọng thật lòng. Trong bán hàng, sự coi trọng phải xuất hiện trước khi khách chứng minh họ có tiền.\nTừ *To Sell Is Human* của Daniel H. Pink: bán hàng hiện đại là khả năng hòa nhịp với người đối diện, không phải đẩy sản phẩm vào tay họ.\nTừ *SPIN Selling* của Neil Rackham: đừng bắt đầu bằng lời chào hàng; hãy bắt đầu bằng câu hỏi tình huống và vấn đề.\n\nNguyên tắc rút ra: Đừng phục vụ theo vẻ ngoài của khách. Hãy phục vụ theo khả năng vấn đề của họ cần được giải quyết.","html":"\u003ch3>35. Khi khách bước vào với vẻ ngoài không giống “khách có tiền”\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách ăn mặc giản dị, đi dép, hỏi nhiều, nói chậm. Nhân viên vội kết luận đây là khách không có khả năng mua, nên tiếp qua loa. Đây chính là cái bẫy “nhìn mặt bắt hình dong” trong bán hàng.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Chào khách bằng giọng nhạt hơn khách khác.\u003c/li>\n\u003cli>Chỉ giới thiệu dòng rẻ nhất vì nghĩ khách không đủ tiền.\u003c/li>\n\u003cli>Dùng câu hỏi làm khách thấy bị đánh giá: “Anh/chị định mua thật hay xem thôi?”\u003c/li>\n\u003cli>Không giải thích kỹ vì nghĩ giải thích cũng vô ích.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy tiếp khách theo cùng một chuẩn tối thiểu trong 60 giây đầu. Đừng vội phân loại bằng mắt. Hỏi nhu cầu thật trước, ngân sách sau. Nếu cần hỏi ngân sách, hãy hỏi bằng cách mở lựa chọn, không hỏi kiểu soi túi tiền.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Anh/chị đang muốn tìm sản phẩm dùng cho mình, cho gia đình hay cho công việc ạ?”\u003c/li>\n\u003cli>“Mình ưu tiên bền, đẹp, tiện, hay tối ưu chi phí hơn?”\u003c/li>\n\u003cli>“Em có thể đưa ra ba mức lựa chọn để mình so sánh: tiết kiệm, cân bằng và cao cấp.”\u003c/li>\n\u003cli>“Mẫu cao cấp hơn không phải lúc nào cũng phù hợp hơn. Em sẽ hỏi kỹ nhu cầu trước rồi mới đề xuất.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Một khách đi xe cũ bước vào showroom nội thất, mặc áo thun đã bạc màu. Nhân viên A chỉ tay về khu hàng giảm giá. Nhân viên B hỏi: “Anh/chị đang làm nhà mới hay thay đồ cho nhà đang ở?” Khách đáp đang hoàn thiện biệt thự cho bố mẹ. Nhân viên B không bán ngay bộ đắt tiền, mà hỏi tiếp phong cách, diện tích, người sử dụng, thời hạn giao hàng. Kết quả, khách mua gói trọn bộ vì cảm thấy được tôn trọng và được tư vấn thật.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Đắc Nhân Tâm* của Dale Carnegie: con người muốn được coi trọng thật lòng. Trong bán hàng, sự coi trọng phải xuất hiện trước khi khách chứng minh họ có tiền.\u003c/li>\n\u003cli>Từ *To Sell Is Human* của Daniel H. Pink: bán hàng hiện đại là khả năng hòa nhịp với người đối diện, không phải đẩy sản phẩm vào tay họ.\u003c/li>\n\u003cli>Từ *SPIN Selling* của Neil Rackham: đừng bắt đầu bằng lời chào hàng; hãy bắt đầu bằng câu hỏi tình huống và vấn đề.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Đừng phục vụ theo vẻ ngoài của khách. Hãy phục vụ theo khả năng vấn đề của họ cần được giải quyết.\u003c/p>"},{"id":"36-khi-khach-giau-hoac-co-dia-vi-cao-nhung-noi-rat-it","level":2,"title":"36. Khi khách giàu hoặc có địa vị cao nhưng nói rất ít","audio":"https://files.catbox.moe/e2v48t.mp3","duration":null,"text":"Khi khách giàu hoặc có địa vị cao nhưng nói rất ít\n\nBối cảnh: Khách có địa vị cao thường ít nói, nhìn nhanh, hỏi ngắn. Người bán hoặc người tiếp khách dễ rơi vào hai lỗi: hoặc sợ quá nên nói lắp, hoặc nói quá nhiều để chứng minh mình giỏi.\n\nLỗi thường gặp:\nGiải thích dài dòng trước khi biết khách cần gì.\nNịnh lộ: “Anh/chị ở tầm này chắc dùng loại cao cấp nhất.”\nHỏi quá nhiều câu nhỏ làm khách mất kiên nhẫn.\nKhông dám nói rõ giới hạn, sợ phật ý khách.\n\nCách xử lý có EQ:\n\nVới nhóm khách này, sự chuyên nghiệp nằm ở khả năng rút gọn. Hãy cho họ cảm giác bạn kiểm soát được vấn đề. Nói theo cấu trúc: kết luận trước, lựa chọn sau, chi tiết để khi họ cần.\n\nMẫu câu:\n“Em xin đi thẳng vào ba điểm chính.”\n“Theo nhu cầu của anh/chị, có hai phương án đáng cân nhắc.”\n“Nếu ưu tiên tốc độ, chọn phương án A. Nếu ưu tiên độ bền và hình ảnh, chọn phương án B.”\n“Phần này em không khuyên mình quyết ngay; em khuyên mình kiểm tra thêm một điều kiện trước.”\n\nVí dụ cụ thể:\n\nMột giám đốc vào mua đồng hồ tặng đối tác. Nếu nhân viên nói liên tục về lịch sử thương hiệu, khách có thể mất kiên nhẫn. Cách tốt hơn: “Nếu món quà dùng cho đối tác lớn tuổi, em ưu tiên mẫu mặt thanh, dây da, ít phô. Nếu tặng đối tác trẻ hơn, mẫu này hiện đại hơn. Cả hai đều có hộp quà trang trọng.” Nhân viên không khoe kiến thức, mà làm khách ra quyết định nhanh hơn.\n\nLiên hệ sách kinh điển:\nTừ *The Challenger Sale* của Matthew Dixon và Brent Adamson: người bán giỏi không chỉ chiều khách; họ dạy khách nhìn vấn đề rõ hơn, điều chỉnh thông điệp theo người nghe và kiểm soát cuộc trò chuyện một cách tôn trọng.\nTừ *Never Split the Difference* của Chris Voss: trước khi thuyết phục, hãy khiến người đối diện cảm thấy mình được hiểu. Với khách ít nói, điều này thể hiện bằng việc tóm tắt đúng nhu cầu, không nói lấn.\n\nNguyên tắc rút ra: Với người có địa vị cao, đừng cố gây ấn tượng bằng nhiều lời. Hãy gây tin bằng sự chính xác, kín kẽ và tiết chế.","html":"\u003ch3>36. Khi khách giàu hoặc có địa vị cao nhưng nói rất ít\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách có địa vị cao thường ít nói, nhìn nhanh, hỏi ngắn. Người bán hoặc người tiếp khách dễ rơi vào hai lỗi: hoặc sợ quá nên nói lắp, hoặc nói quá nhiều để chứng minh mình giỏi.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Giải thích dài dòng trước khi biết khách cần gì.\u003c/li>\n\u003cli>Nịnh lộ: “Anh/chị ở tầm này chắc dùng loại cao cấp nhất.”\u003c/li>\n\u003cli>Hỏi quá nhiều câu nhỏ làm khách mất kiên nhẫn.\u003c/li>\n\u003cli>Không dám nói rõ giới hạn, sợ phật ý khách.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Với nhóm khách này, sự chuyên nghiệp nằm ở khả năng rút gọn. Hãy cho họ cảm giác bạn kiểm soát được vấn đề. Nói theo cấu trúc: kết luận trước, lựa chọn sau, chi tiết để khi họ cần.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin đi thẳng vào ba điểm chính.”\u003c/li>\n\u003cli>“Theo nhu cầu của anh/chị, có hai phương án đáng cân nhắc.”\u003c/li>\n\u003cli>“Nếu ưu tiên tốc độ, chọn phương án A. Nếu ưu tiên độ bền và hình ảnh, chọn phương án B.”\u003c/li>\n\u003cli>“Phần này em không khuyên mình quyết ngay; em khuyên mình kiểm tra thêm một điều kiện trước.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Một giám đốc vào mua đồng hồ tặng đối tác. Nếu nhân viên nói liên tục về lịch sử thương hiệu, khách có thể mất kiên nhẫn. Cách tốt hơn: “Nếu món quà dùng cho đối tác lớn tuổi, em ưu tiên mẫu mặt thanh, dây da, ít phô. Nếu tặng đối tác trẻ hơn, mẫu này hiện đại hơn. Cả hai đều có hộp quà trang trọng.” Nhân viên không khoe kiến thức, mà làm khách ra quyết định nhanh hơn.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Challenger Sale* của Matthew Dixon và Brent Adamson: người bán giỏi không chỉ chiều khách; họ dạy khách nhìn vấn đề rõ hơn, điều chỉnh thông điệp theo ng  bên em đổi theo chính sách.” Câu trả lời này vừa nhận cảm xúc, vừa không nhận lỗi bừa, vừa mở đường xử lý.\n\nLiên hệ sách kinh điển:\nTừ *Never Split the Difference*: kỹ thuật “gọi tên cảm xúc” giúp giảm căng thẳng. Khi bạn nói đúng cảm xúc của khách, họ bớt phải gào lên để chứng minh mình đang bực.\nTừ *Đắc Nhân Tâm*: tránh chỉ trích và kết án trực diện. Với khách giận, một câu quy lỗi có thể đóng sập mọi cánh cửa.\nTừ *Customer Satisfaction Is Worthless, Customer Loyalty Is Priceless* của Jeffrey Gitomer: xử lý phàn nàn không chỉ để giữ một đơn hàng, mà để giữ niềm tin sau sự cố.\n\nNguyên tắc rút ra: Khách phàn nàn là một người đang trao cho bạn cơ hội sửa niềm tin. Đừng biến cơ hội đó thành trận cãi đúng sai.","html":"\u003ch3>37. Khi khách nóng giận và đòi trả hàng ngay lập tức\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách quay lại, đặt sản phẩm lên bàn, nói: “Trả tiền cho tôi. Tôi không muốn nghe giải thích.” Đây là tình huống bán hàng rất dễ biến thành đối đầu.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Phản xạ phòng thủ: “Bên em không cho trả.”\u003c/li>\n\u003cli>Đổ lỗi: “Chắc anh/chị dùng sai.”\u003c/li>\n\u003cli>Nói quy định quá sớm.\u003c/li>\n\u003cli>Cãi đúng sai khi khách vẫn còn tức.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Trong 30 giây đầu, mục tiêu không phải là thắng lý lẽ, mà là hạ nhiệt. Khi khách đang giận, quy định đúng cũng có thể bị nghe như thái độ lạnh lùng. Hãy công nhận trải nghiệm trước, kiểm tra sau.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em hiểu là mình đang rất bực vì sản phẩm không như kỳ vọng.”\u003c/li>\n\u003cli>“Em chưa kết luận vội đúng sai. Em xin kiểm tra để đưa hướng xử lý đúng nhất cho mình.”\u003c/li>\n\u003cli>“Nếu lỗi thuộc về bên em, em sẽ xử lý theo chính sách. Nếu chưa đủ điều kiện hoàn tiền, em vẫn sẽ đưa phương án hỗ trợ cụ thể.”\u003c/li>\n\u003cli>“Mình cho em hỏi một câu để xác định đúng nguyên nhân: lỗi xuất hiện ngay khi mở hộp hay sau khi sử dụng?”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách mua máy lọc nước, hôm sau quay lại vì nước có mùi lạ. Nhân viên kém sẽ nói: “Máy mới nó vậy.” Nhân viên tốt nói: “Em hiểu cảm giác mua sản phẩm mới mà gặp mùi lạ là rất khó chịu. Em kiểm tra giúp mình ba điểm: lõi đã xả đủ chưa, nguồn nước đầu vào thế nào, và máy có lỗi kỹ thuật không. Nếu lỗi máy, bên em đổi theo chính sách.” Câu trả lời này vừa nhận cảm xúc, vừa không nhận lỗi bừa, vừa mở đường xử lý.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Never Split the Difference*: kỹ thuật “gọi tên cảm xúc” giúp giảm căng thẳng. Khi bạn nói đúng cảm xúc của khách, họ bớt phải gào lên để chứng minh mình đang bực.\u003c/li>\n\u003cli>Từ *Đắc Nhân Tâm*: tránh chỉ trích và kết án trực diện. Với khách giận, một câu quy lỗi có thể đóng sập mọi cánh cửa.\u003c/li>\n\u003cli>Từ *Customer Satisfaction Is Worthless, Customer Loyalty Is Priceless* của Jeffrey Gitomer: xử lý phàn nàn không chỉ để giữ một đơn hàng, mà để giữ niềm tin sau sự cố.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Khách phàn nàn là một người đang trao cho bạn cơ hội sửa niềm tin. Đừng biến cơ hội đó thành trận cãi đúng sai.\u003c/p>"},{"id":"38-khi-khach-noi-de-toi-suy-nghi-them","level":2,"title":"38. Khi khách nói “để tôi suy nghĩ thêm”","audio":"https://files.catbox.moe/oqyr3a.mp3","duration":null,"text":"Khi khách nói “để tôi suy nghĩ thêm”\n\nBối cảnh: Khách đã nghe tư vấn, đã xem sản phẩm, nhưng kết thúc bằng câu: “Để tôi suy nghĩ thêm.” Người bán non thường nghe câu này như một lời từ chối. Người bán giỏi nghe nó như tín hiệu còn một điểm chưa rõ.\n\nLỗi thường gặp:\nVội giảm giá: “Nếu anh/chị lấy hôm nay em bớt thêm.”\nTạo áp lực giả: “Không mua ngay là hết.”\nHỏi dồn: “Anh/chị còn suy nghĩ gì nữa?”\nTỏ thái độ thất vọng.\n\nCách xử lý có EQ:\n\nHãy giúp khách gọi tên điều họ còn lăn tăn. Có khi không phải giá. Có khi là rủi ro, sự phù hợp, ý kiến người nhà, thời điểm, hoặc niềm tin vào người bán.\n\nMẫu câu:\n“Dạ, mình nên cân nhắc kỹ. Để em hỗ trợ tốt hơn, điểm mình còn lăn tăn nhất là giá, độ phù hợp hay chính sách sau mua ạ?”\n“Nếu cần so sánh, em tóm tắt giúp mình hai phương án chính.”\n“Nếu hôm nay chưa quyết, em gửi lại thông tin gọn để mình dễ trao đổi với người nhà.”\n“Em không muốn mình mua khi chưa yên tâm. Mình cần chắc phần nào nhất?”\n\nVí dụ cụ thể:\n\nKhách xem khóa học kỹ năng cho nhân viên nhưng nói cần suy nghĩ. Nhân viên sale không nên lập tức giảm giá. Hãy hỏi: “Anh/chị đang cần thuyết phục ban giám đốc về hiệu quả, chi phí hay thời gian triển khai?” Nếu khách nói khó chứng minh hiệu quả, người bán có thể gửi case study, mẫu báo cáo sau đào tạo, hoặc đề xuất buổi demo. Lúc này người bán không bán khóa học, mà bán sự rõ ràng để khách nội bộ hóa quyết định.\n\nLiên hệ sách kinh điển:\nTừ *SPIN Selling*: sau câu “suy nghĩ thêm”, hãy quay lại câu hỏi vấn đề và hệ quả. Khách chưa mua vì họ chưa thấy đủ khoảng cách giữa hiện trạng và kết quả mong muốn.\nTừ *Gap Selling* của Keenan: bán hàng là làm rõ khoảng cách giữa trạng thái hiện tại và trạng thái mong muốn. Khi khoảng cách chưa đủ rõ, khách trì hoãn.\nTừ *Influence* của Robert Cialdini: bằng chứng xã hội có thể giúp khách giảm rủi ro cảm nhận, nhưng phải dùng đúng lúc và trung thực.\n\nNguyên tắc rút ra: Đừng ép khách quyết khi họ chưa rõ. Hãy giúp họ thấy điều gì còn chưa rõ.","html":"\u003ch3>38. Khi khách nói “để tôi suy nghĩ thêm”\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách đã nghe tư vấn, đã xem sản phẩm, nhưng kết thúc bằng câu: “Để tôi suy nghĩ thêm.” Người bán non thường nghe câu này như một lời từ chối. Người bán giỏi nghe nó như tín hiệu còn một điểm chưa rõ.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Vội giảm giá: “Nếu anh/chị lấy hôm nay em bớt thêm.”\u003c/li>\n\u003cli>Tạo áp lực giả: “Không mua ngay là hết.”\u003c/li>\n\u003cli>Hỏi dồn: “Anh/chị còn suy nghĩ gì nữa?”\u003c/li>\n\u003cli>Tỏ thái độ thất vọng.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy giúp khách gọi tên điều họ còn lăn tăn. Có khi không phải giá. Có khi là rủi ro, sự phù hợp, ý kiến người nhà, thời điểm, hoặc niềm tin vào người bán.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Dạ, mình nên cân nhắc kỹ. Để em hỗ trợ tốt hơn, điểm mình còn lăn tăn nhất là giá, độ phù hợp hay chính sách sau mua ạ?”\u003c/li>\n\u003cli>“Nếu cần so sánh, em tóm tắt giúp mình hai phương án chính.”\u003c/li>\n\u003cli>“Nếu hôm nay chưa quyết, em gửi lại thông tin gọn để mình dễ trao đổi với người nhà.”\u003c/li>\n\u003cli>“Em không muốn mình mua khi chưa yên tâm. Mình cần chắc phần nào nhất?”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách xem khóa học kỹ năng cho nhân viên nhưng nói cần suy nghĩ. Nhân viên sale không nên lập tức giảm giá. Hãy hỏi: “Anh/chị đang cần thuyết phục ban giám đốc về hiệu quả, chi phí hay thời gian triển khai?” Nếu khách nói khó chứng minh hiệu quả, người bán có thể gửi case study, mẫu báo cáo sau đào tạo, hoặc đề xuất buổi demo. Lúc này người bán không bán khóa học, mà bán sự rõ ràng để khách nội bộ hóa quyết định.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *SPIN Selling*: sau câu “suy nghĩ thêm”, hãy quay lại câu hỏi vấn đề và hệ quả. Khách chưa mua vì họ chưa thấy đủ khoảng cách giữa hiện trạng và kết quả mong muốn.\u003c/li>\n\u003cli>Từ *Gap Selling* của Keenan: bán hàng là làm rõ khoảng cách giữa trạng thái hiện tại và trạng thái mong muốn. Khi khoảng cách chưa đủ rõ, khách trì hoãn.\u003c/li>\n\u003cli>Từ *Influence* của Robert Cialdini: bằng chứng xã hội có thể giúp khách giảm rủi ro cảm nhận, nhưng phải dùng đúng lúc và trung thực.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Đừng ép khách quyết khi họ chưa rõ. Hãy giúp họ thấy điều gì còn chưa rõ.\u003c/p>"},{"id":"39-khi-khach-mac-ca-hoac-ep-gia-manh","level":2,"title":"39. Khi khách mặc cả hoặc ép giá mạnh","audio":"https://files.catbox.moe/gmdhro.mp3","duration":null,"text":"Khi khách mặc cả hoặc ép giá mạnh\n\nBối cảnh: Khách nói: “Bên kia rẻ hơn nhiều. Nếu không giảm thì tôi mua chỗ khác.” Đây là tình huống dễ làm người bán rơi vào thế phòng thủ hoặc tự phá giá.\n\nLỗi thường gặp:\nGiảm giá ngay, khiến khách nghĩ biên lợi nhuận quá cao.\nChê đối thủ, làm mình mất sang.\nNói “giá bên em là tốt nhất rồi” nhưng không chứng minh được.\nBỏ qua nhu cầu thật phía sau câu mặc cả.\n\nCách xử lý có EQ:\n\nKhông tranh luận về giá trước khi làm rõ phạm vi giá. Hãy hỏi xem khách đang so sánh cùng loại, cùng dịch vụ, cùng bảo hành, cùng điều kiện hay chưa.\n\nMẫu câu:\n“Mình so sánh giá là rất đúng. Em xin phép làm rõ: bên kia đang báo cùng mẫu, cùng bảo hành và cùng điều kiện giao hàng không ạ?”\n“Nếu mục tiêu chính là giá thấp nhất, em có phương án tiết kiệm hơn. Nếu mục tiêu là ít rủi ro sau mua, phương án này đáng cân nhắc hơn.”\n“Em không muốn giảm bằng cách cắt phần bảo hành hoặc dịch vụ mà mình sẽ cần về sau.”\n“Mình muốn tối ưu ngân sách ở mức nào để em thiết kế lại phương án?”\n\nVí dụ cụ thể:\n\nKhách mua phần mềm quản lý và đòi giảm 30% vì nhà cung cấp khác rẻ hơn. Người bán giỏi không nói “bên đó kém”. Họ hỏi: “Bên kia đã bao gồm triển khai, đào tạo, chuyển dữ liệu và hỗ trợ sau bán chưa?” Nếu chưa, người bán đưa bảng so sánh tổng chi phí sở hữu. Khi đó cuộc nói chuyện chuyển từ “giá rẻ” sang “chi phí thật”.\n\nLiên hệ sách kinh điển:\nTừ *The Challenger Sale*: người bán có thể “dạy” khách cách nhìn lại tiêu chí mua hàng, miễn là làm với thái độ giúp khách ra quyết định tốt hơn.\nTừ *Influence*: nguyên tắc tương phản giúp khách nhìn khác biệt giữa hai phương án rõ hơn. Nhưng phải tương phản bằng giá trị thật, không dọa dẫm.\nTừ *Never Split the Difference*: câu hỏi “Làm sao để...” giúp chuyển áp lực về giải pháp. Ví dụ: “Làm sao để em giảm giá mà vẫn giữ đủ phần bảo hành anh/chị cần?”\n\nNguyên tắc rút ra: Đừng bảo vệ giá bằng tự ái. Hãy bảo vệ giá bằng giá trị, phạm vi và rủi ro được làm rõ.","html":"\u003ch3>39. Khi khách mặc cả hoặc ép giá mạnh\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách nói: “Bên kia rẻ hơn nhiều. Nếu không giảm thì tôi mua chỗ khác.” Đây là tình huống dễ làm người bán rơi vào thế phòng thủ hoặc tự phá giá.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Giảm giá ngay, khiến khách nghĩ biên lợi nhuận quá cao.\u003c/li>\n\u003cli>Chê đối thủ, làm mình mất sang.\u003c/li>\n\u003cli>Nói “giá bên em là tốt nhất rồi” nhưng không chứng minh được.\u003c/li>\n\u003cli>Bỏ qua nhu cầu thật phía sau câu mặc cả.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Không tranh luận về giá trước khi làm rõ phạm vi giá. Hãy hỏi xem khách đang so sánh cùng loại, cùng dịch vụ, cùng bảo hành, cùng điều kiện hay chưa.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Mình so sánh giá là rất đúng. Em xin phép làm rõ: bên kia đang báo cùng mẫu, cùng bảo hành và cùng điều kiện giao hàng không ạ?”\u003c/li>\n\u003cli>“Nếu mục tiêu chính là giá thấp nhất, em có phương án tiết kiệm hơn. Nếu mục tiêu là ít rủi ro sau mua, phương án này đáng cân nhắc hơn.”\u003c/li>\n\u003cli>“Em không muốn giảm bằng cách cắt phần bảo hành hoặc dịch vụ mà mình sẽ cần về sau.”\u003c/li>\n\u003cli>“Mình muốn tối ưu ngân sách ở mức nào để em thiết kế lại phương án?”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách mua phần mềm quản lý và đòi giảm 30% vì nhà cung cấp khác rẻ hơn. Người bán giỏi không nói “bên đó kém”. Họ hỏi: “Bên kia đã bao gồm triển khai, đào tạo, chuyển dữ liệu và hỗ trợ sau bán chưa?” Nếu chưa, người bán đưa bảng so sánh tổng chi phí sở hữu. Khi đó cuộc nói chuyện chuyển từ “giá rẻ” sang “chi phí thật”.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Challenger Sale*: người bán có thể “dạy” khách cách nhìn lại tiêu chí mua hàng, miễn là làm với thái độ giúp khách ra quyết định tốt hơn.\u003c/li>\n\u003cli>Từ *Influence*: nguyên tắc tương phản giúp khách nhìn khác biệt giữa hai phương án rõ hơn. Nhưng phải tương phản bằng giá trị thật, không dọa dẫm.\u003c/li>\n\u003cli>Từ *Never Split the Difference*: câu hỏi “Làm sao để...” giúp chuyển áp lực về giải pháp. Ví dụ: “Làm sao để em giảm giá mà vẫn giữ đủ phần bảo hành anh/chị cần?”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Đừng bảo vệ giá bằng tự ái. Hãy bảo vệ giá bằng giá trị, phạm vi và rủi ro được làm rõ.\u003c/p>"},{"id":"40-khi-khach-dung-quyen-luc-hoac-quan-he-de-ep-ngoai-le","level":2,"title":"40. Khi khách dùng quyền lực hoặc quan hệ để ép ngoại lệ","audio":"https://files.catbox.moe/tnedww.mp3","duration":null,"text":"Khi khách dùng quyền lực hoặc quan hệ để ép ngoại lệ\n\nBối cảnh: Khách nói: “Tôi quen giám đốc bên em”, “Tôi làm chỗ này lâu rồi”, “Cứ làm trước cho tôi, giấy tờ bổ sung sau.” Đây là lúc thái độ mềm và nguyên tắc cứng phải đi cùng nhau.\n\nLỗi thường gặp:\nSợ quá nên làm sai quy trình.\nCứng quá khiến khách cảm thấy bị thách thức.\nĐẩy trách nhiệm lên người khác: “Em không biết, sếp bảo vậy.”\nNói quy định như một bức tường, không đưa lối ra.\n\nCách xử lý có EQ:\n\nĐầu tiên ghi nhận mong muốn được xử lý nhanh. Sau đó giải thích rủi ro của ngoại lệ. Cuối cùng đưa phương án nhanh nhất trong khuôn khổ.\n\nMẫu câu:\n“Em hiểu mình muốn xử lý nhanh vì việc này đang gấp.”\n“Phần này nếu làm trước khi đủ giấy tờ, kết quả sau này có thể không được chấp nhận, lúc đó người thiệt lại là anh/chị.”\n“Cách nhanh nhất trong đúng quy trình là mình bổ sung mục này trước, em sẽ ưu tiên kiểm tra ngay khi đủ.”\n“Nếu anh/chị muốn, em có thể ghi nhận yêu cầu và báo cấp phụ trách, nhưng em không thể tự ý bỏ bước bắt buộc.”\n\nVí dụ cụ thể:\n\nMột khách VIP yêu cầu giao xe khi chưa hoàn tất giấy tờ thanh toán. Nhân viên không nên nói: “Không được.” Cũng không nên giao xe vì sợ. Câu tốt hơn: “Em rất muốn bàn giao sớm cho anh. Nhưng nếu xe rời showroom khi chưa hoàn tất bước này, bảo hiểm và trách nhiệm bàn giao có thể bị vướng. Em đề xuất mình hoàn tất xác nhận thanh toán trước, em giữ xe và ưu tiên bàn giao ngay trong chiều nay.”\n\nLiên hệ sách kinh điển:\nTừ *Getting to Yes* của Roger Fisher và William Ury: tách con người khỏi vấn đề. Bạn vẫn tôn trọng khách, nhưng vấn đề quy trình phải được xử lý như một tiêu chuẩn khách quan.\nTừ *Crucial Conversations*: khi cuộc trò chuyện có rủi ro cao, hãy giữ an toàn tâm lý trước khi đi vào nội dung khó.\n\nNguyên tắc rút ra: Ngoại lệ không đáng sợ bằng việc bạn không biết giải thích vì sao không thể ngoại lệ.","html":"\u003ch3>40. Khi khách dùng quyền lực hoặc quan hệ để ép ngoại lệ\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách nói: “Tôi quen giám đốc bên em”, “Tôi làm chỗ này lâu rồi”, “Cứ làm trước cho tôi, giấy tờ bổ sung sau.” Đây là lúc thái độ mềm và nguyên tắc cứng phải đi cùng nhau.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Sợ quá nên làm sai quy trình.\u003c/li>\n\u003cli>Cứng quá khiến khách cảm thấy bị thách thức.\u003c/li>\n\u003cli>Đẩy trách nhiệm lên người khác: “Em không biết, sếp bảo vậy.”\u003c/li>\n\u003cli>Nói quy định như một bức tường, không đưa lối ra.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Đầu tiên ghi nhận mong muốn được xử lý nhanh. Sau đó giải thích rủi ro của ngoại lệ. Cuối cùng đưa phương án nhanh nhất trong khuôn khổ.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em hiểu mình muốn xử lý nhanh vì việc này đang gấp.”\u003c/li>\n\u003cli>“Phần này nếu làm trước khi đủ giấy tờ, kết quả sau này có thể không được chấp nhận, lúc đó người thiệt lại là anh/chị.”\u003c/li>\n\u003cli>“Cách nhanh nhất trong đúng quy trình là mình bổ sung mục này trước, em sẽ ưu tiên kiểm tra ngay khi đủ.”\u003c/li>\n\u003cli>“Nếu anh/chị muốn, em có thể ghi nhận yêu cầu và báo cấp phụ trách, nhưng em không thể tự ý bỏ bước bắt buộc.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Một khách VIP yêu cầu giao xe khi chưa hoàn tất giấy tờ thanh toán. Nhân viên không nên nói: “Không được.” Cũng không nên giao xe vì sợ. Câu tốt hơn: “Em rất muốn bàn giao sớm cho anh. Nhưng nếu xe rời showroom khi chưa hoàn tất bước này, bảo hiểm và trách nhiệm bàn giao có thể bị vướng. Em đề xuất mình hoàn tất xác nhận thanh toán trước, em giữ xe và ưu tiên bàn giao ngay trong chiều nay.”\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Getting to Yes* của Roger Fisher và William Ury: tách con người khỏi vấn đề. Bạn vẫn tôn trọng khách, nhưng vấn đề quy trình phải được xử lý như một tiêu chuẩn khách quan.\u003c/li>\n\u003cli>Từ *Crucial Conversations*: khi cuộc trò chuyện có rủi ro cao, hãy giữ an toàn tâm lý trước khi đi vào nội dung khó.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Ngoại lệ không đáng sợ bằng việc bạn không biết giải thích vì sao không thể ngoại lệ.\u003c/p>"},{"id":"41-khi-tiep-khach-tren-ban-tiec-ban-nhau","level":2,"title":"41. Khi tiếp khách trên bàn tiệc, bàn nhậu","audio":"https://files.catbox.moe/1i47kh.mp3","duration":null,"text":"Khi tiếp khách trên bàn tiệc, bàn nhậu\n\nBối cảnh: Bàn tiệc là nơi quan hệ được thử bằng những chi tiết nhỏ: ai được mời trước, ai bị bỏ quên, ai bị ép uống, ai được cứu khi lỡ lời. Người thiếu tinh tế thường tưởng mình đang “nhiệt tình”, nhưng thực ra đang gây áp lực.\n\nLỗi thường gặp:\nÉp rượu để chứng minh thân tình.\nNói chuyện công việc nhạy cảm khi không đúng lúc.\nCướp lời người chủ trì.\nChỉ chú ý người quyền cao, bỏ quên người ít nói.\nĐùa vào điểm yếu khiến người khác mất mặt.\n\nCách xử lý có EQ:\n\nHãy xem bàn tiệc như một sân khấu nhiều vai. Người giỏi không chiếm sân khấu, mà làm cho vai của từng người được đặt đúng chỗ.\n\nMẫu câu:\n“Hôm nay mình gặp nhau để kết nối trước, việc cụ thể em xin phép trao đổi riêng sau.”\n“Ai dùng được bao nhiêu mình dùng bấy nhiêu cho vui, quan trọng là có mặt đông đủ.”\n“Ý này hay, em xin nối thêm một góc nhìn khác.”\n“Em xin phép kéo câu chuyện về chủ đề ban đầu để mọi người cùng dễ theo.”\n\nVí dụ cụ thể:\n\nTrong bữa ăn với đối tác, một người trẻ lỡ nói nhầm số liệu làm cả bàn im lặng. Người quản lý tinh tế không mắng ngay, cũng không giả vờ không nghe. Anh nói: “Số này dễ nhầm vì có hai mốc tính khác nhau. Phần chi tiết để tôi gửi lại sau bữa. Hôm nay mình thống nhất trước hướng hợp tác.” Câu nói này cứu cấp dưới, giữ thể diện cho công ty và không để bàn tiệc biến thành buổi chất vấn.\n\nLiên hệ sách kinh điển:\nTừ *Đắc Nhân Tâm*: tránh làm người khác mất mặt là một nguyên tắc nền của giao tiếp.\nTừ *The Likeability Factor* của Tim Sanders: sự dễ mến không phải là làm màu; nó đến từ thân thiện, chân thật, đồng cảm và giá trị mình mang lại.\n\nNguyên tắc rút ra: Trên bàn tiệc, thắng không phải là nói hay nhất. Thắng là sau bữa ăn, người ta vẫn muốn gặp lại mình.","html":"\u003ch3>41. Khi tiếp khách trên bàn tiệc, bàn nhậu\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Bàn tiệc là nơi quan hệ được thử bằng những chi tiết nhỏ: ai được mời trước, ai bị bỏ quên, ai bị ép uống, ai được cứu khi lỡ lời. Người thiếu tinh tế thường tưởng mình đang “nhiệt tình”, nhưng thực ra đang gây áp lực.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Ép rượu để chứng minh thân tình.\u003c/li>\n\u003cli>Nói chuyện công việc nhạy cảm khi không đúng lúc.\u003c/li>\n\u003cli>Cướp lời người chủ trì.\u003c/li>\n\u003cli>Chỉ chú ý người quyền cao, bỏ quên người ít nói.\u003c/li>\n\u003cli>Đùa vào điểm yếu khiến người khác mất mặt.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy xem bàn tiệc như một sân khấu nhiều vai. Người giỏi không chiếm sân khấu, mà làm cho vai của từng người được đặt đúng chỗ.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Hôm nay mình gặp nhau để kết nối trước, việc cụ thể em xin phép trao đổi riêng sau.”\u003c/li>\n\u003cli>“Ai dùng được bao nhiêu mình dùng bấy nhiêu cho vui, quan trọng là có mặt đông đủ.”\u003c/li>\n\u003cli>“Ý này hay, em xin nối thêm một góc nhìn khác.”\u003c/li>\n\u003cli>“Em xin phép kéo câu chuyện về chủ đề ban đầu để mọi người cùng dễ theo.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Trong bữa ăn với đối tác, một người trẻ lỡ nói nhầm số liệu làm cả bàn im lặng. Người quản lý tinh tế không mắng ngay, cũng không giả vờ không nghe. Anh nói: “Số này dễ nhầm vì có hai mốc tính khác nhau. Phần chi tiết để tôi gửi lại sau bữa. Hôm nay mình thống nhất trước hướng hợp tác.” Câu nói này cứu cấp dưới, giữ thể diện cho công ty và không để bàn tiệc biến thành buổi chất vấn.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Đắc Nhân Tâm*: tránh làm người khác mất mặt là một nguyên tắc nền của giao tiếp.\u003c/li>\n\u003cli>Từ *The Likeability Factor* của Tim Sanders: sự dễ mến không phải là làm màu; nó đến từ thân thiện, chân thật, đồng cảm và giá trị mình mang lại.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Trên bàn tiệc, thắng không phải là nói hay nhất. Thắng là sau bữa ăn, người ta vẫn muốn gặp lại mình.\u003c/p>"},{"id":"42-khi-dong-nghiep-gianh-khach-hoac-cuop-cong","level":2,"title":"42. Khi đồng nghiệp giành khách hoặc cướp công","audio":"https://files.catbox.moe/lubu5p.mp3","duration":null,"text":"Khi đồng nghiệp giành khách hoặc cướp công\n\nBối cảnh: Đồng nghiệp liên hệ trực tiếp khách của bạn, nhận phần công của bạn, hoặc dùng thông tin bạn tạo ra để chạy KPI riêng. Đây là lúc rất dễ nổi nóng.\n\nLỗi thường gặp:\nCông khai bóc phốt ngay trước nhóm.\nNói bằng cảm xúc: “Anh/chị chơi xấu.”\nKhông có bằng chứng, chỉ có cảm giác.\nIm lặng quá lâu khiến việc lặp lại.\n\nCách xử lý có EQ:\n\nHãy đi theo ba tầng: trao đổi riêng, ghi nhận bằng chứng, đưa lên cơ chế. Đừng biến vấn đề hệ thống thành cuộc chiến cá nhân nếu chưa cần.\n\nMẫu câu riêng:\n“Khách này em đang phụ trách từ ngày..., nên việc mình cùng liên hệ làm khách nhận hai luồng thông tin. Mình thống nhất lại cách phối hợp nhé.”\n“Em không muốn quy việc này thành chuyện cá nhân. Em muốn chốt lại nguyên tắc phân công để tránh lặp lại.”\n\nMẫu câu với quản lý:\n“Em xin báo cáo một tình huống ảnh hưởng đến phân công khách hàng. Em có các mốc trao đổi cụ thể và đề xuất cơ chế cập nhật chung để tránh xung đột KPI.”\n\nVí dụ cụ thể:\n\nBạn đã nuôi một khách B2B ba tháng. Một đồng nghiệp thấy khách sắp ký thì nhắn riêng báo giá thấp hơn. Nếu bạn nổi nóng trong nhóm chat, bạn có thể thành người thiếu kiểm soát. Cách tốt hơn là lưu lại lịch sử chăm sóc, trao đổi riêng một lần, sau đó đề xuất với quản lý dùng CRM ghi owner khách và quy định chuyển giao rõ ràng.\n\nLiên hệ sách kinh điển:\nTừ *Crucial Conversations*: trong cuộc trò chuyện căng, hãy bắt đầu bằng mục tiêu chung. Ví dụ: “Mục tiêu của mình là khách không bị rối và đội không xung đột KPI.”\nTừ *Getting to Yes*: tập trung vào lợi ích và tiêu chuẩn khách quan, không chỉ vị trí “khách này của tôi”.\n\nNguyên tắc rút ra: Người khôn không chỉ thắng một lần tranh cãi; họ tạo ra cơ chế để chuyện xấu khó lặp lại.","html":"\u003ch3>42. Khi đồng nghiệp giành khách hoặc cướp công\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Đồng nghiệp liên hệ trực tiếp khách của bạn, nhận phần công của bạn, hoặc dùng thông tin bạn tạo ra để chạy KPI riêng. Đây là lúc rất dễ nổi nóng.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Công khai bóc phốt ngay trước nhóm.\u003c/li>\n\u003cli>Nói bằng cảm xúc: “Anh/chị chơi xấu.”\u003c/li>\n\u003cli>Không có bằng chứng, chỉ có cảm giác.\u003c/li>\n\u003cli>Im lặng quá lâu khiến việc lặp lại.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy đi theo ba tầng: trao đổi riêng, ghi nhận bằng chứng, đưa lên cơ chế. Đừng biến vấn đề hệ thống thành cuộc chiến cá nhân nếu chưa cần.\u003c/p>\n\u003cp>Mẫu câu riêng:\u003c/p>\n\u003cul>\n\u003cli>“Khách này em đang phụ trách từ ngày..., nên việc mình cùng liên hệ làm khách nhận hai luồng thông tin. Mình thống nhất lại cách phối hợp nhé.”\u003c/li>\n\u003cli>“Em không muốn quy việc này thành chuyện cá nhân. Em muốn chốt lại nguyên tắc phân công để tránh lặp lại.”\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu với quản lý:\u003c/p>\n\u003cul>\n\u003cli>“Em xin báo cáo một tình huống ảnh hưởng đến phân công khách hàng. Em có các mốc trao đổi cụ thể và đề xuất cơ chế cập nhật chung để tránh xung đột KPI.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Bạn đã nuôi một khách B2B ba tháng. Một đồng nghiệp thấy khách sắp ký thì nhắn riêng báo giá thấp hơn. Nếu bạn nổi nóng trong nhóm chat, bạn có thể thành người thiếu kiểm soát. Cách tốt hơn là lưu lại lịch sử chăm sóc, trao đổi riêng một lần, sau đó đề xuất với quản lý dùng CRM ghi owner khách và quy định chuyển giao rõ ràng.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Crucial Conversations*: trong cuộc trò chuyện căng, hãy bắt đầu bằng mục tiêu chung. Ví dụ: “Mục tiêu của mình là khách không bị rối và đội không xung đột KPI.”\u003c/li>\n\u003cli>Từ *Getting to Yes*: tập trung vào lợi ích và tiêu chuẩn khách quan, không chỉ vị trí “khách này của tôi”.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Người khôn không chỉ thắng một lần tranh cãi; họ tạo ra cơ chế để chuyện xấu khó lặp lại.\u003c/p>"},{"id":"43-khi-can-thuyet-phuc-lanh-dao-trong-thang-may-hoac-thoi-gian-rat-ngan","level":2,"title":"43. Khi cần thuyết phục lãnh đạo trong thang máy hoặc thời gian rất ngắn","audio":"https://files.catbox.moe/4p2v57.mp3","duration":null,"text":"Khi cần thuyết phục lãnh đạo trong thang máy hoặc thời gian rất ngắn\n\nBối cảnh: Bạn gặp lãnh đạo ở thang máy, hành lang, xe chung hoặc trước cuộc họp. Thời gian chỉ có một đến ba phút. Đây không phải lúc kể lể, mà là lúc đóng gói tư duy.\n\nLỗi thường gặp:\nMở đầu quá dài.\nNêu vấn đề nhưng không có đề xuất.\nThan khó mà không nói cần quyết điều gì.\nĐưa chuyện nhạy cảm vào nơi không riêng tư.\n\nCách xử lý có EQ:\n\nDùng cấu trúc bốn câu: bối cảnh, tiến độ, nút cần quyết, đề xuất.\n\nMẫu câu:\n“Về dự án A, hiện nhóm đã xong khoảng 70%.”\n“Nút còn lại là chọn phương án triển khai cho khách hàng lớn.”\n“Em đã chuẩn bị hai lựa chọn: nhanh hơn nhưng rủi ro cao hơn, hoặc chậm hơn một tuần nhưng chắc hơn.”\n“Khi nào anh/chị tiện, em xin 10 phút để trình bày và xin quyết.”\n\nVí dụ cụ thể:\n\nMột nhân viên muốn xin thêm ngân sách marketing. Nếu gặp sếp và nói: “Dạo này khó quá, ngân sách ít quá”, sếp khó phản hồi. Cách tốt hơn: “Chiến dịch hiện đạt 60% lead mục tiêu, nhưng chi phí mỗi lead đang tăng 18%. Em có hai phương án: giữ ngân sách và giảm mục tiêu, hoặc tăng thêm 20 triệu để giữ mục tiêu ban đầu. Em xin 10 phút chiều nay để trình bày số liệu.” Câu này biến than phiền thành quyết định.\n\nLiên hệ sách kinh điển:\nTừ *Made to Stick* của Chip Heath và Dan Heath: ý tưởng dễ nhớ thường đơn giản, cụ thể và có điểm đáng chú ý.\nTừ *The Pyramid Principle* của Barbara Minto: nói kết luận trước, sau đó mới đưa lý do và dữ liệu.\n\nNguyên tắc rút ra: Khi thời gian ngắn, đừng cố nói nhiều. Hãy nói đúng thứ giúp người nghe ra quyết định.","html":"\u003ch3>43. Khi cần thuyết phục lãnh đạo trong thang máy hoặc thời gian rất ngắn\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Bạn gặp lãnh đạo ở thang máy, hành lang, xe chung hoặc trước cuộc họp. Thời gian chỉ có một đến ba phút. Đây không phải lúc kể lể, mà là lúc đóng gói tư duy.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Mở đầu quá dài.\u003c/li>\n\u003cli>Nêu vấn đề nhưng không có đề xuất.\u003c/li>\n\u003cli>Than khó mà không nói cần quyết điều gì.\u003c/li>\n\u003cli>Đưa chuyện nhạy cảm vào nơi không riêng tư.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Dùng cấu trúc bốn câu: bối cảnh, tiến độ, nút cần quyết, đề xuất.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Về dự án A, hiện nhóm đã xong khoảng 70%.”\u003c/li>\n\u003cli>“Nút còn lại là chọn phương án triển khai cho khách hàng lớn.”\u003c/li>\n\u003cli>“Em đã chuẩn bị hai lựa chọn: nhanh hơn nhưng rủi ro cao hơn, hoặc chậm hơn một tuần nhưng chắc hơn.”\u003c/li>\n\u003cli>“Khi nào anh/chị tiện, em xin 10 phút để trình bày và xin quyết.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Một nhân viên muốn xin thêm ngân sách marketing. Nếu gặp sếp và nói: “Dạo này khó quá, ngân sách ít quá”, sếp khó phản hồi. Cách tốt hơn: “Chiến dịch hiện đạt 60% lead mục tiêu, nhưng chi phí mỗi lead đang tăng 18%. Em có hai phương án: giữ ngân sách và giảm mục tiêu, hoặc tăng thêm 20 triệu để giữ mục tiêu ban đầu. Em xin 10 phút chiều nay để trình bày số liệu.” Câu này biến than phiền thành quyết định.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Made to Stick* của Chip Heath và Dan Heath: ý tưởng dễ nhớ thường đơn giản, cụ thể và có điểm đáng chú ý.\u003c/li>\n\u003cli>Từ *The Pyramid Principle* của Barbara Minto: nói kết luận trước, sau đó mới đưa lý do và dữ liệu.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Khi thời gian ngắn, đừng cố nói nhiều. Hãy nói đúng thứ giúp người nghe ra quyết định.\u003c/p>"},{"id":"44-khi-ban-cho-khach-doanh-nghiep-hoac-khach-mua-theo-nhom","level":2,"title":"44. Khi bán cho khách doanh nghiệp hoặc khách mua theo nhóm","audio":"https://files.catbox.moe/ufpo1q.mp3","duration":null,"text":"Khi bán cho khách doanh nghiệp hoặc khách mua theo nhóm\n\nBối cảnh: Người nói chuyện với bạn chưa chắc là người quyết định cuối cùng. Có người dùng, người duyệt ngân sách, người kỹ thuật, người ký hợp đồng. Nếu chỉ làm hài lòng một người, thương vụ có thể vẫn chết.\n\nLỗi thường gặp:\nTập trung quá nhiều vào người thân thiện nhất.\nKhông xác định ai ảnh hưởng đến quyết định.\nGửi báo giá trước khi hiểu quy trình mua.\nKhông cung cấp tài liệu để người liên hệ nội bộ thuyết phục cấp trên.\n\nCách xử lý có EQ:\n\nHãy giúp người liên hệ trở thành người trình bày tốt trong nội bộ của họ. Bán hàng B2B không chỉ là thuyết phục một người; đó là giúp một tổ chức giảm rủi ro khi ra quyết định.\n\nMẫu câu:\n“Ngoài anh/chị, còn bộ phận nào cần xem qua phương án này không ạ?”\n“Khi trình lên cấp duyệt, điều họ quan tâm nhất thường là chi phí, rủi ro hay hiệu quả?”\n“Em gửi kèm bản tóm tắt một trang để anh/chị dễ trao đổi nội bộ.”\n“Nếu cần, em có thể tham gia 15 phút để giải đáp phần kỹ thuật hoặc triển khai.”\n\nVí dụ cụ thể:\n\nBạn bán phần mềm kế toán. Người dùng thích giao diện, nhưng giám đốc tài chính quan tâm bảo mật và chi phí chuyển đổi. Nếu chỉ demo giao diện, bạn có thể mất hợp đồng. Cách tốt hơn là chuẩn bị ba thông điệp: cho người dùng là dễ thao tác, cho IT là an toàn dữ liệu, cho CFO là giảm thời gian đối soát và chi phí sai sót.\n\nLiên hệ sách kinh điển:\nTừ *The Challenger Sale*: thông điệp phải được “may đo” theo từng người trong tổ chức mua.\nTừ *SPIN Selling*: với thương vụ lớn, câu hỏi về hệ quả và giá trị giải pháp quan trọng hơn lời giới thiệu tính năng.\n\nNguyên tắc rút ra: Trong bán hàng doanh nghiệp, người mua không chỉ mua sản phẩm; họ mua sự an toàn khi phải giải thích quyết định với người khác.","html":"\u003ch3>44. Khi bán cho khách doanh nghiệp hoặc khách mua theo nhóm\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Người nói chuyện với bạn chưa chắc là người quyết định cuối cùng. Có người dùng, người duyệt ngân sách, người kỹ thuật, người ký hợp đồng. Nếu chỉ làm hài lòng một người, thương vụ có thể vẫn chết.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Tập trung quá nhiều vào người thân thiện nhất.\u003c/li>\n\u003cli>Không xác định ai ảnh hưởng đến quyết định.\u003c/li>\n\u003cli>Gửi báo giá trước khi hiểu quy trình mua.\u003c/li>\n\u003cli>Không cung cấp tài liệu để người liên hệ nội bộ thuyết phục cấp trên.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy giúp người liên hệ trở thành người trình bày tốt trong nội bộ của họ. Bán hàng B2B không chỉ là thuyết phục một người; đó là giúp một tổ chức giảm rủi ro khi ra quyết định.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Ngoài anh/chị, còn bộ phận nào cần xem qua phương án này không ạ?”\u003c/li>\n\u003cli>“Khi trình lên cấp duyệt, điều họ quan tâm nhất thường là chi phí, rủi ro hay hiệu quả?”\u003c/li>\n\u003cli>“Em gửi kèm bản tóm tắt một trang để anh/chị dễ trao đổi nội bộ.”\u003c/li>\n\u003cli>“Nếu cần, em có thể tham gia 15 phút để giải đáp phần kỹ thuật hoặc triển khai.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Bạn bán phần mềm kế toán. Người dùng thích giao diện, nhưng giám đốc tài chính quan tâm bảo mật và chi phí chuyển đổi. Nếu chỉ demo giao diện, bạn có thể mất hợp đồng. Cách tốt hơn là chuẩn bị ba thông điệp: cho người dùng là dễ thao tác, cho IT là an toàn dữ liệu, cho CFO là giảm thời gian đối soát và chi phí sai sót.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Challenger Sale*: thông điệp phải được “may đo” theo từng người trong tổ chức mua.\u003c/li>\n\u003cli>Từ *SPIN Selling*: với thương vụ lớn, câu hỏi về hệ quả và giá trị giải pháp quan trọng hơn lời giới thiệu tính năng.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Trong bán hàng doanh nghiệp, người mua không chỉ mua sản phẩm; họ mua sự an toàn khi phải giải thích quyết định với người khác.\u003c/p>"},{"id":"45-khi-can-xin-loi-ma-van-giu-duoc-uy-tin","level":2,"title":"45. Khi cần xin lỗi mà vẫn giữ được uy tín","audio":"https://files.catbox.moe/x5509z.mp3","duration":null,"text":"Khi cần xin lỗi mà vẫn giữ được uy tín\n\nBối cảnh: Dịch vụ chậm, tư vấn sai, giao hàng thiếu, hoặc thông tin gửi khách không thống nhất. Xin lỗi không khéo có thể làm mất uy tín thêm; không xin lỗi thì mất niềm tin.\n\nLỗi thường gặp:\nXin lỗi vòng vo: “Nếu anh/chị cảm thấy không hài lòng thì...”\nĐổ lỗi nội bộ: “Do bên kho”, “do bạn nhân viên mới”.\nXin lỗi nhưng không có hành động sửa.\nHứa quá mức để xoa dịu.\n\nCách xử lý có EQ:\n\nMột lời xin lỗi tốt có bốn phần: nhận việc cụ thể, thừa nhận ảnh hưởng, đưa cách sửa, đặt mốc theo dõi.\n\nMẫu câu:\n“Bên em đã giao thiếu một phụ kiện so với xác nhận ban đầu.”\n“Việc này làm anh/chị mất thời gian kiểm tra lại, em xin lỗi về trải nghiệm đó.”\n“Em sẽ gửi bổ sung trước 16 giờ hôm nay và nhắn mã vận đơn cho mình.”\n“Sau khi anh/chị nhận đủ, em sẽ gọi lại để xác nhận.”\n\nVí dụ cụ thể:\n\nNhà hàng đặt nhầm món cho khách VIP. Quản lý không nên nói: “Nhân viên mới nên nhầm.” Câu tốt hơn: “Bên em đã ghi nhận sai món của anh. Em xin lỗi vì làm bữa ăn của mình bị gián đoạn. Em sẽ đổi món đúng ngay, phần món sai bên em xin phép không tính phí, và em sẽ trực tiếp theo đến khi món lên bàn.” Lời xin lỗi này cụ thể, có trách nhiệm và có hành động.\n\nLiên hệ sách kinh điển:\nTừ *Đắc Nhân Tâm*: thừa nhận lỗi của mình trước có thể làm giảm phòng thủ của người đối diện.\nTừ *Service Failure* trong các tài liệu quản trị dịch vụ: khách thường không chỉ đánh giá lỗi, mà đánh giá cách doanh nghiệp phục hồi sau lỗi.\n\nNguyên tắc rút ra: Xin lỗi không làm bạn yếu đi nếu sau lời xin lỗi là năng lực sửa sai rõ ràng.","html":"\u003ch3>45. Khi cần xin lỗi mà vẫn giữ được uy tín\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Dịch vụ chậm, tư vấn sai, giao hàng thiếu, hoặc thông tin gửi khách không thống nhất. Xin lỗi không khéo có thể làm mất uy tín thêm; không xin lỗi thì mất niềm tin.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Xin lỗi vòng vo: “Nếu anh/chị cảm thấy không hài lòng thì...”\u003c/li>\n\u003cli>Đổ lỗi nội bộ: “Do bên kho”, “do bạn nhân viên mới”.\u003c/li>\n\u003cli>Xin lỗi nhưng không có hành động sửa.\u003c/li>\n\u003cli>Hứa quá mức để xoa dịu.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Một lời xin lỗi tốt có bốn phần: nhận việc cụ thể, thừa nhận ảnh hưởng, đưa cách sửa, đặt mốc theo dõi.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Bên em đã giao thiếu một phụ kiện so với xác nhận ban đầu.”\u003c/li>\n\u003cli>“Việc này làm anh/chị mất thời gian kiểm tra lại, em xin lỗi về trải nghiệm đó.”\u003c/li>\n\u003cli>“Em sẽ gửi bổ sung trước 16 giờ hôm nay và nhắn mã vận đơn cho mình.”\u003c/li>\n\u003cli>“Sau khi anh/chị nhận đủ, em sẽ gọi lại để xác nhận.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Nhà hàng đặt nhầm món cho khách VIP. Quản lý không nên nói: “Nhân viên mới nên nhầm.” Câu tốt hơn: “Bên em đã ghi nhận sai món của anh. Em xin lỗi vì làm bữa ăn của mình bị gián đoạn. Em sẽ đổi món đúng ngay, phần món sai bên em xin phép không tính phí, và em sẽ trực tiếp theo đến khi món lên bàn.” Lời xin lỗi này cụ thể, có trách nhiệm và có hành động.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Đắc Nhân Tâm*: thừa nhận lỗi của mình trước có thể làm giảm phòng thủ của người đối diện.\u003c/li>\n\u003cli>Từ *Service Failure* trong các tài liệu quản trị dịch vụ: khách thường không chỉ đánh giá lỗi, mà đánh giá cách doanh nghiệp phục hồi sau lỗi.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Xin lỗi không làm bạn yếu đi nếu sau lời xin lỗi là năng lực sửa sai rõ ràng.\u003c/p>"},{"id":"46-khi-khach-hoi-cau-kho-hoac-bat-bi","level":2,"title":"46. Khi khách hỏi câu khó hoặc bắt bí","audio":"https://files.catbox.moe/sdydz0.mp3","duration":null,"text":"Khi khách hỏi câu khó hoặc bắt bí\n\nBối cảnh: Khách hỏi: “Sao bên em đắt hơn?”, “Nếu sản phẩm lỗi thì ai chịu?”, “Em có dám cam kết doanh thu không?”, “Tại sao tôi phải tin em?” Những câu này không chỉ hỏi thông tin; chúng kiểm tra bản lĩnh.\n\nLỗi thường gặp:\nTrả lời vội khi chưa hiểu ý đồ.\nNé tránh làm khách càng nghi ngờ.\nPhản ứng tự ái.\nCam kết quá mức.\n\nCách xử lý có EQ:\n\nTrước câu hỏi khó, hãy làm ba việc: cảm ơn câu hỏi, làm rõ phạm vi, trả lời bằng tiêu chuẩn kiểm chứng được.\n\nMẫu câu:\n“Câu hỏi này rất đáng hỏi trước khi quyết.”\n“Anh/chị đang muốn so sánh về giá mua ban đầu hay tổng chi phí sau sử dụng ạ?”\n“Phần này em cam kết được ở mức..., còn phần phụ thuộc vào..., em sẽ nói rõ để mình không hiểu nhầm.”\n“Thay vì chỉ nghe em nói, mình có thể xem dữ liệu/case/chính sách này.”\n\nVí dụ cụ thể:\n\nKhách hỏi công ty đào tạo: “Có cam kết nhân viên tôi học xong bán hàng tăng 30% không?” Nếu sale nói “có” cho dễ chốt, đó là bẫy. Câu tốt hơn: “Em không nên cam kết một con số phụ thuộc cả sản phẩm, thị trường, đội ngũ và quản lý sau đào tạo. Phần em cam kết là đầu ra chương trình: kịch bản bán hàng, bài kiểm tra năng lực, báo cáo tiến bộ và buổi coaching sau học. Nếu anh/chị muốn mục tiêu tăng 30%, mình cần thiết kế thêm phần đo lường trước và sau.”\n\nLiên hệ sách kinh điển:\nTừ *The Trusted Advisor* của David Maister, Charles Green và Robert Galford: niềm tin đến từ năng lực, độ tin cậy, sự thân mật phù hợp và việc không đặt lợi ích cá nhân lên trước.\nTừ *Spin Selling*: câu hỏi khó thường là cơ hội đào sâu vấn đề, không phải vật cản.\n\nNguyên tắc rút ra: Câu hỏi khó là lời mời xây niềm tin. Đừng né nó; hãy biến nó thành cuộc đối thoại rõ hơn.","html":"\u003ch3>46. Khi khách hỏi câu khó hoặc bắt bí\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách hỏi: “Sao bên em đắt hơn?”, “Nếu sản phẩm lỗi thì ai chịu?”, “Em có dám cam kết doanh thu không?”, “Tại sao tôi phải tin em?” Những câu này không chỉ hỏi thông tin; chúng kiểm tra bản lĩnh.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Trả lời vội khi chưa hiểu ý đồ.\u003c/li>\n\u003cli>Né tránh làm khách càng nghi ngờ.\u003c/li>\n\u003cli>Phản ứng tự ái.\u003c/li>\n\u003cli>Cam kết quá mức.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Trước câu hỏi khó, hãy làm ba việc: cảm ơn câu hỏi, làm rõ phạm vi, trả lời bằng tiêu chuẩn kiểm chứng được.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Câu hỏi này rất đáng hỏi trước khi quyết.”\u003c/li>\n\u003cli>“Anh/chị đang muốn so sánh về giá mua ban đầu hay tổng chi phí sau sử dụng ạ?”\u003c/li>\n\u003cli>“Phần này em cam kết được ở mức..., còn phần phụ thuộc vào..., em sẽ nói rõ để mình không hiểu nhầm.”\u003c/li>\n\u003cli>“Thay vì chỉ nghe em nói, mình có thể xem dữ liệu/case/chính sách này.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách hỏi công ty đào tạo: “Có cam kết nhân viên tôi học xong bán hàng tăng 30% không?” Nếu sale nói “có” cho dễ chốt, đó là bẫy. Câu tốt hơn: “Em không nên cam kết một con số phụ thuộc cả sản phẩm, thị trường, đội ngũ và quản lý sau đào tạo. Phần em cam kết là đầu ra chương trình: kịch bản bán hàng, bài kiểm tra năng lực, báo cáo tiến bộ và buổi coaching sau học. Nếu anh/chị muốn mục tiêu tăng 30%, mình cần thiết kế thêm phần đo lường trước và sau.”\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Trusted Advisor* của David Maister, Charles Green và Robert Galford: niềm tin đến từ năng lực, độ tin cậy, sự thân mật phù hợp và việc không đặt lợi ích cá nhân lên trước.\u003c/li>\n\u003cli>Từ *Spin Selling*: câu hỏi khó thường là cơ hội đào sâu vấn đề, không phải vật cản.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Câu hỏi khó là lời mời xây niềm tin. Đừng né nó; hãy biến nó thành cuộc đối thoại rõ hơn.\u003c/p>"},{"id":"47-khi-khach-im-lang-sau-bao-gia","level":2,"title":"47. Khi khách im lặng sau báo giá","audio":"https://files.catbox.moe/ysp0kx.mp3","duration":null,"text":"Khi khách im lặng sau báo giá\n\nBối cảnh: Bạn gửi giá. Khách đọc, im lặng. Không phản hồi. Người bán bắt đầu sốt ruột, nhắn liên tục hoặc tự giảm giá.\n\nLỗi thường gặp:\nNhắn dồn: “Anh/chị xem chưa ạ?” nhiều lần.\nTự giảm giá khi khách chưa hề yêu cầu.\nGửi thêm quá nhiều thông tin không liên quan.\nDiễn giải im lặng thành từ chối.\n\nCách xử lý có EQ:\n\nIm lặng có nhiều nghĩa: bận, chưa đủ thông tin, đang hỏi người khác, thấy giá cao, hoặc chưa thấy cấp bách. Hãy follow-up bằng giá trị, không bằng sự sốt ruột.\n\nMẫu câu:\n“Em gửi thêm bản tóm tắt ba điểm khác biệt để anh/chị dễ so sánh.”\n“Nếu mình đang cân nhắc ngân sách, em có thể thiết kế lại phương án theo mức ưu tiên.”\n“Nếu quyết định cần thêm người xem, em có thể chuẩn bị bản ngắn để mình trao đổi nội bộ.”\n“Em xin phép hẹn ngày... nhắc lại một lần để tránh làm phiền mình.”\n\nVí dụ cụ thể:\n\nBạn báo giá gói tư vấn 80 triệu. Khách im ba ngày. Thay vì nhắn “anh xem báo giá chưa”, hãy gửi: “Em tóm tắt lại để anh dễ trao đổi nội bộ: gói này giải quyết ba việc, thời gian triển khai bốn tuần, đầu ra gồm tài liệu, đào tạo và buổi coaching. Nếu ngân sách năm nay cần chia giai đoạn, em có thể tách thành hai pha.” Bạn đang giúp khách tiến bước, không chỉ thúc họ trả lời.\n\nLiên hệ sách kinh điển:\nTừ *Fanatical Prospecting* của Jeb Blount: theo đuổi khách hàng cần kỷ luật, nhưng mỗi lần chạm nên có lý do và giá trị.\nTừ *To Sell Is Human*: sự bền bỉ trong bán hàng phải đi kèm khả năng giữ tinh thần và không cá nhân hóa sự im lặng.\n\nNguyên tắc rút ra: Follow-up tốt không hỏi “mua chưa?”, mà giúp khách bớt một rào cản để có thể quyết.","html":"\u003ch3>47. Khi khách im lặng sau báo giá\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Bạn gửi giá. Khách đọc, im lặng. Không phản hồi. Người bán bắt đầu sốt ruột, nhắn liên tục hoặc tự giảm giá.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Nhắn dồn: “Anh/chị xem chưa ạ?” nhiều lần.\u003c/li>\n\u003cli>Tự giảm giá khi khách chưa hề yêu cầu.\u003c/li>\n\u003cli>Gửi thêm quá nhiều thông tin không liên quan.\u003c/li>\n\u003cli>Diễn giải im lặng thành từ chối.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Im lặng có nhiều nghĩa: bận, chưa đủ thông tin, đang hỏi người khác, thấy giá cao, hoặc chưa thấy cấp bách. Hãy follow-up bằng giá trị, không bằng sự sốt ruột.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em gửi thêm bản tóm tắt ba điểm khác biệt để anh/chị dễ so sánh.”\u003c/li>\n\u003cli>“Nếu mình đang cân nhắc ngân sách, em có thể thiết kế lại phương án theo mức ưu tiên.”\u003c/li>\n\u003cli>“Nếu quyết định cần thêm người xem, em có thể chuẩn bị bản ngắn để mình trao đổi nội bộ.”\u003c/li>\n\u003cli>“Em xin phép hẹn ngày... nhắc lại một lần để tránh làm phiền mình.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Bạn báo giá gói tư vấn 80 triệu. Khách im ba ngày. Thay vì nhắn “anh xem báo giá chưa”, hãy gửi: “Em tóm tắt lại để anh dễ trao đổi nội bộ: gói này giải quyết ba việc, thời gian triển khai bốn tuần, đầu ra gồm tài liệu, đào tạo và buổi coaching. Nếu ngân sách năm nay cần chia giai đoạn, em có thể tách thành hai pha.” Bạn đang giúp khách tiến bước, không chỉ thúc họ trả lời.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Fanatical Prospecting* của Jeb Blount: theo đuổi khách hàng cần kỷ luật, nhưng mỗi lần chạm nên có lý do và giá trị.\u003c/li>\n\u003cli>Từ *To Sell Is Human*: sự bền bỉ trong bán hàng phải đi kèm khả năng giữ tinh thần và không cá nhân hóa sự im lặng.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Follow-up tốt không hỏi “mua chưa?”, mà giúp khách bớt một rào cản để có thể quyết.\u003c/p>"},{"id":"48-khi-can-tu-choi-khach-ma-van-giu-quan-he","level":2,"title":"48. Khi cần từ chối khách mà vẫn giữ quan hệ","audio":"https://files.catbox.moe/799ik7.mp3","duration":null,"text":"Khi cần từ chối khách mà vẫn giữ quan hệ\n\nBối cảnh: Khách yêu cầu điều bạn không thể làm: giảm sâu ngoài chính sách, giao gấp không khả thi, bỏ qua điều kiện, hoặc xử lý ngoài thẩm quyền.\n\nLỗi thường gặp:\nTừ chối cụt: “Không được.”\nĐưa quy định nhưng không đưa lối ra.\nXin lỗi quá nhiều khiến mình mất thế.\nHứa sẽ “xem lại” dù biết không thể.\n\nCách xử lý có EQ:\n\nCông thức từ chối đẹp: ghi nhận mong muốn, nêu giới hạn khách quan, giải thích rủi ro, đưa phương án thay thế.\n\nMẫu câu:\n“Em hiểu mình muốn nhận hàng trước cuối ngày.”\n“Phần này hiện không thể làm đúng chất lượng nếu giao trong hôm nay.”\n“Nếu cố giao, rủi ro là thiếu kiểm tra và mình có thể mất thêm thời gian xử lý lỗi.”\n“Em đề xuất hai hướng: giao một phần trước, hoặc giao đủ vào sáng mai kèm ưu tiên kiểm tra.”\n\nVí dụ cụ thể:\n\nKhách yêu cầu làm hồ sơ trong một ngày trong khi quy trình cần ba ngày. Câu tệ: “Quy định thế rồi.” Câu tốt: “Em hiểu mình đang gấp. Tuy nhiên hồ sơ này cần đối chiếu hai nguồn dữ liệu, nếu bỏ bước thì kết quả có thể bị trả lại. Cách nhanh nhất là hôm nay mình hoàn tất phần giấy tờ, em kiểm tra trước các lỗi thường gặp, và sáng mai nộp vào luồng ưu tiên.”\n\nLiên hệ sách kinh điển:\nTừ *Getting to Yes*: dùng tiêu chuẩn khách quan thay vì ý chí cá nhân. “Không được vì tôi không muốn” rất khác “không thể vì tiêu chuẩn này bảo vệ kết quả của anh/chị”.\nTừ *Crucial Conversations*: giữ sự tôn trọng trong lúc nói điều khó.\n\nNguyên tắc rút ra: Một lời từ chối có lối ra vẫn có thể làm khách thấy được hỗ trợ.","html":"\u003ch3>48. Khi cần từ chối khách mà vẫn giữ quan hệ\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách yêu cầu điều bạn không thể làm: giảm sâu ngoài chính sách, giao gấp không khả thi, bỏ qua điều kiện, hoặc xử lý ngoài thẩm quyền.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ chối cụt: “Không được.”\u003c/li>\n\u003cli>Đưa quy định nhưng không đưa lối ra.\u003c/li>\n\u003cli>Xin lỗi quá nhiều khiến mình mất thế.\u003c/li>\n\u003cli>Hứa sẽ “xem lại” dù biết không thể.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Công thức từ chối đẹp: ghi nhận mong muốn, nêu giới hạn khách quan, giải thích rủi ro, đưa phương án thay thế.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em hiểu mình muốn nhận hàng trước cuối ngày.”\u003c/li>\n\u003cli>“Phần này hiện không thể làm đúng chất lượng nếu giao trong hôm nay.”\u003c/li>\n\u003cli>“Nếu cố giao, rủi ro là thiếu kiểm tra và mình có thể mất thêm thời gian xử lý lỗi.”\u003c/li>\n\u003cli>“Em đề xuất hai hướng: giao một phần trước, hoặc giao đủ vào sáng mai kèm ưu tiên kiểm tra.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách yêu cầu làm hồ sơ trong một ngày trong khi quy trình cần ba ngày. Câu tệ: “Quy định thế rồi.” Câu tốt: “Em hiểu mình đang gấp. Tuy nhiên hồ sơ này cần đối chiếu hai nguồn dữ liệu, nếu bỏ bước thì kết quả có thể bị trả lại. Cách nhanh nhất là hôm nay mình hoàn tất phần giấy tờ, em kiểm tra trước các lỗi thường gặp, và sáng mai nộp vào luồng ưu tiên.”\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Getting to Yes*: dùng tiêu chuẩn khách quan thay vì ý chí cá nhân. “Không được vì tôi không muốn” rất khác “không thể vì tiêu chuẩn này bảo vệ kết quả của anh/chị”.\u003c/li>\n\u003cli>Từ *Crucial Conversations*: giữ sự tôn trọng trong lúc nói điều khó.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Một lời từ chối có lối ra vẫn có thể làm khách thấy được hỗ trợ.\u003c/p>"},{"id":"49-khi-muon-khach-tu-nhan-ra-van-de-thay-vi-bi-thuyet-giang","level":2,"title":"49. Khi muốn khách tự nhận ra vấn đề thay vì bị thuyết giảng","audio":"https://files.catbox.moe/xm4gv6.mp3","duration":null,"text":"Khi muốn khách tự nhận ra vấn đề thay vì bị thuyết giảng\n\nBối cảnh: Bạn thấy khách đang chọn sai, nhưng nếu nói thẳng “anh/chị chọn sai rồi”, họ sẽ phòng thủ. Cách tốt hơn là đặt câu hỏi để khách tự nhìn thấy rủi ro.\n\nLỗi thường gặp:\nDạy đời khách.\nChê lựa chọn hiện tại của khách.\nNói như thể mình thông minh hơn.\nDùng nỗi sợ để ép mua.\n\nCách xử lý có EQ:\n\nDùng câu hỏi dẫn đường: tình huống, vấn đề, hệ quả, giá trị giải pháp. Đây là tinh thần rất gần với SPIN Selling.\n\nMẫu câu:\n“Hiện tại đội mình đang xử lý việc này bằng cách nào?”\n“Cách đó có điểm nào làm mình mất thời gian nhất?”\n“Nếu tình trạng này kéo dài thêm ba tháng, phần nào bị ảnh hưởng nhiều nhất?”\n“Nếu giảm được lỗi này một nửa, giá trị với đội mình là gì?”\n\nVí dụ cụ thể:\n\nKhách doanh nghiệp đang quản lý khách hàng bằng Excel và ngại mua CRM. Nếu bạn nói “Excel lạc hậu rồi”, khách sẽ phản ứng. Hãy hỏi: “Khi một nhân viên nghỉ, lịch sử chăm sóc khách được chuyển giao thế nào?” Khách trả lời: “Thường bị mất.” Hỏi tiếp: “Mỗi lần mất lịch sử như vậy, đội mất bao lâu để khôi phục quan hệ?” Lúc đó khách tự thấy vấn đề. Bạn không cần thắng bằng lý lẽ; khách tự gặp sự thật.\n\nLiên hệ sách kinh điển:\nTừ *SPIN Selling*: câu hỏi hay làm khách tự nhận ra nhu cầu.\nTừ *Socratic Selling*: người bán giỏi không áp đặt kết luận, mà dẫn khách qua chuỗi câu hỏi để họ tự thấy điều đúng.\nTừ *The Challenger Sale*: đôi khi cần cho khách một góc nhìn mới, nhưng góc nhìn đó phải dựa trên hiểu biết thật về vấn đề của họ.\n\nNguyên tắc rút ra: Khi khách tự nói ra vấn đề, sức thuyết phục mạnh hơn nhiều so với khi bạn nói thay họ.","html":"\u003ch3>49. Khi muốn khách tự nhận ra vấn đề thay vì bị thuyết giảng\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Bạn thấy khách đang chọn sai, nhưng nếu nói thẳng “anh/chị chọn sai rồi”, họ sẽ phòng thủ. Cách tốt hơn là đặt câu hỏi để khách tự nhìn thấy rủi ro.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dạy đời khách.\u003c/li>\n\u003cli>Chê lựa chọn hiện tại của khách.\u003c/li>\n\u003cli>Nói như thể mình thông minh hơn.\u003c/li>\n\u003cli>Dùng nỗi sợ để ép mua.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Dùng câu hỏi dẫn đường: tình huống, vấn đề, hệ quả, giá trị giải pháp. Đây là tinh thần rất gần với SPIN Selling.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Hiện tại đội mình đang xử lý việc này bằng cách nào?”\u003c/li>\n\u003cli>“Cách đó có điểm nào làm mình mất thời gian nhất?”\u003c/li>\n\u003cli>“Nếu tình trạng này kéo dài thêm ba tháng, phần nào bị ảnh hưởng nhiều nhất?”\u003c/li>\n\u003cli>“Nếu giảm được lỗi này một nửa, giá trị với đội mình là gì?”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách doanh nghiệp đang quản lý khách hàng bằng Excel và ngại mua CRM. Nếu bạn nói “Excel lạc hậu rồi”, khách sẽ phản ứng. Hãy hỏi: “Khi một nhân viên nghỉ, lịch sử chăm sóc khách được chuyển giao thế nào?” Khách trả lời: “Thường bị mất.” Hỏi tiếp: “Mỗi lần mất lịch sử như vậy, đội mất bao lâu để khôi phục quan hệ?” Lúc đó khách tự thấy vấn đề. Bạn không cần thắng bằng lý lẽ; khách tự gặp sự thật.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *SPIN Selling*: câu hỏi hay làm khách tự nhận ra nhu cầu.\u003c/li>\n\u003cli>Từ *Socratic Selling*: người bán giỏi không áp đặt kết luận, mà dẫn khách qua chuỗi câu hỏi để họ tự thấy điều đúng.\u003c/li>\n\u003cli>Từ *The Challenger Sale*: đôi khi cần cho khách một góc nhìn mới, nhưng góc nhìn đó phải dựa trên hiểu biết thật về vấn đề của họ.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Khi khách tự nói ra vấn đề, sức thuyết phục mạnh hơn nhiều so với khi bạn nói thay họ.\u003c/p>"},{"id":"50-khi-can-xay-dung-quan-he-dai-han-sau-lan-ban-dau-tien","level":2,"title":"50. Khi cần xây dựng quan hệ dài hạn sau lần bán đầu tiên","audio":"https://files.catbox.moe/08af0j.mp3","duration":null,"text":"Khi cần xây dựng quan hệ dài hạn sau lần bán đầu tiên\n\nBối cảnh: Nhiều người nghĩ bán xong là kết thúc. Thực ra bán xong mới là lúc niềm tin được kiểm chứng. Khách có quay lại hay giới thiệu người khác không phụ thuộc rất nhiều vào giai đoạn sau mua.\n\nLỗi thường gặp:\nChốt xong thì biến mất.\nChỉ liên hệ khi muốn bán thêm.\nKhông hướng dẫn khách dùng đúng.\nKhông hỏi lại trải nghiệm sau mua.\n\nCách xử lý có EQ:\n\nSau mua, hãy xuất hiện với vai trò người bảo chứng cho quyết định của khách. Gọi lại không phải để làm phiền, mà để giúp họ thành công với thứ đã mua.\n\nMẫu câu:\n“Em gọi để kiểm tra xem mình sử dụng có vướng điểm nào không.”\n“Có một lỗi nhiều khách mới hay gặp, em nhắc trước để mình tránh.”\n“Sau một tuần, nếu mình thấy chưa phù hợp, em sẽ hỗ trợ điều chỉnh trong phạm vi chính sách.”\n“Em gửi thêm hướng dẫn ngắn để mình khai thác tốt hơn.”\n\nVí dụ cụ thể:\n\nKhách mua máy ảnh lần đầu. Nhân viên chỉ bán máy thì xong một đơn. Nhân viên gửi thêm checklist cài đặt ban đầu, nhắc khách sạc pin đúng cách, mời khách quay lại vệ sinh máy miễn phí sau một tháng. Lần sau khách mua ống kính, họ sẽ nhớ người đã giúp họ dùng tốt món đầu tiên.\n\nLiên hệ sách kinh điển:\nTừ *The Little Red Book of Selling* của Jeffrey Gitomer: khách hàng trung thành đến từ giá trị và trải nghiệm nhất quán, không chỉ từ kỹ thuật chốt sale.\nTừ *Đắc Nhân Tâm*: quan tâm thật lòng không kết thúc khi mình đạt được điều mình muốn.\n\nNguyên tắc rút ra: Bán hàng giỏi không phải là chốt được khách một lần; đó là làm khách thấy quyết định mua của họ ngày càng đúng.","html":"\u003ch3>50. Khi cần xây dựng quan hệ dài hạn sau lần bán đầu tiên\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Nhiều người nghĩ bán xong là kết thúc. Thực ra bán xong mới là lúc niềm tin được kiểm chứng. Khách có quay lại hay giới thiệu người khác không phụ thuộc rất nhiều vào giai đoạn sau mua.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Chốt xong thì biến mất.\u003c/li>\n\u003cli>Chỉ liên hệ khi muốn bán thêm.\u003c/li>\n\u003cli>Không hướng dẫn khách dùng đúng.\u003c/li>\n\u003cli>Không hỏi lại trải nghiệm sau mua.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Sau mua, hãy xuất hiện với vai trò người bảo chứng cho quyết định của khách. Gọi lại không phải để làm phiền, mà để giúp họ thành công với thứ đã mua.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em gọi để kiểm tra xem mình sử dụng có vướng điểm nào không.”\u003c/li>\n\u003cli>“Có một lỗi nhiều khách mới hay gặp, em nhắc trước để mình tránh.”\u003c/li>\n\u003cli>“Sau một tuần, nếu mình thấy chưa phù hợp, em sẽ hỗ trợ điều chỉnh trong phạm vi chính sách.”\u003c/li>\n\u003cli>“Em gửi thêm hướng dẫn ngắn để mình khai thác tốt hơn.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách mua máy ảnh lần đầu. Nhân viên chỉ bán máy thì xong một đơn. Nhân viên gửi thêm checklist cài đặt ban đầu, nhắc khách sạc pin đúng cách, mời khách quay lại vệ sinh máy miễn phí sau một tháng. Lần sau khách mua ống kính, họ sẽ nhớ người đã giúp họ dùng tốt món đầu tiên.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Little Red Book of Selling* của Jeffrey Gitomer: khách hàng trung thành đến từ giá trị và trải nghiệm nhất quán, không chỉ từ kỹ thuật chốt sale.\u003c/li>\n\u003cli>Từ *Đắc Nhân Tâm*: quan tâm thật lòng không kết thúc khi mình đạt được điều mình muốn.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Bán hàng giỏi không phải là chốt được khách một lần; đó là làm khách thấy quyết định mua của họ ngày càng đúng.\u003c/p>"},{"id":"51-khi-gap-khach-biet-het-roi","level":2,"title":"51. Khi gặp khách “biết hết rồi”","audio":"https://files.catbox.moe/ugpkot.mp3","duration":null,"text":"Khi gặp khách “biết hết rồi”\n\nBối cảnh: Khách nói: “Tôi tìm hiểu hết rồi”, “Tôi biết cái này rồi”, “Em khỏi tư vấn nhiều.” Nếu người bán cố chứng minh mình biết hơn, cuộc nói chuyện sẽ thành đấu trí.\n\nLỗi thường gặp:\nPhủ nhận hiểu biết của khách.\nDạy lại từ đầu.\nCố bắt lỗi thông tin khách đưa ra.\nTự ái vì khách không nghe mình.\n\nCách xử lý có EQ:\n\nHãy công nhận sự chuẩn bị của khách, rồi bổ sung góc nhìn mà họ có thể chưa có: kinh nghiệm triển khai, lỗi thường gặp, rủi ro sau mua, hoặc tiêu chí so sánh.\n\nMẫu câu:\n“Mình đã tìm hiểu trước như vậy rất tốt, em sẽ không nói lại phần cơ bản.”\n“Em xin bổ sung vài điểm thực tế mà khách hay chỉ thấy sau khi dùng.”\n“Trong các thông tin mình đã xem, điểm nào khiến mình tin nhất và điểm nào còn lăn tăn?”\n“Em sẽ đóng vai trò kiểm tra rủi ro giúp mình trước khi quyết.”\n\nVí dụ cụ thể:\n\nKhách mua laptop nói đã xem review hết. Nhân viên không cần đọc lại cấu hình. Hãy hỏi: “Anh/chị dùng máy này để làm việc cố định hay mang đi nhiều? Review thường nói hiệu năng, nhưng ít nói về độ nóng, pin và bảo hành khi dùng ở cường độ cao.” Bạn tôn trọng kiến thức của khách, đồng thời mở ra vùng giá trị mới.\n\nLiên hệ sách kinh điển:\nTừ *The Challenger Sale*: khách hàng hiện đại đã tự nghiên cứu nhiều; người bán cần mang đến insight mới, không chỉ thông tin có sẵn.\nTừ *To Sell Is Human*: người bán không còn độc quyền thông tin, nên giá trị nằm ở khả năng làm rõ và chọn lọc.\n\nNguyên tắc rút ra: Với khách “biết hết”, đừng tranh làm thầy. Hãy làm người giúp họ ra quyết định ít rủi ro hơn.","html":"\u003ch3>51. Khi gặp khách “biết hết rồi”\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách nói: “Tôi tìm hiểu hết rồi”, “Tôi biết cái này rồi”, “Em khỏi tư vấn nhiều.” Nếu người bán cố chứng minh mình biết hơn, cuộc nói chuyện sẽ thành đấu trí.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Phủ nhận hiểu biết của khách.\u003c/li>\n\u003cli>Dạy lại từ đầu.\u003c/li>\n\u003cli>Cố bắt lỗi thông tin khách đưa ra.\u003c/li>\n\u003cli>Tự ái vì khách không nghe mình.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy công nhận sự chuẩn bị của khách, rồi bổ sung góc nhìn mà họ có thể chưa có: kinh nghiệm triển khai, lỗi thường gặp, rủi ro sau mua, hoặc tiêu chí so sánh.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Mình đã tìm hiểu trước như vậy rất tốt, em sẽ không nói lại phần cơ bản.”\u003c/li>\n\u003cli>“Em xin bổ sung vài điểm thực tế mà khách hay chỉ thấy sau khi dùng.”\u003c/li>\n\u003cli>“Trong các thông tin mình đã xem, điểm nào khiến mình tin nhất và điểm nào còn lăn tăn?”\u003c/li>\n\u003cli>“Em sẽ đóng vai trò kiểm tra rủi ro giúp mình trước khi quyết.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách mua laptop nói đã xem review hết. Nhân viên không cần đọc lại cấu hình. Hãy hỏi: “Anh/chị dùng máy này để làm việc cố định hay mang đi nhiều? Review thường nói hiệu năng, nhưng ít nói về độ nóng, pin và bảo hành khi dùng ở cường độ cao.” Bạn tôn trọng kiến thức của khách, đồng thời mở ra vùng giá trị mới.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Challenger Sale*: khách hàng hiện đại đã tự nghiên cứu nhiều; người bán cần mang đến insight mới, không chỉ thông tin có sẵn.\u003c/li>\n\u003cli>Từ *To Sell Is Human*: người bán không còn độc quyền thông tin, nên giá trị nằm ở khả năng làm rõ và chọn lọc.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Với khách “biết hết”, đừng tranh làm thầy. Hãy làm người giúp họ ra quyết định ít rủi ro hơn.\u003c/p>"},{"id":"52-khi-khach-thich-the-dien-va-so-bi-xem-la-khong-biet","level":2,"title":"52. Khi khách thích thể diện và sợ bị xem là không biết","audio":"https://files.catbox.moe/r8y574.mp3","duration":null,"text":"Khi khách thích thể diện và sợ bị xem là không biết\n\nBối cảnh: Có khách không hỏi dù chưa hiểu, vì sợ bị đánh giá. Có người gật đầu nhưng về sau làm sai. Đặc biệt trong nhóm khách có địa vị, câu “tôi không biết” đôi khi rất khó nói.\n\nLỗi thường gặp:\nHỏi: “Anh/chị hiểu chưa?” khiến khách ngại nói chưa.\nGiải thích bằng thuật ngữ.\nSửa lỗi khách trước mặt người khác.\nCười nhẹ khi khách hỏi điều cơ bản.\n\nCách xử lý có EQ:\n\nHãy bình thường hóa sự nhầm lẫn. Đưa trách nhiệm làm rõ về phía mình, không đặt gánh nặng lên khách.\n\nMẫu câu:\n“Phần này nhiều người dễ nhầm vì có hai khái niệm gần giống nhau.”\n“Em nói lại bằng ví dụ cho dễ hình dung.”\n“Để em kiểm tra xem em giải thích đã đủ rõ chưa: bước tiếp theo mình chỉ cần làm hai việc.”\n“Mình không cần nhớ hết, em gửi lại bản tóm tắt để mình tiện xem.”\n\nVí dụ cụ thể:\n\nMột khách lớn tuổi làm thủ tục ngân hàng, ký sai chỗ. Nhân viên không nói: “Bác ký nhầm rồi.” Câu tốt hơn: “Chỗ này nhiều người hay ký nhầm vì hai ô nằm gần nhau. Bác ký giúp cháu ở ô này, còn ô kia để ngân hàng xác nhận.” Khách được sửa mà không bị mất mặt.\n\nLiên hệ sách kinh điển:\nTừ *Đắc Nhân Tâm*: giữ thể diện cho người khác là một trong những cách sâu nhất để giữ quan hệ.\nTừ *Influence*: con người thường muốn hành động nhất quán với hình ảnh của mình. Nếu bạn làm họ thấy ngu, họ sẽ bảo vệ hình ảnh thay vì nghe bạn.\n\nNguyên tắc rút ra: Người càng trọng thể diện càng cần được giải thích theo cách không làm họ thấy mình kém.","html":"\u003ch3>52. Khi khách thích thể diện và sợ bị xem là không biết\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Có khách không hỏi dù chưa hiểu, vì sợ bị đánh giá. Có người gật đầu nhưng về sau làm sai. Đặc biệt trong nhóm khách có địa vị, câu “tôi không biết” đôi khi rất khó nói.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Hỏi: “Anh/chị hiểu chưa?” khiến khách ngại nói chưa.\u003c/li>\n\u003cli>Giải thích bằng thuật ngữ.\u003c/li>\n\u003cli>Sửa lỗi khách trước mặt người khác.\u003c/li>\n\u003cli>Cười nhẹ khi khách hỏi điều cơ bản.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Hãy bình thường hóa sự nhầm lẫn. Đưa trách nhiệm làm rõ về phía mình, không đặt gánh nặng lên khách.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Phần này nhiều người dễ nhầm vì có hai khái niệm gần giống nhau.”\u003c/li>\n\u003cli>“Em nói lại bằng ví dụ cho dễ hình dung.”\u003c/li>\n\u003cli>“Để em kiểm tra xem em giải thích đã đủ rõ chưa: bước tiếp theo mình chỉ cần làm hai việc.”\u003c/li>\n\u003cli>“Mình không cần nhớ hết, em gửi lại bản tóm tắt để mình tiện xem.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Một khách lớn tuổi làm thủ tục ngân hàng, ký sai chỗ. Nhân viên không nói: “Bác ký nhầm rồi.” Câu tốt hơn: “Chỗ này nhiều người hay ký nhầm vì hai ô nằm gần nhau. Bác ký giúp cháu ở ô này, còn ô kia để ngân hàng xác nhận.” Khách được sửa mà không bị mất mặt.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Đắc Nhân Tâm*: giữ thể diện cho người khác là một trong những cách sâu nhất để giữ quan hệ.\u003c/li>\n\u003cli>Từ *Influence*: con người thường muốn hành động nhất quán với hình ảnh của mình. Nếu bạn làm họ thấy ngu, họ sẽ bảo vệ hình ảnh thay vì nghe bạn.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Người càng trọng thể diện càng cần được giải thích theo cách không làm họ thấy mình kém.\u003c/p>"},{"id":"53-khi-nguoi-ban-can-chot-nhung-khong-muon-tao-ap-luc-re-tien","level":2,"title":"53. Khi người bán cần chốt nhưng không muốn tạo áp lực rẻ tiền","audio":"https://files.catbox.moe/pump19.mp3","duration":null,"text":"Khi người bán cần chốt nhưng không muốn tạo áp lực rẻ tiền\n\nBối cảnh: Khách đã đủ thông tin, nhu cầu rõ, phương án phù hợp. Nhưng nếu không chốt, cuộc trò chuyện kéo dài mãi. Chốt sale không phải là ép; chốt là giúp khách chuyển từ cân nhắc sang hành động khi điều kiện đã đủ.\n\nLỗi thường gặp:\nDùng chiêu khan hiếm giả.\nGiảm giá liên tục.\nHỏi “anh/chị mua không?” quá thẳng và khô.\nKhông tóm tắt lại lý do mua.\n\nCách xử lý có EQ:\n\nChốt bằng sự rõ ràng: nhắc lại nhu cầu, phương án, lợi ích, bước tiếp theo. Nếu khách chưa sẵn sàng, quay lại điểm còn lăn tăn.\n\nMẫu câu:\n“Mình đã thống nhất ba tiêu chí: bền, dễ dùng và bảo hành rõ. Phương án này khớp cả ba.”\n“Nếu mình thấy ổn, bước tiếp theo là em giữ hàng và làm phiếu xác nhận.”\n“Trước khi chốt, còn điểm nào khiến mình chưa yên tâm không ạ?”\n“Nếu mình cần thêm thời gian, em tóm tắt lại để mình cân nhắc cho dễ.”\n\nVí dụ cụ thể:\n\nKhách chọn gói dịch vụ chăm sóc fanpage. Sau khi thống nhất mục tiêu, ngân sách và lịch đăng, sale nói: “Vậy phương án phù hợp nhất là gói 3 tháng để đủ thời gian đo dữ liệu. Nếu anh/chị đồng ý, hôm nay mình chốt phạm vi công việc, ngày mai em gửi timeline chi tiết.” Đây là chốt bằng bước hành động, không phải ép mua.\n\nLiên hệ sách kinh điển:\nTừ *The Psychology of Selling* của Brian Tracy: chốt bán hàng hiệu quả thường đến sau khi nhu cầu và giá trị đã rõ, không phải từ một câu thần chú cuối cùng.\nTừ *SPIN Selling*: trong bán hàng lớn, cam kết tiếp theo có thể là một bước tiến hợp lý, không nhất thiết là ký ngay.\n\nNguyên tắc rút ra: Chốt sale tử tế là giúp khách ra quyết định rõ ràng, không phải dồn khách vào góc.","html":"\u003ch3>53. Khi người bán cần chốt nhưng không muốn tạo áp lực rẻ tiền\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Khách đã đủ thông tin, nhu cầu rõ, phương án phù hợp. Nhưng nếu không chốt, cuộc trò chuyện kéo dài mãi. Chốt sale không phải là ép; chốt là giúp khách chuyển từ cân nhắc sang hành động khi điều kiện đã đủ.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Dùng chiêu khan hiếm giả.\u003c/li>\n\u003cli>Giảm giá liên tục.\u003c/li>\n\u003cli>Hỏi “anh/chị mua không?” quá thẳng và khô.\u003c/li>\n\u003cli>Không tóm tắt lại lý do mua.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Chốt bằng sự rõ ràng: nhắc lại nhu cầu, phương án, lợi ích, bước tiếp theo. Nếu khách chưa sẵn sàng, quay lại điểm còn lăn tăn.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Mình đã thống nhất ba tiêu chí: bền, dễ dùng và bảo hành rõ. Phương án này khớp cả ba.”\u003c/li>\n\u003cli>“Nếu mình thấy ổn, bước tiếp theo là em giữ hàng và làm phiếu xác nhận.”\u003c/li>\n\u003cli>“Trước khi chốt, còn điểm nào khiến mình chưa yên tâm không ạ?”\u003c/li>\n\u003cli>“Nếu mình cần thêm thời gian, em tóm tắt lại để mình cân nhắc cho dễ.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Khách chọn gói dịch vụ chăm sóc fanpage. Sau khi thống nhất mục tiêu, ngân sách và lịch đăng, sale nói: “Vậy phương án phù hợp nhất là gói 3 tháng để đủ thời gian đo dữ liệu. Nếu anh/chị đồng ý, hôm nay mình chốt phạm vi công việc, ngày mai em gửi timeline chi tiết.” Đây là chốt bằng bước hành động, không phải ép mua.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *The Psychology of Selling* của Brian Tracy: chốt bán hàng hiệu quả thường đến sau khi nhu cầu và giá trị đã rõ, không phải từ một câu thần chú cuối cùng.\u003c/li>\n\u003cli>Từ *SPIN Selling*: trong bán hàng lớn, cam kết tiếp theo có thể là một bước tiến hợp lý, không nhất thiết là ký ngay.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Chốt sale tử tế là giúp khách ra quyết định rõ ràng, không phải dồn khách vào góc.\u003c/p>"},{"id":"54-khi-phai-giao-tiep-voi-nguoi-muu-mo-nhung-van-giu-minh","level":2,"title":"54. Khi phải giao tiếp với người mưu mô nhưng vẫn giữ mình","audio":"https://files.catbox.moe/kibgt3.mp3","duration":null,"text":"Khi phải giao tiếp với người mưu mô nhưng vẫn
