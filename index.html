<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tiếp Khách" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Đắc Nhân Tâm Trong Tiếp Khách</title>
    <style>
:root {
  color-scheme: light dark;
  --bg: #f5f2ec;
  --paper: #fffaf1;
  --ink: #161616;
  --muted: #6f6a61;
  --line: #ded6c8;
  --accent: #0f766e;
  --accent-strong: #115e59;
  --player: #111827;
  --player-ink: #f9fafb;
  --shadow: 0 16px 50px rgba(31, 27, 20, 0.14);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button,
input,
select {
  font: inherit;
}

.app-shell {
  min-height: 100vh;
  padding-bottom: 168px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 22px clamp(16px, 4vw, 44px);
  border-bottom: 1px solid var(--line);
  background: rgba(255, 250, 241, 0.92);
  backdrop-filter: blur(14px);
  position: sticky;
  top: 0;
  z-index: 10;
}

.eyebrow {
  margin: 0 0 4px;
  color: var(--accent-strong);
  font-size: 0.78rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 0;
  font-size: clamp(1.25rem, 3vw, 2.1rem);
  line-height: 1.12;
}

.icon-text {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 0;
  border-radius: 8px;
  padding: 10px 14px;
  background: var(--accent);
  color: white;
  cursor: pointer;
  white-space: nowrap;
}

.hidden {
  display: none;
}

.layout {
  display: grid;
  grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
  gap: clamp(16px, 3vw, 32px);
  max-width: 1280px;
  margin: 0 auto;
  padding: 24px clamp(14px, 3vw, 36px);
}

.library,
.reader {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: var(--shadow);
}

.library {
  align-self: start;
  position: sticky;
  top: 96px;
  max-height: calc(100vh - 132px);
  overflow: hidden;
}

.library-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  padding: 16px;
  border-bottom: 1px solid var(--line);
}

.library-header h2 {
  margin: 0;
  font-size: 1rem;
}

.library-header span {
  color: var(--muted);
  font-size: 0.86rem;
}

.playlist {
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 188px);
  overflow: auto;
  padding: 8px;
}

.track-button {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  width: 100%;
  min-height: 52px;
  border: 0;
  border-radius: 8px;
  padding: 10px;
  background: transparent;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

.track-button:hover,
.track-button.active {
  background: #e7f5f1;
}

.track-button.level-1 {
  font-weight: 800;
}

.track-number {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 999px;
  background: #e8dfd0;
  color: #4b4236;
  font-size: 0.78rem;
  font-weight: 800;
}

.track-button.active .track-number {
  background: var(--accent);
  color: white;
}

.track-name {
  min-width: 0;
  line-height: 1.25;
}

.reader {
  min-height: 66vh;
  padding: clamp(20px, 4vw, 42px);
}

.reader-heading {
  border-bottom: 1px solid var(--line);
  margin-bottom: 22px;
  padding-bottom: 16px;
}

.reader-heading h2 {
  margin-bottom: 0;
  font-size: clamp(1.5rem, 3vw, 2.4rem);
  line-height: 1.12;
}

.chapter-content {
  max-width: 820px;
  font-size: clamp(1rem, 1.5vw, 1.12rem);
  line-height: 1.72;
}

.chapter-content h2,
.chapter-content h3 {
  line-height: 1.2;
}

.chapter-content h2 {
  font-size: 1.5rem;
}

.chapter-content h3 {
  font-size: 1.18rem;
  margin-top: 1.6em;
}

.chapter-content li {
  margin-bottom: 0.45em;
}

.player {
  position: fixed;
  right: 0;
  bottom: 0;
  left: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(170px, 320px) minmax(220px, 1fr) auto;
  gap: 16px;
  align-items: center;
  padding: 14px max(14px, env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom))
    max(14px, env(safe-area-inset-left));
  background: var(--player);
  color: var(--player-ink);
  box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.28);
}

.now-playing {
  min-width: 0;
}

.now-playing p {
  overflow: hidden;
  margin: 0 0 4px;
  font-weight: 800;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.now-playing span {
  color: #cbd5e1;
  font-size: 0.85rem;
}

.timeline {
  display: grid;
  grid-template-columns: 48px minmax(120px, 1fr) 48px;
  gap: 8px;
  align-items: center;
}

.timeline span {
  color: #e5e7eb;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

input[type="range"] {
  width: 100%;
  accent-color: #2dd4bf;
}

.controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.round,
.play {
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  cursor: pointer;
}

.round {
  width: 42px;
  height: 42px;
  background: #263244;
  color: white;
}

.play {
  width: 56px;
  height: 56px;
  background: #2dd4bf;
  color: #06201d;
  font-size: 1.2rem;
  font-weight: 900;
}

select {
  height: 42px;
  border: 1px solid #334155;
  border-radius: 8px;
  background: #1f2937;
  color: white;
  padding: 0 10px;
}

@media (max-width: 860px) {
  .app-shell {
    padding-bottom: 238px;
  }

  .topbar {
    align-items: flex-start;
  }

  .layout {
    grid-template-columns: 1fr;
    padding-bottom: 28px;
  }

  .library {
    position: static;
    max-height: none;
  }

  .playlist {
    max-height: 36vh;
  }

  .player {
    grid-template-columns: 1fr;
    gap: 10px;
  }

  .controls {
    justify-content: center;
    flex-wrap: wrap;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111827;
    --paper: #182132;
    --ink: #f8fafc;
    --muted: #cbd5e1;
    --line: #334155;
    --accent: #2dd4bf;
    --accent-strong: #5eead4;
    --shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
  }

  .topbar {
    background: rgba(17, 24, 39, 0.92);
  }

  .track-button:hover,
  .track-button.active {
    background: #143c3a;
  }

  .track-number {
    background: #334155;
    color: #f8fafc;
  }
}

</style>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Sách nói</p>
          <h1>Đắc Nhân Tâm Trong Tiếp Khách</h1>
        </div>
        <button id="installButton" class="icon-text hidden" type="button" title="Cài lên màn hình chính">
          <span aria-hidden="true">＋</span>
          <span>Cài app</span>
        </button>
      </header>

      <main class="layout">
        <aside class="library" aria-label="Mục lục sách nói">
          <div class="library-header">
            <h2>Mục lục</h2>
            <span id="trackCount">0 mục</span>
          </div>
          <nav id="playlist" class="playlist"></nav>
        </aside>

        <section class="reader" aria-live="polite">
          <div class="reader-heading">
            <p id="partLabel" class="eyebrow">Đang chọn</p>
            <h2 id="trackTitle">Đang tải sách...</h2>
          </div>
          <article id="chapterContent" class="chapter-content"></article>
        </section>
      </main>

      <footer class="player" aria-label="Trình phát sách nói">
        <div class="now-playing">
          <p id="miniTitle">Đang tải...</p>
          <span id="miniMeta">Sẵn sàng</span>
        </div>

        <div class="timeline">
          <span id="currentTime">0:00</span>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Tua sách nói" />
          <span id="duration">0:00</span>
        </div>

        <div class="controls">
          <button id="prevButton" class="round" type="button" title="Mục trước" aria-label="Mục trước">‹</button>
          <button id="backButton" class="round" type="button" title="Lùi 15 giây" aria-label="Lùi 15 giây">−15</button>
          <button id="playButton" class="play" type="button" title="Phát hoặc tạm dừng" aria-label="Phát hoặc tạm dừng">▶</button>
          <button id="forwardButton" class="round" type="button" title="Tiến 30 giây" aria-label="Tiến 30 giây">+30</button>
          <button id="nextButton" class="round" type="button" title="Mục tiếp" aria-label="Mục tiếp">›</button>
          <select id="speed" title="Tốc độ đọc" aria-label="Tốc độ đọc">
            <option value="0.85">0.85x</option>
            <option value="1" selected>1x</option>
            <option value="1.15">1.15x</option>
            <option value="1.3">1.3x</option>
            <option value="1.5">1.5x</option>
          </select>
        </div>

        <audio id="audio" preload="metadata"></audio>
      </footer>
    </div>

    <script>window.__AUDIOBOOK_DATA__ = {"title":"Đắc Nhân Tâm Trong Tiếp Khách","subtitle":"Bộ quy tắc ứng xử và giao tiếp linh hoạt với mọi kiểu khách hàng","generatedAt":"2026-05-10T18:32:22.152Z","tracks":[{"id":"loi-mo-dau-cai-goc-cua-giao-tiep-cao-tay","level":1,"title":"Lời mở đầu: Cái gốc của giao tiếp cao tay","audio":"https://files.catbox.moe/cc2v87.mp3","duration":null,"text":"Lời mở đầu: Cái gốc của giao tiếp cao tay\n\nGiao tiếp giỏi không phải là nói hay. Nói hay chỉ là phần ngọn. Giao tiếp giỏi là biết lúc nào cần nói, lúc nào nên im, lúc nào cần nhìn thẳng, lúc nào nên nhường một nhịp, lúc nào phải giữ nguyên tắc, lúc nào nên cho người ta một bậc thang để đi xuống.\n\nNgười giao tiếp non thường muốn thắng trong câu nói. Người giao tiếp chín chắn muốn thắng trong kết quả. Cao hơn nữa, người có EQ cao không cần ai thua: khách vẫn được tôn trọng, mình vẫn giữ được thế, việc vẫn được giải quyết.\n\nTrong tiếp khách, bán hàng, công sở hay bàn tiệc, con người không chỉ nghe bằng tai. Họ nghe bằng cái tôi, bằng lòng tự trọng, bằng nỗi sợ bị coi thường, bằng nhu cầu được nhìn nhận. Vì vậy, một lời nói sai có thể làm hỏng cả quan hệ; một câu đúng lúc có thể mở một cánh cửa.\n\nCuốn sách này không dạy bạn trở thành người khéo léo theo nghĩa luôn uốn mình. Nó dạy bạn cách vừa mềm vừa chắc: mềm trong thái độ, chắc trong nguyên tắc; ấm trong cách nói, rõ trong thông tin; linh hoạt với từng người, nhưng không đánh mất cốt cách.","html":"\u003ch2>Lời mở đầu: Cái gốc của giao tiếp cao tay\u003c/h2>\n\u003cp>Giao tiếp giỏi không phải là nói hay. Nói hay chỉ là phần ngọn. Giao tiếp giỏi là biết lúc nào cần nói, lúc nào nên im, lúc nào cần nhìn thẳng, lúc nào nên nhường một nhịp, lúc nào phải giữ nguyên tắc, lúc nào nên cho người ta một bậc thang để đi xuống.\u003c/p>\n\u003cp>Người giao tiếp non thường muốn thắng trong câu nói. Người giao tiếp chín chắn muốn thắng trong kết quả. Cao hơn nữa, người có EQ cao không cần ai thua: khách vẫn được tôn trọng, mình vẫn giữ được thế, việc vẫn được giải quyết.\u003c/p>\n\u003cp>Trong tiếp khách, bán hàng, công sở hay bàn tiệc, con người không chỉ nghe bằng tai. Họ nghe bằng cái tôi, bằng lòng tự trọng, bằng nỗi sợ bị coi thường, bằng nhu cầu được nhìn nhận. Vì vậy, một lời nói sai có thể làm hỏng cả quan hệ; một câu đúng lúc có thể mở một cánh cửa.\u003c/p>\n\u003cp>Cuốn sách này không dạy bạn trở thành người khéo léo theo nghĩa luôn uốn mình. Nó dạy bạn cách vừa mềm vừa chắc: mềm trong thái độ, chắc trong nguyên tắc; ấm trong cách nói, rõ trong thông tin; linh hoạt với từng người, nhưng không đánh mất cốt cách.\u003c/p>"},{"id":"phan-i-nen-mong-nhan-tam","level":1,"title":"Phần I - Nền móng nhân tâm","audio":"https://files.catbox.moe/sgynnz.mp3","duration":null,"text":"Phần I - Nền móng nhân tâm","html":"\u003ch2>Phần I - Nền móng nhân tâm\u003c/h2>"},{"id":"1-ton-trong-la-nen-linh-hoat-la-nghe","level":2,"title":"1. Tôn trọng là nền, linh hoạt là nghệ","audio":"https://files.catbox.moe/k883zu.mp3","duration":null,"text":"Tôn trọng là nền, linh hoạt là nghệ\n\nQuy tắc đầu tiên: gặp ai cũng tôn trọng, nhưng không ứng xử với ai cũng một kiểu.\n\nNgười có địa vị cao thường cần sự ngắn gọn, đúng trọng tâm, không làm mất thời gian. Người yếu thế thường cần được nói chậm, giải thích rõ, không bị làm quê. Người đang nóng cần được hạ nhiệt trước khi nghe lý lẽ. Người im lặng cần được hỏi mở, nhưng không bị ép.\n\nTôn trọng không có nghĩa là khúm núm. Linh hoạt không có nghĩa là mất lập trường. Một người giao tiếp cao tay có thể gọi bác nông dân bằng “bác” với sự kính trọng thật, đồng thời nói chuyện với chủ tịch tập đoàn bằng “anh/chị” với sự bình tĩnh ngang bằng.\n\nNguyên tắc:\nKhông đánh giá con người qua quần áo, xe cộ, cách nói, tuổi tác.\nKhông vì khách giàu mà quá dè dặt, không vì khách nghèo mà qua loa.\nKhông vì khách có quyền mà sợ, không vì khách thấp cổ mà coi thường.\nTôn trọng là đồng tiền chung được chấp nhận ở mọi tầng lớp xã hội.\n\nMẫu câu nên dùng:\n“Em/chúng tôi sẽ xử lý đúng phần việc của mình để đảm bảo quyền lợi cho anh/chị.”\n“Để không làm mất thời gian của mình, em xin đi thẳng vào vấn đề chính.”\n“Phần này dễ nhầm, em sẽ hướng dẫn từng bước cho mình.”","html":"\u003ch3>1. Tôn trọng là nền, linh hoạt là nghệ\u003c/h3>\n\u003cp>Quy tắc đầu tiên: gặp ai cũng tôn trọng, nhưng không ứng xử với ai cũng một kiểu.\u003c/p>\n\u003cp>Người có địa vị cao thường cần sự ngắn gọn, đúng trọng tâm, không làm mất thời gian. Người yếu thế thường cần được nói chậm, giải thích rõ, không bị làm quê. Người đang nóng cần được hạ nhiệt trước khi nghe lý lẽ. Người im lặng cần được hỏi mở, nhưng không bị ép.\u003c/p>\n\u003cp>Tôn trọng không có nghĩa là khúm núm. Linh hoạt không có nghĩa là mất lập trường. Một người giao tiếp cao tay có thể gọi bác nông dân bằng “bác” với sự kính trọng thật, đồng thời nói chuyện với chủ tịch tập đoàn bằng “anh/chị” với sự bình tĩnh ngang bằng.\u003c/p>\n\u003cp>Nguyên tắc:\u003c/p>\n\u003cul>\n\u003cli>Không đánh giá con người qua quần áo, xe cộ, cách nói, tuổi tác.\u003c/li>\n\u003cli>Không vì khách giàu mà quá dè dặt, không vì khách nghèo mà qua loa.\u003c/li>\n\u003cli>Không vì khách có quyền mà sợ, không vì khách thấp cổ mà coi thường.\u003c/li>\n\u003cli>Tôn trọng là đồng tiền chung được chấp nhận ở mọi tầng lớp xã hội.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu nên dùng:\u003c/p>\n\u003cul>\n\u003cli>“Em/chúng tôi sẽ xử lý đúng phần việc của mình để đảm bảo quyền lợi cho anh/chị.”\u003c/li>\n\u003cli>“Để không làm mất thời gian của mình, em xin đi thẳng vào vấn đề chính.”\u003c/li>\n\u003cli>“Phần này dễ nhầm, em sẽ hướng dẫn từng bước cho mình.”\u003c/li>\n\u003c/ul>"},{"id":"2-doc-nguoi-nhung-khong-phan-xet-nguoi","level":2,"title":"2. Đọc người nhưng không phán xét người","audio":"https://files.catbox.moe/436dnw.mp3","duration":null,"text":"Đọc người nhưng không phán xét người\n\n“Đọc người” là năng lực cần có. “Phán xét người” là lỗi rất dễ mắc. Sự khác nhau nằm ở chỗ: đọc người để phục vụ tốt hơn; phán xét người để xếp hạng cao thấp.\n\nTrong bán hàng có một bài học lớn: “nhìn mặt bắt hình dong” dễ dẫn đến cái kết ê chề. Khách ăn mặc giản dị có thể là người có khả năng mua hàng cao. Khách nói nhỏ nhẹ có thể là người quyết định. Khách hỏi nhiều không phải vì không có tiền, mà vì cần được yên tâm.\n\nHãy quan sát:\nKhách đang vội hay có thời gian?\nKhách muốn được tư vấn hay muốn tự quyết?\nKhách cần thông tin kỹ thuật hay cần cảm giác an toàn?\nKhách đang phòng thủ, thử thách, hay thực sự cần giúp?\n\nNhưng đừng kết luận vội vàng:\nKhách mặc đơn giản không có nghĩa là không mua.\nKhách cầu kỳ không có nghĩa là khó tính vô lý.\nKhách im lặng không có nghĩa là không quan tâm.\nKhách nóng nảy không có nghĩa là xấu tính.","html":"\u003ch3>2. Đọc người nhưng không phán xét người\u003c/h3>\n\u003cp>“Đọc người” là năng lực cần có. “Phán xét người” là lỗi rất dễ mắc. Sự khác nhau nằm ở chỗ: đọc người để phục vụ tốt hơn; phán xét người để xếp hạng cao thấp.\u003c/p>\n\u003cp>Trong bán hàng có một bài học lớn: “nhìn mặt bắt hình dong” dễ dẫn đến cái kết ê chề. Khách ăn mặc giản dị có thể là người có khả năng mua hàng cao. Khách nói nhỏ nhẹ có thể là người quyết định. Khách hỏi nhiều không phải vì không có tiền, mà vì cần được yên tâm.\u003c/p>\n\u003cp>Hãy quan sát:\u003c/p>\n\u003cul>\n\u003cli>Khách đang vội hay có thời gian?\u003c/li>\n\u003cli>Khách muốn được tư vấn hay muốn tự quyết?\u003c/li>\n\u003cli>Khách cần thông tin kỹ thuật hay cần cảm giác an toàn?\u003c/li>\n\u003cli>Khách đang phòng thủ, thử thách, hay thực sự cần giúp?\u003c/li>\n\u003c/ul>\n\u003cp>Nhưng đừng kết luận vội vàng:\u003c/p>\n\u003cul>\n\u003cli>Khách mặc đơn giản không có nghĩa là không mua.\u003c/li>\n\u003cli>Khách cầu kỳ không có nghĩa là khó tính vô lý.\u003c/li>\n\u003cli>Khách im lặng không có nghĩa là không quan tâm.\u003c/li>\n\u003cli>Khách nóng nảy không có nghĩa là xấu tính.\u003c/li>\n\u003c/ul>"},{"id":"3-giu-the-dien-cho-khach-la-giu-duong-lui-cho-minh","level":2,"title":"3. Giữ thể diện cho khách là giữ đường lui cho mình","audio":"https://files.catbox.moe/qxdqwu.mp3","duration":null,"text":"Giữ thể diện cho khách là giữ đường lui cho mình\n\nNhiều cuộc xung đột không bùng nổ vì vấn đề quá lớn, mà vì ai đó bị làm mất mặt. Khi con người bị chạm vào thể diện, họ có xu hướng bảo vệ cái tôi trước khi nghe giải pháp.\n\nNgười EQ cao không bao giờ đẩy người khác vào chân tường. Kể cả khi khách sai, đồng nghiệp sai, cấp dưới sai, hay lãnh đạo sai, vẫn phải cho họ một đường lui.\n\nThay vì nói:\n“Anh sai rồi.”\n“Chị không hiểu quy trình.”\n“Cái này ai cũng biết.”\n“Em đã nói rồi mà.”\n\nHãy nói:\n“Chỗ này rất dễ nhầm, mình điều chỉnh lại một chút là được.”\n“Có thể lúc đầu thông tin chưa rõ, em xin nói lại cho chính xác.”\n“Để đảm bảo hồ sơ của mình không bị trả về, mình sửa phần này giúp em.”\n\nGiữ thể diện cho người khác không làm mình thấp đi. Ngược lại, nó cho thấy mình có bản lĩnh.","html":"\u003ch3>3. Giữ thể diện cho khách là giữ đường lui cho mình\u003c/h3>\n\u003cp>Nhiều cuộc xung đột không bùng nổ vì vấn đề quá lớn, mà vì ai đó bị làm mất mặt. Khi con người bị chạm vào thể diện, họ có xu hướng bảo vệ cái tôi trước khi nghe giải pháp.\u003c/p>\n\u003cp>Người EQ cao không bao giờ đẩy người khác vào chân tường. Kể cả khi khách sai, đồng nghiệp sai, cấp dưới sai, hay lãnh đạo sai, vẫn phải cho họ một đường lui.\u003c/p>\n\u003cp>Thay vì nói:\u003c/p>\n\u003cul>\n\u003cli>“Anh sai rồi.”\u003c/li>\n\u003cli>“Chị không hiểu quy trình.”\u003c/li>\n\u003cli>“Cái này ai cũng biết.”\u003c/li>\n\u003cli>“Em đã nói rồi mà.”\u003c/li>\n\u003c/ul>\n\u003cp>Hãy nói:\u003c/p>\n\u003cul>\n\u003cli>“Chỗ này rất dễ nhầm, mình điều chỉnh lại một chút là được.”\u003c/li>\n\u003cli>“Có thể lúc đầu thông tin chưa rõ, em xin nói lại cho chính xác.”\u003c/li>\n\u003cli>“Để đảm bảo hồ sơ của mình không bị trả về, mình sửa phần này giúp em.”\u003c/li>\n\u003c/ul>\n\u003cp>Giữ thể diện cho người khác không làm mình thấp đi. Ngược lại, nó cho thấy mình có bản lĩnh.\u003c/p>"},{"id":"4-thanh-y-thu-ngon-ngu-khong-can-noi-qua-nhieu","level":2,"title":"4. Thành ý: thứ ngôn ngữ không cần nói quá nhiều","audio":"https://files.catbox.moe/74erpp.mp3","duration":null,"text":"Thành ý: thứ ngôn ngữ không cần nói quá nhiều\n\nTrong một mô tả video có nhắc đến “đỉnh cao thể hiện thành ý”. Thành ý không phải là nói “em rất chân thành” thật nhiều. Thành ý nằm ở chi tiết.\n\nThành ý là:\nĐến đúng giờ.\nNhớ điều người ta đã nói.\nLàm đúng điều đã hứa.\nGiải thích rõ khi không thể giúp.\nKhông biến sự tử tế thành màn trình diễn.\nGiúp người khác mà không bắt họ mang nợ tâm lý.\n\nTrong giao tiếp với khách, thành ý thể hiện ở việc không để khách phải hỏi lại nhiều lần, không đá trách nhiệm, không dùng câu “quy định là vậy” để kết thúc mọi chuyện. Nếu không giải quyết được, ít nhất hãy cho khách biết vì sao và bước tiếp theo là gì.","html":"\u003ch3>4. Thành ý: thứ ngôn ngữ không cần nói quá nhiều\u003c/h3>\n\u003cp>Trong một mô tả video có nhắc đến “đỉnh cao thể hiện thành ý”. Thành ý không phải là nói “em rất chân thành” thật nhiều. Thành ý nằm ở chi tiết.\u003c/p>\n\u003cp>Thành ý là:\u003c/p>\n\u003cul>\n\u003cli>Đến đúng giờ.\u003c/li>\n\u003cli>Nhớ điều người ta đã nói.\u003c/li>\n\u003cli>Làm đúng điều đã hứa.\u003c/li>\n\u003cli>Giải thích rõ khi không thể giúp.\u003c/li>\n\u003cli>Không biến sự tử tế thành màn trình diễn.\u003c/li>\n\u003cli>Giúp người khác mà không bắt họ mang nợ tâm lý.\u003c/li>\n\u003c/ul>\n\u003cp>Trong giao tiếp với khách, thành ý thể hiện ở việc không để khách phải hỏi lại nhiều lần, không đá trách nhiệm, không dùng câu “quy định là vậy” để kết thúc mọi chuyện. Nếu không giải quyết được, ít nhất hãy cho khách biết vì sao và bước tiếp theo là gì.\u003c/p>"},{"id":"5-noi-it-ma-trung-nghe-nhieu-ma-sau","level":2,"title":"5. Nói ít mà trúng, nghe nhiều mà sâu","audio":"https://files.catbox.moe/djqvk4.mp3","duration":null,"text":"Nói ít mà trúng, nghe nhiều mà sâu\n\nNgười mới vào nghề hay sợ im lặng, nên nói nhiều để lấp đầy khoảng trống. Người có kinh nghiệm hiểu rằng im lặng đúng lúc cũng là một phần của giao tiếp.\n\nCông thức nghe sâu:\nNghe sự việc: khách đang nói về chuyện gì?\nNghe cảm xúc: họ đang bực, sợ, buồn, nghi ngờ, hay nóng ruột?\nNghe nhu cầu ẩn sau: họ cần giải pháp, cần lời xin lỗi, cần được công nhận, hay cần người chịu trách nhiệm?\n\nKhi phản hồi, đừng nói hết những gì mình biết. Hãy nói đúng phần khách cần nghe.\n\nMẫu câu:\n“Em xin nhắc lại để chắc là mình hiểu đúng.”\n“Ý của anh/chị là phần này đang làm mình mất thời gian, đúng không ạ?”\n“Em sẽ tách vấn đề này thành hai phần để xử lý cho rõ.”","html":"\u003ch3>5. Nói ít mà trúng, nghe nhiều mà sâu\u003c/h3>\n\u003cp>Người mới vào nghề hay sợ im lặng, nên nói nhiều để lấp đầy khoảng trống. Người có kinh nghiệm hiểu rằng im lặng đúng lúc cũng là một phần của giao tiếp.\u003c/p>\n\u003cp>Công thức nghe sâu:\u003c/p>\n\u003cp>1. Nghe sự việc: khách đang nói về chuyện gì? 2. Nghe cảm xúc: họ đang bực, sợ, buồn, nghi ngờ, hay nóng ruột? 3. Nghe nhu cầu ẩn sau: họ cần giải pháp, cần lời xin lỗi, cần được công nhận, hay cần người chịu trách nhiệm?\u003c/p>\n\u003cp>Khi phản hồi, đừng nói hết những gì mình biết. Hãy nói đúng phần khách cần nghe.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin nhắc lại để chắc là mình hiểu đúng.”\u003c/li>\n\u003cli>“Ý của anh/chị là phần này đang làm mình mất thời gian, đúng không ạ?”\u003c/li>\n\u003cli>“Em sẽ tách vấn đề này thành hai phần để xử lý cho rõ.”\u003c/li>\n\u003c/ul>"},{"id":"phan-ii-giao-tiep-voi-khach-hang","level":1,"title":"Phần II - Giao tiếp với khách hàng","audio":"https://files.catbox.moe/3ax85k.mp3","duration":null,"text":"Phần II - Giao tiếp với khách hàng","html":"\u003ch2>Phần II - Giao tiếp với khách hàng\u003c/h2>"},{"id":"6-khach-la-nguoi-co-nhu-cau-khong-phai-doi-thu","level":2,"title":"6. Khách là người có nhu cầu, không phải đối thủ","audio":"https://files.catbox.moe/9arjm2.mp3","duration":null,"text":"Khách là người có nhu cầu, không phải đối thủ\n\nMột lỗi lớn trong dịch vụ là xem khách khó tính như kẻ gây rối. Khi đã gắn nhãn khách là “đối thủ”, giọng nói sẽ cứng, ánh mắt sẽ lạnh, câu trả lời sẽ có mùi phòng vệ. Khách cảm nhận được điều đó và càng khó chịu hơn.\n\nKhách có thể sai, nhưng cảm xúc của họ thường có lý do. Họ sợ mất tiền, sợ bị lừa, sợ mất thời gian, sợ bị coi thường, sợ không ai đứng về phía mình. Việc của người giao tiếp là tách “hành vi khó chịu” ra khỏi “nhu cầu cần được xử lý”.\n\nQuy tắc:\nKhông đối đầu cảm xúc bằng cảm xúc.\nKhông trả lời câu công kích cá nhân bằng câu công kích cá nhân.\nKhông biến lời phản ánh thành trận tranh luận.\nLuôn đưa cuộc nói chuyện về việc cần xử lý.\n\nMẫu câu:\n“Em sẽ tập trung vào việc cần giải quyết trước.”\n“Mình cho em một phút kiểm tra để trả lời chính xác.”\n“Em ghi nhận phản ánh của anh/chị. Bây giờ mình cùng xem cách xử lý nhanh nhất.”","html":"\u003ch3>6. Khách là người có nhu cầu, không phải đối thủ\u003c/h3>\n\u003cp>Một lỗi lớn trong dịch vụ là xem khách khó tính như kẻ gây rối. Khi đã gắn nhãn khách là “đối thủ”, giọng nói sẽ cứng, ánh mắt sẽ lạnh, câu trả lời sẽ có mùi phòng vệ. Khách cảm nhận được điều đó và càng khó chịu hơn.\u003c/p>\n\u003cp>Khách có thể sai, nhưng cảm xúc của họ thường có lý do. Họ sợ mất tiền, sợ bị lừa, sợ mất thời gian, sợ bị coi thường, sợ không ai đứng về phía mình. Việc của người giao tiếp là tách “hành vi khó chịu” ra khỏi “nhu cầu cần được xử lý”.\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Không đối đầu cảm xúc bằng cảm xúc.\u003c/li>\n\u003cli>Không trả lời câu công kích cá nhân bằng câu công kích cá nhân.\u003c/li>\n\u003cli>Không biến lời phản ánh thành trận tranh luận.\u003c/li>\n\u003cli>Luôn đưa cuộc nói chuyện về việc cần xử lý.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em sẽ tập trung vào việc cần giải quyết trước.”\u003c/li>\n\u003cli>“Mình cho em một phút kiểm tra để trả lời chính xác.”\u003c/li>\n\u003cli>“Em ghi nhận phản ánh của anh/chị. Bây giờ mình cùng xem cách xử lý nhanh nhất.”\u003c/li>\n\u003c/ul>"},{"id":"7-khi-khach-giau-co-dia-vi-co-quyen-luc","level":2,"title":"7. Khi khách giàu, có địa vị, có quyền lực","audio":"https://files.catbox.moe/f104cf.mp3","duration":null,"text":"Khi khách giàu, có địa vị, có quyền lực\n\nKhách ở vị trí cao thường không thích bị dạy đời, không thích nghe giải thích dài, và đặc biệt không thích bị làm mất mặt trước người khác. Nhưng điều đó không có nghĩa là phải cung phụng họ.\n\nVới nhóm này, cần ba yếu tố:\nNgắn gọn: đi thẳng vào trọng tâm.\nChắc chắn: nói cái mình biết, đừng hứa cái mình không kiểm soát.\nKín kẽ: nếu có lỗi hoặc vấn đề nhạy cảm, xử lý riêng khi có thể.\n\nMẫu câu:\n“Em xin nói ngắn gọn để không làm mất thời gian của anh/chị.”\n“Phương án tốt nhất hiện tại là...”\n“Phần này em cần xử lý đúng quy trình để bảo vệ quyền lợi cho mình về sau.”\n“Nếu tiện, em xin trao đổi riêng phần này để đảm bảo sự tế nhị.”\n\nĐiều cần tránh:\nNịnh quá lộ.\nSợ hãi đến mức mất nguyên tắc.\nCãi lý trước mặt người đi cùng họ.\nHứa “em lo được hết” khi không có thẩm quyền.","html":"\u003ch3>7. Khi khách giàu, có địa vị, có quyền lực\u003c/h3>\n\u003cp>Khách ở vị trí cao thường không thích bị dạy đời, không thích nghe giải thích dài, và đặc biệt không thích bị làm mất mặt trước người khác. Nhưng điều đó không có nghĩa là phải cung phụng họ.\u003c/p>\n\u003cp>Với nhóm này, cần ba yếu tố:\u003c/p>\n\u003cul>\n\u003cli>Ngắn gọn: đi thẳng vào trọng tâm.\u003c/li>\n\u003cli>Chắc chắn: nói cái mình biết, đừng hứa cái mình không kiểm soát.\u003c/li>\n\u003cli>Kín kẽ: nếu có lỗi hoặc vấn đề nhạy cảm, xử lý riêng khi có thể.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin nói ngắn gọn để không làm mất thời gian của anh/chị.”\u003c/li>\n\u003cli>“Phương án tốt nhất hiện tại là...”\u003c/li>\n\u003cli>“Phần này em cần xử lý đúng quy trình để bảo vệ quyền lợi cho mình về sau.”\u003c/li>\n\u003cli>“Nếu tiện, em xin trao đổi riêng phần này để đảm bảo sự tế nhị.”\u003c/li>\n\u003c/ul>\n\u003cp>Điều cần tránh:\u003c/p>\n\u003cul>\n\u003cli>Nịnh quá lộ.\u003c/li>\n\u003cli>Sợ hãi đến mức mất nguyên tắc.\u003c/li>\n\u003cli>Cãi lý trước mặt người đi cùng họ.\u003c/li>\n\u003cli>Hứa “em lo được hết” khi không có thẩm quyền.\u003c/li>\n\u003c/ul>"},{"id":"8-khi-khach-binh-dan-yeu-the-it-hieu-quy-trinh","level":2,"title":"8. Khi khách bình dân, yếu thế, ít hiểu quy trình","audio":"https://files.catbox.moe/2a5xxl.mp3","duration":null,"text":"Khi khách bình dân, yếu thế, ít hiểu quy trình\n\nNgười yếu thế thường không thiếu lý lẽ, họ thiếu cảm giác an toàn. Họ có thể sợ bị gạt ra, sợ nói sai, sợ ký nhầm, sợ bị yêu cầu thêm giấy tờ mà không hiểu vì sao.\n\nVới nhóm này, sự tử tế nằm ở việc nói rõ, chậm, đơn giản.\n\nNguyên tắc:\nDùng ngôn ngữ đời thường, tránh thuật ngữ.\nNói từng bước một.\nChỉ rõ cần làm gì, ở đâu, gặp ai, khi nào.\nKiểm tra lại xem họ đã hiểu chưa mà không làm họ xấu hổ.\n\nMẫu câu:\n“Không sao ạ, phần này nhiều người cũng hay nhầm.”\n“Mình làm theo ba bước này là được.”\n“Giấy này mình giữ lại, giấy này nộp cho em.”\n“Em viết lại để mình về làm cho dễ.”","html":"\u003ch3>8. Khi khách bình dân, yếu thế, ít hiểu quy trình\u003c/h3>\n\u003cp>Người yếu thế thường không thiếu lý lẽ, họ thiếu cảm giác an toàn. Họ có thể sợ bị gạt ra, sợ nói sai, sợ ký nhầm, sợ bị yêu cầu thêm giấy tờ mà không hiểu vì sao.\u003c/p>\n\u003cp>Với nhóm này, sự tử tế nằm ở việc nói rõ, chậm, đơn giản.\u003c/p>\n\u003cp>Nguyên tắc:\u003c/p>\n\u003cul>\n\u003cli>Dùng ngôn ngữ đời thường, tránh thuật ngữ.\u003c/li>\n\u003cli>Nói từng bước một.\u003c/li>\n\u003cli>Chỉ rõ cần làm gì, ở đâu, gặp ai, khi nào.\u003c/li>\n\u003cli>Kiểm tra lại xem họ đã hiểu chưa mà không làm họ xấu hổ.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Không sao ạ, phần này nhiều người cũng hay nhầm.”\u003c/li>\n\u003cli>“Mình làm theo ba bước này là được.”\u003c/li>\n\u003cli>“Giấy này mình giữ lại, giấy này nộp cho em.”\u003c/li>\n\u003cli>“Em viết lại để mình về làm cho dễ.”\u003c/li>\n\u003c/ul>"},{"id":"9-khi-khach-nong-gian-doi-tra-hang-doi-boi-thuong","level":2,"title":"9. Khi khách nóng giận, đòi trả hàng, đòi bồi thường","audio":"https://files.catbox.moe/xigk7u.mp3","duration":null,"text":"Khi khách nóng giận, đòi trả hàng, đòi bồi thường\n\nTrong bán hàng có tình huống khách mang sản phẩm đến đòi trả tiền ngay ngày đầu. Bài học cốt lõi: đừng vội bán sản phẩm, hãy bán sự thấu hiểu. Khi khách đòi trả, điều họ đòi đầu tiên không phải tiền, mà là cảm giác “tôi được nghe nghiêm túc”.\n\nQuy trình 5 bước:\nĐể khách nói hết trong một khoảng an toàn.\nCông nhận cảm xúc, không nhận sai vô điều kiện.\nHỏi câu hỏi làm rõ.\nĐưa quy định và phương án.\nChốt bước tiếp theo bằng thời gian cụ thể.\n\nMẫu câu:\n“Em hiểu việc này làm anh/chị rất khó chịu.”\n“Em xin kiểm tra lại tình trạng sản phẩm và lịch sử giao dịch.”\n“Nếu lỗi thuộc về bên em, bên em sẽ xử lý theo chính sách...”\n“Nếu trường hợp này không đủ điều kiện hoàn tiền, em vẫn có hai phương án để hỗ trợ mình...”\n\nTuyệt đối tránh:\n“Bên em không chịu trách nhiệm.”\n“Chị dùng sai rồi.”\n“Hàng bán rồi không trả.”\n“Quy định thế, không làm gì được.”","html":"\u003ch3>9. Khi khách nóng giận, đòi trả hàng, đòi bồi thường\u003c/h3>\n\u003cp>Trong bán hàng có tình huống khách mang sản phẩm đến đòi trả tiền ngay ngày đầu. Bài học cốt lõi: đừng vội bán sản phẩm, hãy bán sự thấu hiểu. Khi khách đòi trả, điều họ đòi đầu tiên không phải tiền, mà là cảm giác “tôi được nghe nghiêm túc”.\u003c/p>\n\u003cp>Quy trình 5 bước:\u003c/p>\n\u003cp>1. Để khách nói hết trong một khoảng an toàn. 2. Công nhận cảm xúc, không nhận sai vô điều kiện. 3. Hỏi câu hỏi làm rõ. 4. Đưa quy định và phương án. 5. Chốt bước tiếp theo bằng thời gian cụ thể.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em hiểu việc này làm anh/chị rất khó chịu.”\u003c/li>\n\u003cli>“Em xin kiểm tra lại tình trạng sản phẩm và lịch sử giao dịch.”\u003c/li>\n\u003cli>“Nếu lỗi thuộc về bên em, bên em sẽ xử lý theo chính sách...”\u003c/li>\n\u003cli>“Nếu trường hợp này không đủ điều kiện hoàn tiền, em vẫn có hai phương án để hỗ trợ mình...”\u003c/li>\n\u003c/ul>\n\u003cp>Tuyệt đối tránh:\u003c/p>\n\u003cul>\n\u003cli>“Bên em không chịu trách nhiệm.”\u003c/li>\n\u003cli>“Chị dùng sai rồi.”\u003c/li>\n\u003cli>“Hàng bán rồi không trả.”\u003c/li>\n\u003cli>“Quy định thế, không làm gì được.”\u003c/li>\n\u003c/ul>"},{"id":"10-khi-khach-im-lang-kho-doc-khong-noi-het-y","level":2,"title":"10. Khi khách im lặng, khó đọc, không nói hết ý","audio":"https://files.catbox.moe/kfch54.mp3","duration":null,"text":"Khi khách im lặng, khó đọc, không nói hết ý\n\nKhách im lặng có thể là người cần thời gian. Cũng có thể họ đang thử xem bạn có ép bán, có nóng ruột, có nói quá hay không.\n\nCách ứng xử:\nĐừng nói liên tục.\nĐặt câu hỏi mở.\nĐưa lựa chọn rõ ràng.\nĐể khoảng lặng ngắn cho họ suy nghĩ.\n\nMẫu câu:\n“Anh/chị đang quan tâm nhiều hơn đến chất lượng, giá, hay sự tiện lợi ạ?”\n“Nếu cần so sánh, em có thể đặt hai phương án cạnh nhau cho mình dễ nhìn.”\n“Mình cứ xem thông tin này trước, điểm nào chưa rõ em giải thích thêm.”","html":"\u003ch3>10. Khi khách im lặng, khó đọc, không nói hết ý\u003c/h3>\n\u003cp>Khách im lặng có thể là người cần thời gian. Cũng có thể họ đang thử xem bạn có ép bán, có nóng ruột, có nói quá hay không.\u003c/p>\n\u003cp>Cách ứng xử:\u003c/p>\n\u003cul>\n\u003cli>Đừng nói liên tục.\u003c/li>\n\u003cli>Đặt câu hỏi mở.\u003c/li>\n\u003cli>Đưa lựa chọn rõ ràng.\u003c/li>\n\u003cli>Để khoảng lặng ngắn cho họ suy nghĩ.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Anh/chị đang quan tâm nhiều hơn đến chất lượng, giá, hay sự tiện lợi ạ?”\u003c/li>\n\u003cli>“Nếu cần so sánh, em có thể đặt hai phương án cạnh nhau cho mình dễ nhìn.”\u003c/li>\n\u003cli>“Mình cứ xem thông tin này trước, điểm nào chưa rõ em giải thích thêm.”\u003c/li>\n\u003c/ul>"},{"id":"11-khi-khach-thu-minh-bang-thai-do-kho-chiu","level":2,"title":"11. Khi khách thử mình bằng thái độ khó chịu","audio":"https://files.catbox.moe/wgm2uh.mp3","duration":null,"text":"Khi khách thử mình bằng thái độ khó chịu\n\nCó người dùng sự khó chịu để thử bạn: bạn có bình tĩnh không, có thật sự chuyên nghiệp không, có vì bị nói nặng mà mất cân bằng không.\n\nĐáp án là không cần mềm yếu, cũng không cần cứng đầu. Hãy dùng “giọng thấp, câu ngắn, nói vào việc”.\n\nMẫu câu:\n“Em nghe mình. Việc chính cần xử lý là...”\n“Em sẽ trả lời từng ý để không bị sót.”\n“Phần nào thuộc trách nhiệm của bên em, em sẽ nhận và xử lý.”\n“Phần nào cần mình bổ sung, em sẽ nói rõ để mình chủ động.”","html":"\u003ch3>11. Khi khách thử mình bằng thái độ khó chịu\u003c/h3>\n\u003cp>Có người dùng sự khó chịu để thử bạn: bạn có bình tĩnh không, có thật sự chuyên nghiệp không, có vì bị nói nặng mà mất cân bằng không.\u003c/p>\n\u003cp>Đáp án là không cần mềm yếu, cũng không cần cứng đầu. Hãy dùng “giọng thấp, câu ngắn, nói vào việc”.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em nghe mình. Việc chính cần xử lý là...”\u003c/li>\n\u003cli>“Em sẽ trả lời từng ý để không bị sót.”\u003c/li>\n\u003cli>“Phần nào thuộc trách nhiệm của bên em, em sẽ nhận và xử lý.”\u003c/li>\n\u003cli>“Phần nào cần mình bổ sung, em sẽ nói rõ để mình chủ động.”\u003c/li>\n\u003c/ul>"},{"id":"12-khi-khach-dung-tien-quan-he-hoac-dia-vi-de-ep","level":2,"title":"12. Khi khách dùng tiền, quan hệ hoặc địa vị để ép","audio":"https://files.catbox.moe/ojiau2.mp3","duration":null,"text":"Khi khách dùng tiền, quan hệ hoặc địa vị để ép\n\nĐây là lúc bản lĩnh được thử thách. Nếu cứng quá, khách có thể bùng nổ. Nếu mềm quá, mình mất nguyên tắc. Cách đúng là “tôn trọng con người, kiên định quy trình”.\n\nMẫu câu:\n“Em rất tôn trọng mong muốn xử lý nhanh của anh/chị.”\n“Tuy nhiên phần này bắt buộc phải đúng quy trình để kết quả có giá trị.”\n“Nếu em làm khác, về sau có thể anh/chị mới là người bị ảnh hưởng.”\n“Em đề xuất cách nhanh nhất trong đúng quy định là...”","html":"\u003ch3>12. Khi khách dùng tiền, quan hệ hoặc địa vị để ép\u003c/h3>\n\u003cp>Đây là lúc bản lĩnh được thử thách. Nếu cứng quá, khách có thể bùng nổ. Nếu mềm quá, mình mất nguyên tắc. Cách đúng là “tôn trọng con người, kiên định quy trình”.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em rất tôn trọng mong muốn xử lý nhanh của anh/chị.”\u003c/li>\n\u003cli>“Tuy nhiên phần này bắt buộc phải đúng quy trình để kết quả có giá trị.”\u003c/li>\n\u003cli>“Nếu em làm khác, về sau có thể anh/chị mới là người bị ảnh hưởng.”\u003c/li>\n\u003cli>“Em đề xuất cách nhanh nhất trong đúng quy định là...”\u003c/li>\n\u003c/ul>"},{"id":"phan-iii-tiep-khach-ban-tiec-va-ban-nhau","level":1,"title":"Phần III - Tiếp khách, bàn tiệc và bàn nhậu","audio":"https://files.catbox.moe/ezpmq4.mp3","duration":null,"text":"Phần III - Tiếp khách, bàn tiệc và bàn nhậu","html":"\u003ch2>Phần III - Tiếp khách, bàn tiệc và bàn nhậu\u003c/h2>"},{"id":"13-ban-tiec-la-thao-truong-eq","level":2,"title":"13. Bàn tiệc là thao trường EQ","audio":"https://files.catbox.moe/vcxq3i.mp3","duration":null,"text":"Bàn tiệc là thao trường EQ\n\nMột mô tả video nói: tiệc tùng mở rộng quan hệ không chỉ là ăn uống xã giao, mà là thao trường kiểm chứng kỹ năng giao tiếp và EQ. Câu này rất đúng.\n\nTrên bàn tiệc, người ta nhìn cách bạn:\nChào hỏi ai trước.\nMời ai ngồi đâu.\nCó để ý người ít nói không.\nCó biết đúng lúc nâng chén, đúng lúc hạ chén không.\nCó ép người khác uống không.\nCó nói chuyện làm ai mất mặt không.\n\nBàn tiệc không phải nơi để thể hiện mình thông minh nhất. Đó là nơi để mọi người cảm thấy mình được đặt đúng vị trí.","html":"\u003ch3>13. Bàn tiệc là thao trường EQ\u003c/h3>\n\u003cp>Một mô tả video nói: tiệc tùng mở rộng quan hệ không chỉ là ăn uống xã giao, mà là thao trường kiểm chứng kỹ năng giao tiếp và EQ. Câu này rất đúng.\u003c/p>\n\u003cp>Trên bàn tiệc, người ta nhìn cách bạn:\u003c/p>\n\u003cul>\n\u003cli>Chào hỏi ai trước.\u003c/li>\n\u003cli>Mời ai ngồi đâu.\u003c/li>\n\u003cli>Có để ý người ít nói không.\u003c/li>\n\u003cli>Có biết đúng lúc nâng chén, đúng lúc hạ chén không.\u003c/li>\n\u003cli>Có ép người khác uống không.\u003c/li>\n\u003cli>Có nói chuyện làm ai mất mặt không.\u003c/li>\n\u003c/ul>\n\u003cp>Bàn tiệc không phải nơi để thể hiện mình thông minh nhất. Đó là nơi để mọi người cảm thấy mình được đặt đúng vị trí.\u003c/p>"},{"id":"14-vi-tri-ngoi-loi-moi-chen-ruou-va-cau-chao","level":2,"title":"14. Vị trí ngồi, lời mời, chén rượu và câu chào","audio":"https://files.catbox.moe/tec84k.mp3","duration":null,"text":"Vị trí ngồi, lời mời, chén rượu và câu chào\n\nNgười tinh tế trên bàn tiệc quan sát trước khi hành động. Ai là chủ nhà? Ai là khách chính? Ai là người lớn tuổi? Ai ít nói nhưng có vai trò quyết định? Ai cần được giới thiệu?\n\nQuy tắc:\nKhông tự ý ngồi vị trí trung tâm nếu chưa được mời.\nKhi mời rượu, đừng ép.\nKhi giới thiệu, giới thiệu người thấp vai cho người cao vai trước, nhưng không làm ai bị thấp đi.\nKhi khen, khen hành động cụ thể, không khen quá đà.\n\nMẫu câu:\n“Em xin phép mời anh/chị ngồi vị trí này cho tiện trao đổi.”\n“Em xin nâng ly cảm ơn sự có mặt của mọi người, ai dùng được bao nhiêu mình dùng bấy nhiêu cho vui ạ.”\n“Em xin giới thiệu để hai bên tiện trao đổi...”","html":"\u003ch3>14. Vị trí ngồi, lời mời, chén rượu và câu chào\u003c/h3>\n\u003cp>Người tinh tế trên bàn tiệc quan sát trước khi hành động. Ai là chủ nhà? Ai là khách chính? Ai là người lớn tuổi? Ai ít nói nhưng có vai trò quyết định? Ai cần được giới thiệu?\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Không tự ý ngồi vị trí trung tâm nếu chưa được mời.\u003c/li>\n\u003cli>Khi mời rượu, đừng ép.\u003c/li>\n\u003cli>Khi giới thiệu, giới thiệu người thấp vai cho người cao vai trước, nhưng không làm ai bị thấp đi.\u003c/li>\n\u003cli>Khi khen, khen hành động cụ thể, không khen quá đà.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin phép mời anh/chị ngồi vị trí này cho tiện trao đổi.”\u003c/li>\n\u003cli>“Em xin nâng ly cảm ơn sự có mặt của mọi người, ai dùng được bao nhiêu mình dùng bấy nhiêu cho vui ạ.”\u003c/li>\n\u003cli>“Em xin giới thiệu để hai bên tiện trao đổi...”\u003c/li>\n\u003c/ul>"},{"id":"15-khi-lanh-dao-moi-len-chuc-gap-tinh-huong-kho-xu","level":2,"title":"15. Khi lãnh đạo mới lên chức gặp tình huống khó xử","audio":"https://files.catbox.moe/88kntv.mp3","duration":null,"text":"Khi lãnh đạo mới lên chức gặp tình huống khó xử\n\nMột mô tả video nói về lãnh đạo mới lên chức đi ăn gặp tình huống khó xử. Bài học thường nằm ở việc: người mới có chức dễ bị kéo vào hai cực, hoặc khoe uy quá sớm, hoặc sợ mất lòng nên quá mềm.\n\nCách ứng xử chuẩn:\nKhông vội khẳng định uy quyền bằng giọng nói.\nKhông để người khác lợi dụng bàn tiệc để thử mình.\nTrả lời khó bằng câu trung tính, giữ đường lui cho tất cả.\nNếu cần xử lý vấn đề nhạy cảm, đưa ra khỏi bàn ăn.\n\nMẫu câu:\n“Chuyện này mình ghi nhận, em xin phép sau bữa sẽ trao đổi kỹ hơn.”\n“Hôm nay mình gặp nhau để kết nối trước, việc cụ thể em sẽ sắp xếp một buổi riêng.”\n“Em mới nhận nhiệm vụ nên càng phải nghe nhiều hơn, mong mọi người góp ý thẳng thắn.”","html":"\u003ch3>15. Khi lãnh đạo mới lên chức gặp tình huống khó xử\u003c/h3>\n\u003cp>Một mô tả video nói về lãnh đạo mới lên chức đi ăn gặp tình huống khó xử. Bài học thường nằm ở việc: người mới có chức dễ bị kéo vào hai cực, hoặc khoe uy quá sớm, hoặc sợ mất lòng nên quá mềm.\u003c/p>\n\u003cp>Cách ứng xử chuẩn:\u003c/p>\n\u003cul>\n\u003cli>Không vội khẳng định uy quyền bằng giọng nói.\u003c/li>\n\u003cli>Không để người khác lợi dụng bàn tiệc để thử mình.\u003c/li>\n\u003cli>Trả lời khó bằng câu trung tính, giữ đường lui cho tất cả.\u003c/li>\n\u003cli>Nếu cần xử lý vấn đề nhạy cảm, đưa ra khỏi bàn ăn.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Chuyện này mình ghi nhận, em xin phép sau bữa sẽ trao đổi kỹ hơn.”\u003c/li>\n\u003cli>“Hôm nay mình gặp nhau để kết nối trước, việc cụ thể em sẽ sắp xếp một buổi riêng.”\u003c/li>\n\u003cli>“Em mới nhận nhiệm vụ nên càng phải nghe nhiều hơn, mong mọi người góp ý thẳng thắn.”\u003c/li>\n\u003c/ul>"},{"id":"16-khi-nhan-vien-nhiet-tinh-nhung-thieu-tinh-te","level":2,"title":"16. Khi nhân viên nhiệt tình nhưng thiếu tinh tế","audio":"https://files.catbox.moe/j89cdx.mp3","duration":null,"text":"Khi nhân viên nhiệt tình nhưng thiếu tinh tế\n\nNhiệt tình là tốt, nhưng nhiệt tình không đúng chỗ có thể thành áp lực. Một nhân viên tiếp khách có thể muốn làm vừa lòng lãnh đạo, nhưng lại xen vào câu chuyện không đúng lúc, mời quá nhiều, nói quá dài, hoặc để lộ thông tin không nên nói.\n\nQuy tắc cho nhân viên:\nTrước khi nói, xem vai trò của mình trong cuộc gặp.\nNếu mình là người hỗ trợ, đừng cướp sân khấu của người chủ trì.\nNếu thấy khoảng trống, bổ sung nhẹ; đừng lấp đầy bằng sự ồn ào.\nNếu không chắc, hỏi bằng mắt hoặc câu ngắn.\n\nMẫu câu:\n“Em xin phép bổ sung một ý nếu tiện ạ.”\n“Phần này để anh/chị trao đổi chính, em sẽ chuẩn bị thông tin cần thiết.”\n“Em có cần hỗ trợ thêm gì không ạ?”","html":"\u003ch3>16. Khi nhân viên nhiệt tình nhưng thiếu tinh tế\u003c/h3>\n\u003cp>Nhiệt tình là tốt, nhưng nhiệt tình không đúng chỗ có thể thành áp lực. Một nhân viên tiếp khách có thể muốn làm vừa lòng lãnh đạo, nhưng lại xen vào câu chuyện không đúng lúc, mời quá nhiều, nói quá dài, hoặc để lộ thông tin không nên nói.\u003c/p>\n\u003cp>Quy tắc cho nhân viên:\u003c/p>\n\u003cul>\n\u003cli>Trước khi nói, xem vai trò của mình trong cuộc gặp.\u003c/li>\n\u003cli>Nếu mình là người hỗ trợ, đừng cướp sân khấu của người chủ trì.\u003c/li>\n\u003cli>Nếu thấy khoảng trống, bổ sung nhẹ; đừng lấp đầy bằng sự ồn ào.\u003c/li>\n\u003cli>Nếu không chắc, hỏi bằng mắt hoặc câu ngắn.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin phép bổ sung một ý nếu tiện ạ.”\u003c/li>\n\u003cli>“Phần này để anh/chị trao đổi chính, em sẽ chuẩn bị thông tin cần thiết.”\u003c/li>\n\u003cli>“Em có cần hỗ trợ thêm gì không ạ?”\u003c/li>\n\u003c/ul>"},{"id":"17-cach-cuu-mot-nguoi-khoi-mat-mat-truoc-dam-dong","level":2,"title":"17. Cách cứu một người khỏi mất mặt trước đám đông","audio":"https://files.catbox.moe/kye159.mp3","duration":null,"text":"Cách cứu một người khỏi mất mặt trước đám đông\n\nĐỉnh cao EQ là giúp người khác thoát khỏi thế bị động mà không làm ai biết mình đang cứu. Khi ai đó lỡ lời, nói nhầm, bị hỏi khó, bị ép uống, hoặc bị trêu quá đà, một câu nói đúng lúc có thể đổi hướng cả bàn.\n\nMẫu câu cứu thế:\n“Ý này hay, em xin nói thêm theo một góc khác.”\n“Chắc phần này lúc nãy mình nói vui, còn việc chính là...”\n“Em xin phép kéo câu chuyện về chủ đề ban đầu.”\n“Phần này để em nhận, vì lúc trước em cũng chưa cập nhật đầy đủ.”\n\nNguyên tắc: cứu người khác mà không kể công. Vì kể công sẽ biến sự tinh tế thành sự ban ơn.","html":"\u003ch3>17. Cách cứu một người khỏi mất mặt trước đám đông\u003c/h3>\n\u003cp>Đỉnh cao EQ là giúp người khác thoát khỏi thế bị động mà không làm ai biết mình đang cứu. Khi ai đó lỡ lời, nói nhầm, bị hỏi khó, bị ép uống, hoặc bị trêu quá đà, một câu nói đúng lúc có thể đổi hướng cả bàn.\u003c/p>\n\u003cp>Mẫu câu cứu thế:\u003c/p>\n\u003cul>\n\u003cli>“Ý này hay, em xin nói thêm theo một góc khác.”\u003c/li>\n\u003cli>“Chắc phần này lúc nãy mình nói vui, còn việc chính là...”\u003c/li>\n\u003cli>“Em xin phép kéo câu chuyện về chủ đề ban đầu.”\u003c/li>\n\u003cli>“Phần này để em nhận, vì lúc trước em cũng chưa cập nhật đầy đủ.”\u003c/li>\n\u003c/ul>\n\u003cp>Nguyên tắc: cứu người khác mà không kể công. Vì kể công sẽ biến sự tinh tế thành sự ban ơn.\u003c/p>"},{"id":"18-khi-can-noi-giup-nguoi-khac-ma-khong-qua-phan","level":2,"title":"18. Khi cần nói giúp người khác mà không quá phận","audio":"https://files.catbox.moe/lme05i.mp3","duration":null,"text":"Khi cần nói giúp người khác mà không quá phận\n\nNói giúp là một nghệ thuật. Nói quá ít thì không có tác dụng. Nói quá nhiều thì thành lấn sân.\n\nCông thức:\nXác nhận sự việc: “Theo em được biết...”\nNỗ lực bảo vệ thể diện: “Có thể do thông tin lúc đầu chưa đầy đủ...”\nĐưa lối ra: “Mình có thể xử lý theo hướng...”\n\nMẫu câu:\n“Em xin phép nói thêm một ý để mọi người có thêm bối cảnh.”\n“Bạn ấy có thiếu sót trong cách trình bày, nhưng phần việc cốt lõi đã làm đúng.”\n“Nếu được, mình cho bạn ấy cơ hội bổ sung lại cho tròn ý.”","html":"\u003ch3>18. Khi cần nói giúp người khác mà không quá phận\u003c/h3>\n\u003cp>Nói giúp là một nghệ thuật. Nói quá ít thì không có tác dụng. Nói quá nhiều thì thành lấn sân.\u003c/p>\n\u003cp>Công thức:\u003c/p>\n\u003cul>\n\u003cli>Xác nhận sự việc: “Theo em được biết...”\u003c/li>\n\u003cli>Nỗ lực bảo vệ thể diện: “Có thể do thông tin lúc đầu chưa đầy đủ...”\u003c/li>\n\u003cli>Đưa lối ra: “Mình có thể xử lý theo hướng...”\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin phép nói thêm một ý để mọi người có thêm bối cảnh.”\u003c/li>\n\u003cli>“Bạn ấy có thiếu sót trong cách trình bày, nhưng phần việc cốt lõi đã làm đúng.”\u003c/li>\n\u003cli>“Nếu được, mình cho bạn ấy cơ hội bổ sung lại cho tròn ý.”\u003c/li>\n\u003c/ul>"},{"id":"phan-iv-ban-hang-bang-su-thau-hieu","level":1,"title":"Phần IV - Bán hàng bằng sự thấu hiểu","audio":"https://files.catbox.moe/99pe8o.mp3","duration":null,"text":"Phần IV - Bán hàng bằng sự thấu hiểu","html":"\u003ch2>Phần IV - Bán hàng bằng sự thấu hiểu\u003c/h2>"},{"id":"19-dung-ban-san-pham-hay-ban-su-yen-tam","level":2,"title":"19. Đừng bán sản phẩm, hãy bán sự yên tâm","audio":"https://files.catbox.moe/nezt10.mp3","duration":null,"text":"Đừng bán sản phẩm, hãy bán sự yên tâm\n\nKhách không mua cái điện thoại. Họ mua cảm giác không bị lỗi thời. Khách không mua gói dịch vụ. Họ mua sự nhẹ đầu. Khách không mua bộ vest. Họ mua hình ảnh của mình trong mắt người khác.\n\nNgười bán hàng non tập trung vào tính năng. Người bán hàng khá tập trung vào lợi ích. Người bán hàng giỏi tập trung vào điều khách thật sự lo.\n\nHỏi:\n“Anh/chị dùng sản phẩm này trong bối cảnh nào là chính?”\n“Điều mình lo nhất khi chọn sản phẩm này là gì?”\n“Mình ưu tiên bền, đẹp, tiện, hay tiết kiệm chi phí?”\n\nSau đó mới giới thiệu. Đừng để bài giới thiệu đi trước sự thấu hiểu.","html":"\u003ch3>19. Đừng bán sản phẩm, hãy bán sự yên tâm\u003c/h3>\n\u003cp>Khách không mua cái điện thoại. Họ mua cảm giác không bị lỗi thời. Khách không mua gói dịch vụ. Họ mua sự nhẹ đầu. Khách không mua bộ vest. Họ mua hình ảnh của mình trong mắt người khác.\u003c/p>\n\u003cp>Người bán hàng non tập trung vào tính năng. Người bán hàng khá tập trung vào lợi ích. Người bán hàng giỏi tập trung vào điều khách thật sự lo.\u003c/p>\n\u003cp>Hỏi:\u003c/p>\n\u003cul>\n\u003cli>“Anh/chị dùng sản phẩm này trong bối cảnh nào là chính?”\u003c/li>\n\u003cli>“Điều mình lo nhất khi chọn sản phẩm này là gì?”\u003c/li>\n\u003cli>“Mình ưu tiên bền, đẹp, tiện, hay tiết kiệm chi phí?”\u003c/li>\n\u003c/ul>\n\u003cp>Sau đó mới giới thiệu. Đừng để bài giới thiệu đi trước sự thấu hiểu.\u003c/p>"},{"id":"20-dung-nhin-mat-bat-hinh-dong","level":2,"title":"20. Đừng nhìn mặt bắt hình dong","audio":"https://files.catbox.moe/8jlphe.mp3","duration":null,"text":"Đừng nhìn mặt bắt hình dong\n\nMột bài học bán hàng nói rõ: chị sale nghe lời “nhìn mặt bắt hình dong” và nhận cái kết ê chề. Trong dịch vụ, định kiến là kẻ thù của doanh thu và uy tín.\n\nKhách có thể không giống chân dung khách hàng lý tưởng, nhưng vẫn là người có nhu cầu thật. Đừng soi túi tiền của khách bằng mắt. Hãy hỏi nhu cầu bằng sự tôn trọng.\n\nQuy tắc:\nChào khách như nhau trong 10 giây đầu.\nĐặt câu hỏi như nhau về nhu cầu, không hỏi theo kiểu nghi ngờ khả năng chi trả.\nĐưa lựa chọn theo mức phù hợp, không áp đặt theo vẻ ngoài.\nNếu khách chưa mua, vẫn kết thúc lịch sự.\n\nMẫu câu:\n“Anh/chị muốn xem dòng phổ thông, tầm trung hay cao cấp để em tư vấn đúng hơn ạ?”\n“Em có thể đưa ra vài mức ngân sách khác nhau để mình dễ so sánh.”\n“Mẫu này phù hợp nếu mình ưu tiên..., còn mẫu kia phù hợp nếu mình cần...”","html":"\u003ch3>20. Đừng nhìn mặt bắt hình dong\u003c/h3>\n\u003cp>Một bài học bán hàng nói rõ: chị sale nghe lời “nhìn mặt bắt hình dong” và nhận cái kết ê chề. Trong dịch vụ, định kiến là kẻ thù của doanh thu và uy tín.\u003c/p>\n\u003cp>Khách có thể không giống chân dung khách hàng lý tưởng, nhưng vẫn là người có nhu cầu thật. Đừng soi túi tiền của khách bằng mắt. Hãy hỏi nhu cầu bằng sự tôn trọng.\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Chào khách như nhau trong 10 giây đầu.\u003c/li>\n\u003cli>Đặt câu hỏi như nhau về nhu cầu, không hỏi theo kiểu nghi ngờ khả năng chi trả.\u003c/li>\n\u003cli>Đưa lựa chọn theo mức phù hợp, không áp đặt theo vẻ ngoài.\u003c/li>\n\u003cli>Nếu khách chưa mua, vẫn kết thúc lịch sự.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Anh/chị muốn xem dòng phổ thông, tầm trung hay cao cấp để em tư vấn đúng hơn ạ?”\u003c/li>\n\u003cli>“Em có thể đưa ra vài mức ngân sách khác nhau để mình dễ so sánh.”\u003c/li>\n\u003cli>“Mẫu này phù hợp nếu mình ưu tiên..., còn mẫu kia phù hợp nếu mình cần...”\u003c/li>\n\u003c/ul>"},{"id":"21-khi-khach-doi-tra-tien-ngay-ngay-dau","level":2,"title":"21. Khi khách đòi trả tiền ngay ngày đầu","audio":"https://files.catbox.moe/ovxu0r.mp3","duration":null,"text":"Khi khách đòi trả tiền ngay ngày đầu\n\nTình huống này là bài kiểm tra bản lĩnh dịch vụ. Người mới thường phòng thủ: “Không được trả.” Người giỏi hỏi trước: “Điều gì làm khách thất vọng?”\n\nQuy trình:\nCảm ơn khách đã quay lại phản ánh.\nHỏi rõ lý do.\nKiểm tra điều kiện chính sách.\nNếu trả được, xử lý nhanh và giữ tôn trọng.\nNếu không trả được, đưa phương án thay thế có giá trị.\n\nMẫu câu:\n“Cảm ơn anh/chị đã quay lại ngay để bên em kiểm tra kịp thời.”\n“Mình cho em biết điểm nào không như mong đợi ạ?”\n“Em sẽ không tranh luận với cảm nhận của mình. Em chỉ cần kiểm tra thêm để đưa phương án đúng.”","html":"\u003ch3>21. Khi khách đòi trả tiền ngay ngày đầu\u003c/h3>\n\u003cp>Tình huống này là bài kiểm tra bản lĩnh dịch vụ. Người mới thường phòng thủ: “Không được trả.” Người giỏi hỏi trước: “Điều gì làm khách thất vọng?”\u003c/p>\n\u003cp>Quy trình:\u003c/p>\n\u003cp>1. Cảm ơn khách đã quay lại phản ánh. 2. Hỏi rõ lý do. 3. Kiểm tra điều kiện chính sách. 4. Nếu trả được, xử lý nhanh và giữ tôn trọng. 5. Nếu không trả được, đưa phương án thay thế có giá trị.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Cảm ơn anh/chị đã quay lại ngay để bên em kiểm tra kịp thời.”\u003c/li>\n\u003cli>“Mình cho em biết điểm nào không như mong đợi ạ?”\u003c/li>\n\u003cli>“Em sẽ không tranh luận với cảm nhận của mình. Em chỉ cần kiểm tra thêm để đưa phương án đúng.”\u003c/li>\n\u003c/ul>"},{"id":"22-to-chat-sale-nhin-nhu-cau-an-sau-loi-noi","level":2,"title":"22. Tố chất sale: nhìn nhu cầu ẩn sau lời nói","audio":"https://files.catbox.moe/0pirgv.mp3","duration":null,"text":"Tố chất sale: nhìn nhu cầu ẩn sau lời nói\n\nMột người có “tố chất sale” không phải là người nói thao thao. Đó là người nhìn thấy cơ hội phục vụ trong một câu hỏi bình thường.\n\nKhách hỏi “có giảm giá không?” không chỉ là muốn rẻ. Có thể họ muốn biết mình có bị mua hớ không. Khách hỏi “bảo hành thế nào?” không chỉ là cần điều kiện; họ sợ rủi ro. Khách nói “để tôi suy nghĩ” có thể là chưa đủ tin.\n\nCách xử lý:\nVới câu hỏi giá: nói về giá trị và lựa chọn.\nVới câu hỏi bảo hành: nói về sự an tâm.\nVới câu trì hoãn: hỏi xem còn điểm nào chưa rõ.\n\nMẫu câu:\n“Ngoài giá, điều nào quan trọng nhất với mình khi chọn sản phẩm này?”\n“Em nói rõ phần bảo hành để mình yên tâm trước khi quyết.”\n“Nếu còn điểm nào khiến mình lăn tăn, em giải thích ngay để mình khỏi phải đoán.”","html":"\u003ch3>22. Tố chất sale: nhìn nhu cầu ẩn sau lời nói\u003c/h3>\n\u003cp>Một người có “tố chất sale” không phải là người nói thao thao. Đó là người nhìn thấy cơ hội phục vụ trong một câu hỏi bình thường.\u003c/p>\n\u003cp>Khách hỏi “có giảm giá không?” không chỉ là muốn rẻ. Có thể họ muốn biết mình có bị mua hớ không. Khách hỏi “bảo hành thế nào?” không chỉ là cần điều kiện; họ sợ rủi ro. Khách nói “để tôi suy nghĩ” có thể là chưa đủ tin.\u003c/p>\n\u003cp>Cách xử lý:\u003c/p>\n\u003cul>\n\u003cli>Với câu hỏi giá: nói về giá trị và lựa chọn.\u003c/li>\n\u003cli>Với câu hỏi bảo hành: nói về sự an tâm.\u003c/li>\n\u003cli>Với câu trì hoãn: hỏi xem còn điểm nào chưa rõ.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Ngoài giá, điều nào quan trọng nhất với mình khi chọn sản phẩm này?”\u003c/li>\n\u003cli>“Em nói rõ phần bảo hành để mình yên tâm trước khi quyết.”\u003c/li>\n\u003cli>“Nếu còn điểm nào khiến mình lăn tăn, em giải thích ngay để mình khỏi phải đoán.”\u003c/li>\n\u003c/ul>"},{"id":"23-giu-khach-bang-nhan-pham-khong-giu-bang-meo-vat","level":2,"title":"23. Giữ khách bằng nhân phẩm, không giữ bằng mẹo vặt","audio":"https://files.catbox.moe/txutg6.mp3","duration":null,"text":"Giữ khách bằng nhân phẩm, không giữ bằng mẹo vặt\n\nMẹo vặt có thể chốt một đơn. Nhân phẩm giữ được một đời khách. Khách có thể quên tên sản phẩm, nhưng khó quên cảm giác được đối xử tử tế.\n\nQuy tắc:\nKhông nói quá công dụng.\nKhông giấu điều kiện bất lợi.\nKhông kích động nỗi sợ để ép mua.\nKhông để khách mua sai chỉ vì mình cần doanh số.\n\nMẫu câu:\n“Nếu nhu cầu của mình là như vậy, em nghĩ gói nhỏ hơn đã đủ.”\n“Phần này em cần nói trước để mình khỏi bất ngờ.”\n“Sản phẩm này tốt, nhưng không phải lựa chọn phù hợp nhất cho trường hợp của anh/chị.”","html":"\u003ch3>23. Giữ khách bằng nhân phẩm, không giữ bằng mẹo vặt\u003c/h3>\n\u003cp>Mẹo vặt có thể chốt một đơn. Nhân phẩm giữ được một đời khách. Khách có thể quên tên sản phẩm, nhưng khó quên cảm giác được đối xử tử tế.\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Không nói quá công dụng.\u003c/li>\n\u003cli>Không giấu điều kiện bất lợi.\u003c/li>\n\u003cli>Không kích động nỗi sợ để ép mua.\u003c/li>\n\u003cli>Không để khách mua sai chỉ vì mình cần doanh số.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Nếu nhu cầu của mình là như vậy, em nghĩ gói nhỏ hơn đã đủ.”\u003c/li>\n\u003cli>“Phần này em cần nói trước để mình khỏi bất ngờ.”\u003c/li>\n\u003cli>“Sản phẩm này tốt, nhưng không phải lựa chọn phù hợp nhất cho trường hợp của anh/chị.”\u003c/li>\n\u003c/ul>"},{"id":"phan-v-cong-so-quyen-luc-va-quan-he","level":1,"title":"Phần V - Công sở, quyền lực và quan hệ","audio":"https://files.catbox.moe/gq9r97.mp3","duration":null,"text":"Phần V - Công sở, quyền lực và quan hệ","html":"\u003ch2>Phần V - Công sở, quyền lực và quan hệ\u003c/h2>"},{"id":"24-di-cung-sep-di-thang-may-gap-lanh-dao","level":2,"title":"24. Đi cùng sếp, đi thang máy, gặp lãnh đạo","audio":"https://files.catbox.moe/p9djwv.mp3","duration":null,"text":"Đi cùng sếp, đi thang máy, gặp lãnh đạo\n\nCác mô tả video nhắc đến “đi xe cùng sếp”, “elevator speech giữa hai lãnh đạo”, “tiếp xúc lãnh đạo”. Những khoảnh khắc ngắn như thang máy, hành lang, xe hơi lại là nơi EQ lộ rõ nhất.\n\nQuy tắc khi gặp lãnh đạo trong khoảng thời gian ngắn:\nKhông tranh thủ kể lể dài.\nKhông than vãn.\nKhông đưa vấn đề lớn vào nơi không tiện.\nNếu cần nói, nói một câu có giá trị.\n\nCông thức elevator speech:\nBối cảnh: “Về dự án A...”\nKết quả: “Hiện đã xong 70%...”\nVấn đề: “Còn một điểm cần quyết...”\nĐề xuất: “Em đề xuất hướng...”\n\nMẫu câu:\n“Em xin báo cáo ngắn một ý, nếu anh/chị tiện nghe.”\n“Việc này em đã chuẩn bị hai phương án, khi nào tiện em xin trình bày kỹ.”\n“Cảm ơn anh/chị, em sẽ gửi tóm tắt để mình không mất thời gian lúc này.”","html":"\u003ch3>24. Đi cùng sếp, đi thang máy, gặp lãnh đạo\u003c/h3>\n\u003cp>Các mô tả video nhắc đến “đi xe cùng sếp”, “elevator speech giữa hai lãnh đạo”, “tiếp xúc lãnh đạo”. Những khoảnh khắc ngắn như thang máy, hành lang, xe hơi lại là nơi EQ lộ rõ nhất.\u003c/p>\n\u003cp>Quy tắc khi gặp lãnh đạo trong khoảng thời gian ngắn:\u003c/p>\n\u003cul>\n\u003cli>Không tranh thủ kể lể dài.\u003c/li>\n\u003cli>Không than vãn.\u003c/li>\n\u003cli>Không đưa vấn đề lớn vào nơi không tiện.\u003c/li>\n\u003cli>Nếu cần nói, nói một câu có giá trị.\u003c/li>\n\u003c/ul>\n\u003cp>Công thức elevator speech:\u003c/p>\n\u003cp>1. Bối cảnh: “Về dự án A...” 2. Kết quả: “Hiện đã xong 70%...” 3. Vấn đề: “Còn một điểm cần quyết...” 4. Đề xuất: “Em đề xuất hướng...”\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em xin báo cáo ngắn một ý, nếu anh/chị tiện nghe.”\u003c/li>\n\u003cli>“Việc này em đã chuẩn bị hai phương án, khi nào tiện em xin trình bày kỹ.”\u003c/li>\n\u003cli>“Cảm ơn anh/chị, em sẽ gửi tóm tắt để mình không mất thời gian lúc này.”\u003c/li>\n\u003c/ul>"},{"id":"25-lay-long-dung-cach-ton-trong-nguoi-gan-sep","level":2,"title":"25. Lấy lòng đúng cách: tôn trọng người gần sếp","audio":"https://files.catbox.moe/skd29h.mp3","duration":null,"text":"Lấy lòng đúng cách: tôn trọng người gần sếp\n\nMột video nói về “lấy lòng thư ký của sếp”. Bài học không phải là xu nịnh. Bài học là: trong mọi hệ thống, người gần công việc và gần lịch trình có vai trò quan trọng. Tôn trọng họ là tôn trọng hệ thống.\n\nLấy lòng sai cách:\nTặng quà để mua chuộc.\nNói xấu người khác để tạo thân.\nQuá nhiệt tình đến mức giả tạo.\n\nLấy lòng đúng cách:\nLịch sự, đúng hẹn, cung cấp thông tin rõ.\nKhông gây khó cho người điều phối.\nGhi nhận công sức của họ.\nKhông coi họ là “người giúp việc”.\n\nMẫu câu:\n“Cảm ơn chị đã sắp xếp lịch, em gửi thông tin ngắn gọn để chị tiện theo dõi.”\n“Nếu có thay đổi, em báo sớm để mình dễ điều phối.”\n“Phần này nhờ chị hướng dẫn giúp em cách trình cho đúng quy trình.”","html":"\u003ch3>25. Lấy lòng đúng cách: tôn trọng người gần sếp\u003c/h3>\n\u003cp>Một video nói về “lấy lòng thư ký của sếp”. Bài học không phải là xu nịnh. Bài học là: trong mọi hệ thống, người gần công việc và gần lịch trình có vai trò quan trọng. Tôn trọng họ là tôn trọng hệ thống.\u003c/p>\n\u003cp>Lấy lòng sai cách:\u003c/p>\n\u003cul>\n\u003cli>Tặng quà để mua chuộc.\u003c/li>\n\u003cli>Nói xấu người khác để tạo thân.\u003c/li>\n\u003cli>Quá nhiệt tình đến mức giả tạo.\u003c/li>\n\u003c/ul>\n\u003cp>Lấy lòng đúng cách:\u003c/p>\n\u003cul>\n\u003cli>Lịch sự, đúng hẹn, cung cấp thông tin rõ.\u003c/li>\n\u003cli>Không gây khó cho người điều phối.\u003c/li>\n\u003cli>Ghi nhận công sức của họ.\u003c/li>\n\u003cli>Không coi họ là “người giúp việc”.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Cảm ơn chị đã sắp xếp lịch, em gửi thông tin ngắn gọn để chị tiện theo dõi.”\u003c/li>\n\u003cli>“Nếu có thay đổi, em báo sớm để mình dễ điều phối.”\u003c/li>\n\u003cli>“Phần này nhờ chị hướng dẫn giúp em cách trình cho đúng quy trình.”\u003c/li>\n\u003c/ul>"},{"id":"26-khi-dong-nghiep-gianh-khach-cuop-cong-chay-kpi","level":2,"title":"26. Khi đồng nghiệp giành khách, cướp công, chạy KPI","audio":"https://files.catbox.moe/wio2th.mp3","duration":null,"text":"Khi đồng nghiệp giành khách, cướp công, chạy KPI\n\nNhiều mô tả nhắc đến đồng nghiệp mưu mô, giành khách, cướp KPI. Đây là tình huống dễ khiến người ta nóng mặt và phản ứng sai. Nếu bạn nói to ngay, bạn có thể biến mình thành người gây rối. Nếu im luôn, bạn bị lấn tới.\n\nQuy trình:\nGhi lại bằng chứng sự việc.\nTrao đổi riêng nếu còn có thể.\nNói bằng nguyên tắc công việc, không công kích nhân cách.\nĐưa vấn đề lên cấp quản lý nếu lặp lại.\nĐề xuất cơ chế tránh lặp lại.\n\nMẫu câu riêng:\n“Khách này em đang phụ trách từ ngày..., việc anh/chị liên hệ trực tiếp làm thông tin bị lệch. Mình thống nhất lại cách phối hợp nhé.”\n\nMẫu câu với quản lý:\n“Em xin báo cáo một việc ảnh hưởng đến phân công khách hàng. Em không muốn quy thành lỗi cá nhân, chỉ muốn thống nhất cơ chế để tránh xung đột KPI.”","html":"\u003ch3>26. Khi đồng nghiệp giành khách, cướp công, chạy KPI\u003c/h3>\n\u003cp>Nhiều mô tả nhắc đến đồng nghiệp mưu mô, giành khách, cướp KPI. Đây là tình huống dễ khiến người ta nóng mặt và phản ứng sai. Nếu bạn nói to ngay, bạn có thể biến mình thành người gây rối. Nếu im luôn, bạn bị lấn tới.\u003c/p>\n\u003cp>Quy trình:\u003c/p>\n\u003cp>1. Ghi lại bằng chứng sự việc. 2. Trao đổi riêng nếu còn có thể. 3. Nói bằng nguyên tắc công việc, không công kích nhân cách. 4. Đưa vấn đề lên cấp quản lý nếu lặp lại. 5. Đề xuất cơ chế tránh lặp lại.\u003c/p>\n\u003cp>Mẫu câu riêng:\u003c/p>\n\u003cul>\n\u003cli>“Khách này em đang phụ trách từ ngày..., việc anh/chị liên hệ trực tiếp làm thông tin bị lệch. Mình thống nhất lại cách phối hợp nhé.”\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu với quản lý:\u003c/p>\n\u003cul>\n\u003cli>“Em xin báo cáo một việc ảnh hưởng đến phân công khách hàng. Em không muốn quy thành lỗi cá nhân, chỉ muốn thống nhất cơ chế để tránh xung đột KPI.”\u003c/li>\n\u003c/ul>"},{"id":"27-khi-gap-nguoi-dam-len-noi-xau-gay-hieu-nham","level":2,"title":"27. Khi gặp người đâm lén, nói xấu, gây hiểu nhầm","audio":"https://files.catbox.moe/bcgw20.mp3","duration":null,"text":"Khi gặp người đâm lén, nói xấu, gây hiểu nhầm\n\nNgười EQ cao không vội thanh minh trong cơn nóng. Càng thanh minh cuống, càng dễ bị xem là có tật giật mình. Trước hết phải chọn đúng chiến trường: nói riêng, nói có bằng chứng, nói với người có thẩm quyền.\n\nQuy tắc:\nKhông đáp trả tin đồn bằng tin đồn.\nKhông nói xấu ngược lại.\nKhông kể lể với quá nhiều người.\nSửa hiểu nhầm bằng sự việc cụ thể.\n\nMẫu câu:\n“Em nghe có thông tin chưa chính xác về việc này, em xin phép làm rõ bằng các mốc thời gian.”\n“Em không muốn đánh giá ai, em chỉ trình bày phần việc của mình.”\n“Nếu em có thiếu sót, em nhận phần thiếu sót; còn phần thông tin sai, em xin đính chính.”","html":"\u003ch3>27. Khi gặp người đâm lén, nói xấu, gây hiểu nhầm\u003c/h3>\n\u003cp>Người EQ cao không vội thanh minh trong cơn nóng. Càng thanh minh cuống, càng dễ bị xem là có tật giật mình. Trước hết phải chọn đúng chiến trường: nói riêng, nói có bằng chứng, nói với người có thẩm quyền.\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Không đáp trả tin đồn bằng tin đồn.\u003c/li>\n\u003cli>Không nói xấu ngược lại.\u003c/li>\n\u003cli>Không kể lể với quá nhiều người.\u003c/li>\n\u003cli>Sửa hiểu nhầm bằng sự việc cụ thể.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Em nghe có thông tin chưa chính xác về việc này, em xin phép làm rõ bằng các mốc thời gian.”\u003c/li>\n\u003cli>“Em không muốn đánh giá ai, em chỉ trình bày phần việc của mình.”\u003c/li>\n\u003cli>“Nếu em có thiếu sót, em nhận phần thiếu sót; còn phần thông tin sai, em xin đính chính.”\u003c/li>\n\u003c/ul>"},{"id":"28-khi-lanh-dao-cu-lanh-dao-moi-va-cap-duoi-doi-dau","level":2,"title":"28. Khi lãnh đạo cũ, lãnh đạo mới và cấp dưới đối đầu","audio":"https://files.catbox.moe/dpdai6.mp3","duration":null,"text":"Khi lãnh đạo cũ, lãnh đạo mới và cấp dưới đối đầu\n\nMột mô tả nhắc đến mâu thuẫn từ lãnh đạo cũ, “lúa chín cúi đầu”. Trong môi trường có quyền lực, đứng quá ngông có thể gây thù; cúi quá thấp có thể bị xem thường.\n\nQuy tắc:\nTôn trọng quá khứ, nhưng không bị quá khứ trói.\nGhi nhận đóng góp của lãnh đạo cũ, nhưng làm rõ mục tiêu hiện tại.\nVới cấp dưới chống đối, không dùng cảm xúc cá nhân để xử lý.\nMọi quyết định kỷ luật phải dựa trên việc, không dựa trên sự bực tức.\n\nMẫu câu:\n“Cách cũ có giá trị trong giai đoạn trước. Giai đoạn này mục tiêu thay đổi, nên cách làm cần điều chỉnh.”\n“Em tôn trọng ý kiến khác nhau, nhưng khi đã thống nhất mục tiêu, cả nhóm cần cùng một hướng.”\n“Phần này mình đánh giá theo kết quả và quy trình, không dựa trên cảm tính.”","html":"\u003ch3>28. Khi lãnh đạo cũ, lãnh đạo mới và cấp dưới đối đầu\u003c/h3>\n\u003cp>Một mô tả nhắc đến mâu thuẫn từ lãnh đạo cũ, “lúa chín cúi đầu”. Trong môi trường có quyền lực, đứng quá ngông có thể gây thù; cúi quá thấp có thể bị xem thường.\u003c/p>\n\u003cp>Quy tắc:\u003c/p>\n\u003cul>\n\u003cli>Tôn trọng quá khứ, nhưng không bị quá khứ trói.\u003c/li>\n\u003cli>Ghi nhận đóng góp của lãnh đạo cũ, nhưng làm rõ mục tiêu hiện tại.\u003c/li>\n\u003cli>Với cấp dưới chống đối, không dùng cảm xúc cá nhân để xử lý.\u003c/li>\n\u003cli>Mọi quyết định kỷ luật phải dựa trên việc, không dựa trên sự bực tức.\u003c/li>\n\u003c/ul>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Cách cũ có giá trị trong giai đoạn trước. Giai đoạn này mục tiêu thay đổi, nên cách làm cần điều chỉnh.”\u003c/li>\n\u003cli>“Em tôn trọng ý kiến khác nhau, nhưng khi đã thống nhất mục tiêu, cả nhóm cần cùng một hướng.”\u003c/li>\n\u003cli>“Phần này mình đánh giá theo kết quả và quy trình, không dựa trên cảm tính.”\u003c/li>\n\u003c/ul>"},{"id":"29-lanh-dao-dung-tinh-dung-uy-va-dung-luat","level":2,"title":"29. Lãnh đạo dùng tình, dùng uy và dùng luật","audio":"https://files.catbox.moe/y487pf.mp3","duration":null,"text":"Lãnh đạo dùng tình, dùng uy và dùng luật\n\nCó video nói về leader dùng “tình” để quản lý, hiền quá nên cấp dưới không coi trọng; video khác nói lãnh đạo mới xử lý nhân viên chống đối. Bài học: lãnh đạo không thể chỉ có tình, cũng không thể chỉ có uy.\n\nBa lớp quản lý:\nTình: để con người cảm thấy được hiểu.\nUy: để tập thể biết có ranh giới.\nLuật: để mọi việc công bằng và không tùy tiện.\n\nNếu chỉ có tình, người tốt sẽ thương, người xấu sẽ lợi dụng. Nếu chỉ có uy, nhân viên sợ nhưng không phục. Nếu chỉ có luật, tập thể lạnh và khó gắn kết.\n\nMẫu câu:\n“Chị hiểu khó khăn của em, nhưng tiêu chuẩn công việc vẫn phải giữ.”\n“Lần này mình cùng nhau sửa, nhưng từ lần sau sẽ tính theo quy định chung.”\n“Chị không xử lý để làm khó ai, mà để cả đội có một chuẩn công bằng.”","html":"\u003ch3>29. Lãnh đạo dùng tình, dùng uy và dùng luật\u003c/h3>\n\u003cp>Có video nói về leader dùng “tình” để quản lý, hiền quá nên cấp dưới không coi trọng; video khác nói lãnh đạo mới xử lý nhân viên chống đối. Bài học: lãnh đạo không thể chỉ có tình, cũng không thể chỉ có uy.\u003c/p>\n\u003cp>Ba lớp quản lý:\u003c/p>\n\u003cul>\n\u003cli>Tình: để con người cảm thấy được hiểu.\u003c/li>\n\u003cli>Uy: để tập thể biết có ranh giới.\u003c/li>\n\u003cli>Luật: để mọi việc công bằng và không tùy tiện.\u003c/li>\n\u003c/ul>\n\u003cp>Nếu chỉ có tình, người tốt sẽ thương, người xấu sẽ lợi dụng. Nếu chỉ có uy, nhân viên sợ nhưng không phục. Nếu chỉ có luật, tập thể lạnh và khó gắn kết.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Chị hiểu khó khăn của em, nhưng tiêu chuẩn công việc vẫn phải giữ.”\u003c/li>\n\u003cli>“Lần này mình cùng nhau sửa, nhưng từ lần sau sẽ tính theo quy định chung.”\u003c/li>\n\u003cli>“Chị không xử lý để làm khó ai, mà để cả đội có một chuẩn công bằng.”\u003c/li>\n\u003c/ul>"},{"id":"phan-vi-bo-quy-tac-thuc-chien","level":1,"title":"Phần VI - Bộ quy tắc thực chiến","audio":"https://files.catbox.moe/s3wvf4.mp3","duration":null,"text":"Phần VI - Bộ quy tắc thực chiến","html":"\u003ch2>Phần VI - Bộ quy tắc thực chiến\u003c/h2>"},{"id":"30-ba-muoi-sau-nguyen-tac-vang-trong-moi-cuoc-giao-tiep","level":2,"title":"30. Ba mươi sáu nguyên tắc vàng trong mọi cuộc giao tiếp","audio":"https://files.catbox.moe/pydtzl.mp3","duration":null,"text":"Ba mươi sáu nguyên tắc vàng trong mọi cuộc giao tiếp\nChào trước khi hỏi việc.\nNghe hết câu đầu tiên trước khi kết luận.\nGọi tên hoặc xưng hô phù hợp để tạo cảm giác được tôn trọng.\nKhông phán xét khách qua vẻ ngoài.\nNói ngắn với người bận rộn, nói kỹ với người hoang mang.\nGiữ thể diện cho người sai.\nCông nhận cảm xúc trước khi đưa lý lẽ.\nTách con người khỏi vấn đề.\nKhông tranh thắng trên lời nói nếu việc chưa được giải quyết.\nĐừng hứa quá thẩm quyền.\nKhông dùng “quy định” như cây gậy, hãy dùng như bản đồ.\nLuôn cho khách bước tiếp theo.\nVới khách quyền lực: rõ, gọn, chắc, kín.\nVới khách yếu thế: chậm, dễ hiểu, kiên nhẫn.\nVới khách nóng: hạ nhiệt trước, xử lý sau.\nVới khách im: hỏi mở, đừng ép.\nVới khách nghi ngờ: tăng bằng chứng, giảm lời hứa.\nVới khách khó tính: giữ giọng thấp và câu ngắn.\nTrong bàn tiệc, để ý người ít nói.\nĐừng ép rượu, ép mua, ép quyết.\nKhen cụ thể, đừng khen quá đà.\nCứu người khác khỏi mất mặt mà không kể công.\nNếu cần từ chối, từ chối kèm lý do và lối ra.\nNếu sai, xin lỗi ngắn gọn và sửa nhanh.\nNếu không sai, vẫn có thể xin lỗi về trải nghiệm không tốt.\nKhi bị công kích, đưa câu chuyện về việc.\nKhi bị ép bởi quyền lực, mềm thái độ, cứng nguyên tắc.\nBán hàng bắt đầu từ câu hỏi, không bắt đầu từ bài thuyết trình.\nKhách mua sự yên tâm trước khi mua sản phẩm.\nKhông giấu thông tin bất lợi.\nKhông cướp lời lãnh đạo, không cướp sân khấu của người chủ trì.\nTôn trọng người điều phối, thư ký, lễ tân, bảo vệ, nhân viên phục vụ.\nGhi công khai, góp ý riêng.\nPhản ánh bằng sự việc, không dán nhãn nhân cách.\nThành ý nằm ở hành động nhỏ được làm đúng.\nKết thúc mọi cuộc trao đổi bằng sự rõ ràng.","html":"\u003ch3>30. Ba mươi sáu nguyên tắc vàng trong mọi cuộc giao tiếp\u003c/h3>\n\u003cp>1. Chào trước khi hỏi việc. 2. Nghe hết câu đầu tiên trước khi kết luận. 3. Gọi tên hoặc xưng hô phù hợp để tạo cảm giác được tôn trọng. 4. Không phán xét khách qua vẻ ngoài. 5. Nói ngắn với người bận rộn, nói kỹ với người hoang mang. 6. Giữ thể diện cho người sai. 7. Công nhận cảm xúc trước khi đưa lý lẽ. 8. Tách con người khỏi vấn đề. 9. Không tranh thắng trên lời nói nếu việc chưa được giải quyết. 10. Đừng hứa quá thẩm quyền. 11. Không dùng “quy định” như cây gậy, hãy dùng như bản đồ. 12. Luôn cho khách bước tiếp theo. 13. Với khách quyền lực: rõ, gọn, chắc, kín. 14. Với khách yếu thế: chậm, dễ hiểu, kiên nhẫn. 15. Với khách nóng: hạ nhiệt trước, xử lý sau. 16. Với khách im: hỏi mở, đừng ép. 17. Với khách nghi ngờ: tăng bằng chứng, giảm lời hứa. 18. Với khách khó tính: giữ giọng thấp và câu ngắn. 19. Trong bàn tiệc, để ý người ít nói. 20. Đừng ép rượu, ép mua, ép quyết. 21. Khen cụ thể, đừng khen quá đà. 22. Cứu người khác khỏi mất mặt mà không kể công. 23. Nếu cần từ chối, từ chối kèm lý do và lối ra. 24. Nếu sai, xin lỗi ngắn gọn và sửa nhanh. 25. Nếu không sai, vẫn có thể xin lỗi về trải nghiệm không tốt. 26. Khi bị công kích, đưa câu chuyện về việc. 27. Khi bị ép bởi quyền lực, mềm thái độ, cứng nguyên tắc. 28. Bán hàng bắt đầu từ câu hỏi, không bắt đầu từ bài thuyết trình. 29. Khách mua sự yên tâm trước khi mua sản phẩm. 30. Không giấu thông tin bất lợi. 31. Không cướp lời lãnh đạo, không cướp sân khấu của người chủ trì. 32. Tôn trọng người điều phối, thư ký, lễ tân, bảo vệ, nhân viên phục vụ. 33. Ghi công khai, góp ý riêng. 34. Phản ánh bằng sự việc, không dán nhãn nhân cách. 35. Thành ý nằm ở hành động nhỏ được làm đúng. 36. Kết thúc mọi cuộc trao đổi bằng sự rõ ràng.\u003c/p>"},{"id":"31-mau-cau-nen-dung-trong-cac-tinh-huong-kho","level":2,"title":"31. Mẫu câu nên dùng trong các tình huống khó","audio":"https://files.catbox.moe/2lk6bq.mp3","duration":null,"text":"Mẫu câu nên dùng trong các tình huống khó\n\nKhi khách bức xúc:\n“Em hiểu việc này làm anh/chị khó chịu. Em xin kiểm tra ngay phần cốt lõi.”\n“Mình cho em một phút để xem lại thông tin, em sẽ trả lời rõ từng ý.”\n\nKhi khách sai giấy tờ hoặc quy trình:\n“Phần này rất dễ nhầm. Mình sửa lại mục này là hồ sơ sẽ đúng.”\n“Để tránh bị trả về, mình bổ sung thêm giấy này giúp em.”\n\nKhi cần từ chối:\n“Em rất muốn hỗ trợ, nhưng phần này không thể làm khác quy định. Cách nhanh nhất trong đúng quy trình là...”\n\nKhi khách có địa vị cao:\n“Em xin đi thẳng vào trọng tâm.”\n“Phần trong thẩm quyền em xử lý ngay; phần còn lại em chuyển đúng đầu mối.”\n\nKhi khách yếu thế:\n“Mình cứ bình tĩnh, em hướng dẫn từng bước.”\n“Em viết lại để mình dễ làm theo.”\n\nKhi đồng nghiệp giành khách:\n“Mình cần thống nhất lại cách phối hợp để khách không nhận hai luồng thông tin.”\n\nKhi gặp lãnh đạo:\n“Em xin báo cáo ngắn một ý, nếu anh/chị tiện nghe.”","html":"\u003ch3>31. Mẫu câu nên dùng trong các tình huống khó\u003c/h3>\n\u003cp>Khi khách bức xúc:\u003c/p>\n\u003cul>\n\u003cli>“Em hiểu việc này làm anh/chị khó chịu. Em xin kiểm tra ngay phần cốt lõi.”\u003c/li>\n\u003cli>“Mình cho em một phút để xem lại thông tin, em sẽ trả lời rõ từng ý.”\u003c/li>\n\u003c/ul>\n\u003cp>Khi khách sai giấy tờ hoặc quy trình:\u003c/p>\n\u003cul>\n\u003cli>“Phần này rất dễ nhầm. Mình sửa lại mục này là hồ sơ sẽ đúng.”\u003c/li>\n\u003cli>“Để tránh bị trả về, mình bổ sung thêm giấy này giúp em.”\u003c/li>\n\u003c/ul>\n\u003cp>Khi cần từ chối:\u003c/p>\n\u003cul>\n\u003cli>“Em rất muốn hỗ trợ, nhưng phần này không thể làm khác quy định. Cách nhanh nhất trong đúng quy trình là...”\u003c/li>\n\u003c/ul>\n\u003cp>Khi khách có địa vị cao:\u003c/p>\n\u003cul>\n\u003cli>“Em xin đi thẳng vào trọng tâm.”\u003c/li>\n\u003cli>“Phần trong thẩm quyền em xử lý ngay; phần còn lại em chuyển đúng đầu mối.”\u003c/li>\n\u003c/ul>\n\u003cp>Khi khách yếu thế:\u003c/p>\n\u003cul>\n\u003cli>“Mình cứ bình tĩnh, em hướng dẫn từng bước.”\u003c/li>\n\u003cli>“Em viết lại để mình dễ làm theo.”\u003c/li>\n\u003c/ul>\n\u003cp>Khi đồng nghiệp giành khách:\u003c/p>\n\u003cul>\n\u003cli>“Mình cần thống nhất lại cách phối hợp để khách không nhận hai luồng thông tin.”\u003c/li>\n\u003c/ul>\n\u003cp>Khi gặp lãnh đạo:\u003c/p>\n\u003cul>\n\u003cli>“Em xin báo cáo ngắn một ý, nếu anh/chị tiện nghe.”\u003c/li>\n\u003c/ul>"},{"id":"32-nhung-cau-tuyet-doi-tranh","level":2,"title":"32. Những câu tuyệt đối tránh","audio":"https://files.catbox.moe/l3iasm.mp3","duration":null,"text":"Những câu tuyệt đối tránh\n“Cái này ai cũng biết.”\n“Anh/chị sai rồi.”\n“Em đã nói rồi mà.”\n“Không được là không được.”\n“Bên em không chịu trách nhiệm.”\n“Khách như anh/chị...”\n“Muốn thì chờ, không thì thôi.”\n“Chuyện này không phải việc của em.”\n“Anh/chị không hiểu đâu.”\n“Sếp em bảo thế.”\n\nNhững câu này nguy hiểm không phải vì thiếu thông tin, mà vì làm người nghe thấy bị hạ thấp.","html":"\u003ch3>32. Những câu tuyệt đối tránh\u003c/h3>\n\u003cul>\n\u003cli>“Cái này ai cũng biết.”\u003c/li>\n\u003cli>“Anh/chị sai rồi.”\u003c/li>\n\u003cli>“Em đã nói rồi mà.”\u003c/li>\n\u003cli>“Không được là không được.”\u003c/li>\n\u003cli>“Bên em không chịu trách nhiệm.”\u003c/li>\n\u003cli>“Khách như anh/chị...”\u003c/li>\n\u003cli>“Muốn thì chờ, không thì thôi.”\u003c/li>\n\u003cli>“Chuyện này không phải việc của em.”\u003c/li>\n\u003cli>“Anh/chị không hiểu đâu.”\u003c/li>\n\u003cli>“Sếp em bảo thế.”\u003c/li>\n\u003c/ul>\n\u003cp>Những câu này nguy hiểm không phải vì thiếu thông tin, mà vì làm người nghe thấy bị hạ thấp.\u003c/p>"},{"id":"33-quy-trinh-5-buoc-xu-ly-moi-tinh-huong","level":2,"title":"33. Quy trình 5 bước xử lý mọi tình huống","audio":"https://files.catbox.moe/vsn68n.mp3","duration":null,"text":"Quy trình 5 bước xử lý mọi tình huống\n\nBước 1: Dừng lại và đọc tình huống.  \nHỏi thầm: ai đang có quyền quyết? Ai đang mất mặt? Ai đang nóng? Ai đang cần được nghe?\n\nBước 2: Hạ nhiệt.  \nDùng giọng thấp, câu ngắn, không chen ngang. Nếu cần, mời ngồi xuống, mời nước, tách ra khỏi đám đông.\n\nBước 3: Làm rõ.  \nHỏi thêm dữ liệu, nhắc lại ý chính, xác nhận điều khách muốn.\n\nBước 4: Đưa phương án.  \nMỗi phương án nên có điều kiện, lợi ích, giới hạn và thời gian.\n\nBước 5: Chốt và theo dõi.  \nKhách phải biết sau cuộc nói chuyện: ai làm, làm gì, khi nào, kết quả mong đợi là gì.","html":"\u003ch3>33. Quy trình 5 bước xử lý mọi tình huống\u003c/h3>\n\u003cp>\u003cstrong>Bước 1: Dừng lại và đọc tình huống.\u003c/strong> Hỏi thầm: ai đang có quyền quyết? Ai đang mất mặt? Ai đang nóng? Ai đang cần được nghe?\u003c/p>\n\u003cp>\u003cstrong>Bước 2: Hạ nhiệt.\u003c/strong> Dùng giọng thấp, câu ngắn, không chen ngang. Nếu cần, mời ngồi xuống, mời nước, tách ra khỏi đám đông.\u003c/p>\n\u003cp>\u003cstrong>Bước 3: Làm rõ.\u003c/strong> Hỏi thêm dữ liệu, nhắc lại ý chính, xác nhận điều khách muốn.\u003c/p>\n\u003cp>\u003cstrong>Bước 4: Đưa phương án.\u003c/strong> Mỗi phương án nên có điều kiện, lợi ích, giới hạn và thời gian.\u003c/p>\n\u003cp>\u003cstrong>Bước 5: Chốt và theo dõi.\u003c/strong> Khách phải biết sau cuộc nói chuyện: ai làm, làm gì, khi nào, kết quả mong đợi là gì.\u003c/p>"},{"id":"34-bai-tap-luyen-eq-moi-ngay","level":2,"title":"34. Bài tập luyện EQ mỗi ngày","audio":"https://files.catbox.moe/mgxrcy.mp3","duration":null,"text":"Bài tập luyện EQ mỗi ngày\n\nBài tập 1: Một ngày không cắt lời.  \nTrong mọi cuộc nói chuyện, để người khác nói trọn câu đầu tiên. Ghi nhận sự khác biệt trong thái độ của họ.\n\nBài tập 2: Đổi câu phán xét thành câu quan sát.  \nThay vì “khách này khó tính”, đổi thành “khách này cần nhiều bằng chứng trước khi quyết”.\n\nBài tập 3: Kết thúc bằng bước tiếp theo.  \nMỗi lần trao đổi công việc, kết thúc bằng: “Việc tiếp theo là...”\n\nBài tập 4: Luyện câu từ chối có lối ra.  \nMỗi ngày viết ba câu: “Em không thể..., nhưng em có thể...”\n\nBài tập 5: Quan sát người ít nói.  \nTrong họp, tiệc, hoặc gặp khách, chú ý người ít nói nhất. Thử đoán xem họ đang cần gì: thông tin, sự công nhận, hay một cơ hội lên tiếng.","html":"\u003ch3>34. Bài tập luyện EQ mỗi ngày\u003c/h3>\n\u003cp>\u003cstrong>Bài tập 1: Một ngày không cắt lời.\u003c/strong> Trong mọi cuộc nói chuyện, để người khác nói trọn câu đầu tiên. Ghi nhận sự khác biệt trong thái độ của họ.\u003c/p>\n\u003cp>\u003cstrong>Bài tập 2: Đổi câu phán xét thành câu quan sát.\u003c/strong> Thay vì “khách này khó tính”, đổi thành “khách này cần nhiều bằng chứng trước khi quyết”.\u003c/p>\n\u003cp>\u003cstrong>Bài tập 3: Kết thúc bằng bước tiếp theo.\u003c/strong> Mỗi lần trao đổi công việc, kết thúc bằng: “Việc tiếp theo là...”\u003c/p>\n\u003cp>\u003cstrong>Bài tập 4: Luyện câu từ chối có lối ra.\u003c/strong> Mỗi ngày viết ba câu: “Em không thể..., nhưng em có thể...”\u003c/p>\n\u003cp>\u003cstrong>Bài tập 5: Quan sát người ít nói.\u003c/strong> Trong họp, tiệc, hoặc gặp khách, chú ý người ít nói nhất. Thử đoán xem họ đang cần gì: thông tin, sự công nhận, hay một cơ hội lên tiếng.\u003c/p>"},{"id":"phan-vii-kho-tinh-huong-ung-dung-tu-sach-giao-tiep-va-ban-hang","level":1,"title":"Phần VII - Kho tình huống ứng dụng từ sách giao tiếp và bán hàng","audio":"https://files.catbox.moe/zf71fn.mp3","duration":null,"text":"Phần VII - Kho tình huống ứng dụng từ sách giao tiếp và bán hàng\n\nPhần này là lớp “thực chiến hóa” của cuốn sách. Các tình huống dưới đây được đặt theo đúng những bối cảnh thường gặp khi tiếp khách, bán hàng, làm dịch vụ và giao tiếp công sở. Mỗi tình huống có bối cảnh, lỗi thường gặp, cách nói nên dùng và bài học được diễn giải từ các sách kinh điển về giao
