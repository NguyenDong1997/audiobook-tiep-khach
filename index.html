giữ mình\n\nBối cảnh: Có người nói một đằng làm một nẻo, gài bẫy câu chữ, đẩy trách nhiệm, hoặc cố kéo bạn vào phản ứng cảm xúc. Nếu bạn nóng, họ thắng. Nếu bạn im lặng hoàn toàn, họ lấn.\n\nLỗi thường gặp:\nPhản ứng ngay trước đám đông.\nNói theo cảm xúc thay vì sự kiện.\nĐể họ kéo cuộc trò chuyện sang chuyện cá nhân.\nKhông ghi nhận thỏa thuận bằng văn bản.\n\nCách xử lý có EQ:\n\nVới người mưu mô, đừng chơi trò mưu mô hơn. Hãy chơi bằng sự rõ ràng: ghi nhận bằng văn bản, xác nhận mốc thời gian, nói theo dữ kiện, giữ giọng bình tĩnh.\n\nMẫu câu:\n“Để tránh hiểu khác nhau, em xin nhắc lại ba điểm mình vừa thống nhất.”\n“Phần này em ghi nhận theo mốc thời gian như sau...”\n“Em không bàn về động cơ cá nhân, em chỉ làm rõ phần việc.”\n“Nếu có thay đổi, mình xác nhận lại trong nhóm chung để mọi người cùng nắm.”\n\nVí dụ cụ thể:\n\nĐồng nghiệp nói miệng rằng bạn phụ trách phần A, nhưng trong cuộc họp lại nói bạn chưa làm phần B. Nếu bạn cãi ngay, cuộc họp loạn. Cách tốt hơn: “Em xin làm rõ theo phân công ngày thứ Hai: em phụ trách phần A, bạn Minh phụ trách phần B. Phần A em đã gửi lúc 16 giờ hôm qua. Nếu cần em hỗ trợ phần B, mình thống nhất lại sau cuộc họp.” Bạn không công kích, nhưng khóa lại sự thật.\n\nLiên hệ sách kinh điển:\nTừ *Crucial Conversations*: trong đối thoại khó, phải giữ cuộc trò chuyện trong vùng an toàn và bám vào sự kiện.\nTừ *Never Split the Difference*: bình tĩnh gọi tên tình huống và dùng câu hỏi hiệu chỉnh có thể giúp bạn tránh bị kéo vào thế bị động.\n\nNguyên tắc rút ra: Với người mưu mô, vũ khí mạnh nhất không phải là mưu sâu hơn, mà là sự rõ ràng đến mức họ khó bẻ cong.","html":"\u003ch3>54. Khi phải giao tiếp với người mưu mô nhưng vẫn giữ mình\u003c/h3>\n\u003cp>\u003cstrong>Bối cảnh:\u003c/strong> Có người nói một đằng làm một nẻo, gài bẫy câu chữ, đẩy trách nhiệm, hoặc cố kéo bạn vào phản ứng cảm xúc. Nếu bạn nóng, họ thắng. Nếu bạn im lặng hoàn toàn, họ lấn.\u003c/p>\n\u003cp>\u003cstrong>Lỗi thường gặp:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Phản ứng ngay trước đám đông.\u003c/li>\n\u003cli>Nói theo cảm xúc thay vì sự kiện.\u003c/li>\n\u003cli>Để họ kéo cuộc trò chuyện sang chuyện cá nhân.\u003c/li>\n\u003cli>Không ghi nhận thỏa thuận bằng văn bản.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Cách xử lý có EQ:\u003c/strong>\u003c/p>\n\u003cp>Với người mưu mô, đừng chơi trò mưu mô hơn. Hãy chơi bằng sự rõ ràng: ghi nhận bằng văn bản, xác nhận mốc thời gian, nói theo dữ kiện, giữ giọng bình tĩnh.\u003c/p>\n\u003cp>Mẫu câu:\u003c/p>\n\u003cul>\n\u003cli>“Để tránh hiểu khác nhau, em xin nhắc lại ba điểm mình vừa thống nhất.”\u003c/li>\n\u003cli>“Phần này em ghi nhận theo mốc thời gian như sau...”\u003c/li>\n\u003cli>“Em không bàn về động cơ cá nhân, em chỉ làm rõ phần việc.”\u003c/li>\n\u003cli>“Nếu có thay đổi, mình xác nhận lại trong nhóm chung để mọi người cùng nắm.”\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ví dụ cụ thể:\u003c/strong>\u003c/p>\n\u003cp>Đồng nghiệp nói miệng rằng bạn phụ trách phần A, nhưng trong cuộc họp lại nói bạn chưa làm phần B. Nếu bạn cãi ngay, cuộc họp loạn. Cách tốt hơn: “Em xin làm rõ theo phân công ngày thứ Hai: em phụ trách phần A, bạn Minh phụ trách phần B. Phần A em đã gửi lúc 16 giờ hôm qua. Nếu cần em hỗ trợ phần B, mình thống nhất lại sau cuộc họp.” Bạn không công kích, nhưng khóa lại sự thật.\u003c/p>\n\u003cp>\u003cstrong>Liên hệ sách kinh điển:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Từ *Crucial Conversations*: trong đối thoại khó, phải giữ cuộc trò chuyện trong vùng an toàn và bám vào sự kiện.\u003c/li>\n\u003cli>Từ *Never Split the Difference*: bình tĩnh gọi tên tình huống và dùng câu hỏi hiệu chỉnh có thể giúp bạn tránh bị kéo vào thế bị động.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Nguyên tắc rút ra:\u003c/strong> Với người mưu mô, vũ khí mạnh nhất không phải là mưu sâu hơn, mà là sự rõ ràng đến mức họ khó bẻ cong.\u003c/p>"},{"id":"55-ban-do-chon-ky-thuat-theo-tung-tinh-huong","level":2,"title":"55. Bản đồ chọn kỹ thuật theo từng tình huống","audio":"https://files.catbox.moe/d40uwc.mp3","duration":null,"text":"Bản đồ chọn kỹ thuật theo từng tình huống\n\n| Tình huống | Kỹ thuật nên dùng | Câu hỏi/câu nói mở đầu |\n|  |  |  |\n| Khách nóng giận | Gọi tên cảm xúc, hạ nhiệt | “Em hiểu việc này làm mình rất khó chịu.” |\n| Khách mặc cả | Làm rõ phạm vi giá trị | “Mình đang so sánh cùng điều kiện bảo hành và dịch vụ chưa ạ?” |\n| Khách im lặng | Follow-up bằng giá trị | “Em gửi thêm bản tóm tắt để mình dễ so sánh.” |\n| Khách quyền lực | Kết luận trước, chi tiết sau | “Em xin đi thẳng vào ba điểm chính.” |\n| Khách yếu thế | Nói chậm, viết lại bước tiếp theo | “Mình làm theo ba bước này là được.” |\n| Khách biết nhiều | Công nhận, rồi bổ sung insight | “Em không nói lại phần cơ bản, em xin bổ sung rủi ro thực tế.” |\n| Khách ép ngoại lệ | Mềm thái độ, cứng tiêu chuẩn | “Cách nhanh nhất trong đúng quy trình là...” |\n| Đồng nghiệp giành khách | Sự kiện, bằng chứng, cơ chế | “Mình thống nhất lại cách phối hợp để khách không nhận hai luồng thông tin.” |\n| Gặp lãnh đạo ngắn | Bối cảnh, tiến độ, nút quyết, đề xuất | “Em xin báo cáo ngắn một ý nếu anh/chị tiện nghe.” |\n| Cần chốt sale | Tóm tắt tiêu chí và bước tiếp theo | “Nếu mình thấy ổn, bước tiếp theo là...” |","html":"\u003ch3>55. Bản đồ chọn kỹ thuật theo từng tình huống\u003c/h3>\n\u003cp>| Tình huống | Kỹ thuật nên dùng | Câu hỏi/câu nói mở đầu | | --- | --- | --- | | Khách nóng giận | Gọi tên cảm xúc, hạ nhiệt | “Em hiểu việc này làm mình rất khó chịu.” | | Khách mặc cả | Làm rõ phạm vi giá trị | “Mình đang so sánh cùng điều kiện bảo hành và dịch vụ chưa ạ?” | | Khách im lặng | Follow-up bằng giá trị | “Em gửi thêm bản tóm tắt để mình dễ so sánh.” | | Khách quyền lực | Kết luận trước, chi tiết sau | “Em xin đi thẳng vào ba điểm chính.” | | Khách yếu thế | Nói chậm, viết lại bước tiếp theo | “Mình làm theo ba bước này là được.” | | Khách biết nhiều | Công nhận, rồi bổ sung insight | “Em không nói lại phần cơ bản, em xin bổ sung rủi ro thực tế.” | | Khách ép ngoại lệ | Mềm thái độ, cứng tiêu chuẩn | “Cách nhanh nhất trong đúng quy trình là...” | | Đồng nghiệp giành khách | Sự kiện, bằng chứng, cơ chế | “Mình thống nhất lại cách phối hợp để khách không nhận hai luồng thông tin.” | | Gặp lãnh đạo ngắn | Bối cảnh, tiến độ, nút quyết, đề xuất | “Em xin báo cáo ngắn một ý nếu anh/chị tiện nghe.” | | Cần chốt sale | Tóm tắt tiêu chí và bước tiếp theo | “Nếu mình thấy ổn, bước tiếp theo là...” |\u003c/p>"},{"id":"56-danh-muc-sach-nen-doc-de-dao-sau","level":2,"title":"56. Danh mục sách nên đọc để đào sâu","audio":"https://files.catbox.moe/rqlq5x.mp3","duration":null,"text":"Danh mục sách nên đọc để đào sâu\n*Đắc Nhân Tâm* - Dale Carnegie: nền tảng về tôn trọng, giữ thể diện, khen đúng cách, tránh chỉ trích trực diện.\n*SPIN Selling* - Neil Rackham: nghệ thuật đặt câu hỏi trong bán hàng, đặc biệt với thương vụ lớn.\n*The Challenger Sale* - Matthew Dixon và Brent Adamson: bán hàng bằng insight, biết dạy khách, may đo thông điệp và kiểm soát cuộc trò chuyện.\n*Influence* - Robert Cialdini: các nguyên tắc ảnh hưởng như bằng chứng xã hội, cam kết, thiện cảm, khan hiếm, uy tín và đáp trả.\n*Never Split the Difference* - Chris Voss: đồng cảm chiến thuật, gọi tên cảm xúc, câu hỏi hiệu chỉnh trong thương lượng.\n*To Sell Is Human* - Daniel H. Pink: bán hàng hiện đại là hòa nhịp, giữ tinh thần và làm rõ vấn đề.\n*Getting to Yes* - Roger Fisher và William Ury: thương lượng dựa trên lợi ích, tiêu chuẩn khách quan và tách con người khỏi vấn đề.\n*Crucial Conversations* - Kerry Patterson, Joseph Grenny, Ron McMillan và Al Switzler: đối thoại khi cảm xúc cao, lợi ích lớn và quan điểm khác biệt.\n*The Trusted Advisor* - David Maister, Charles Green và Robert Galford: xây dựng niềm tin trong quan hệ tư vấn và bán hàng chuyên nghiệp.\n*Fanatical Prospecting* - Jeb Blount: kỷ luật theo đuổi khách hàng và quản trị pipeline bán hàng.","html":"\u003ch3>56. Danh mục sách nên đọc để đào sâu\u003c/h3>\n\u003cp>1. *Đắc Nhân Tâm* - Dale Carnegie: nền tảng về tôn trọng, giữ thể diện, khen đúng cách, tránh chỉ trích trực diện. 2. *SPIN Selling* - Neil Rackham: nghệ thuật đặt câu hỏi trong bán hàng, đặc biệt với thương vụ lớn. 3. *The Challenger Sale* - Matthew Dixon và Brent Adamson: bán hàng bằng insight, biết dạy khách, may đo thông điệp và kiểm soát cuộc trò chuyện. 4. *Influence* - Robert Cialdini: các nguyên tắc ảnh hưởng như bằng chứng xã hội, cam kết, thiện cảm, khan hiếm, uy tín và đáp trả. 5. *Never Split the Difference* - Chris Voss: đồng cảm chiến thuật, gọi tên cảm xúc, câu hỏi hiệu chỉnh trong thương lượng. 6. *To Sell Is Human* - Daniel H. Pink: bán hàng hiện đại là hòa nhịp, giữ tinh thần và làm rõ vấn đề. 7. *Getting to Yes* - Roger Fisher và William Ury: thương lượng dựa trên lợi ích, tiêu chuẩn khách quan và tách con người khỏi vấn đề. 8. *Crucial Conversations* - Kerry Patterson, Joseph Grenny, Ron McMillan và Al Switzler: đối thoại khi cảm xúc cao, lợi ích lớn và quan điểm khác biệt. 9. *The Trusted Advisor* - David Maister, Charles Green và Robert Galford: xây dựng niềm tin trong quan hệ tư vấn và bán hàng chuyên nghiệp. 10. *Fanatical Prospecting* - Jeb Blount: kỷ luật theo đuổi khách hàng và quản trị pipeline bán hàng.\u003c/p>"},{"id":"ket-luan-nguoi-cao-tay-khong-can-lam-ai-thua","level":1,"title":"Kết luận: Người cao tay không cần làm ai thua","audio":"https://files.catbox.moe/v3sae3.mp3","duration":null,"text":"Kết luận: Người cao tay không cần làm ai thua\n\nGiao tiếp chuẩn mực không nằm ở việc nói được bao nhiêu câu hay. Nó nằm ở việc sau cuộc gặp, người khác cảm thấy mình được tôn trọng, vấn đề được làm rõ, và quan hệ còn có thể tiếp tục.\n\nGặp người giàu, đừng sợ. Gặp người nghèo, đừng coi thường. Gặp người nóng, đừng nóng theo. Gặp người quyền lực, đừng mất mình. Gặp người yếu thế, đừng làm họ sợ. Gặp người mưu mô, đừng vội phơi bày cảm xúc. Gặp người chân thành, đừng để sự tinh tế của họ bị thiệt.\n\nCái đỉnh của EQ không phải là làm hài lòng tất cả mọi người. Đó là biết lúc nào cần mềm, lúc nào cần chắc, lúc nào cần nói, lúc nào cần im, lúc nào cần tiến, lúc nào cần lui. Một người làm được điều đó sẽ có thể giao tiếp linh hoạt với bất kỳ ai, trong bất kỳ hoàn cảnh nào, mà vẫn giữ được sự tử tế và cốt cách của mình.","html":"\u003ch2>Kết luận: Người cao tay không cần làm ai thua\u003c/h2>\n\u003cp>Giao tiếp chuẩn mực không nằm ở việc nói được bao nhiêu câu hay. Nó nằm ở việc sau cuộc gặp, người khác cảm thấy mình được tôn trọng, vấn đề được làm rõ, và quan hệ còn có thể tiếp tục.\u003c/p>\n\u003cp>Gặp người giàu, đừng sợ. Gặp người nghèo, đừng coi thường. Gặp người nóng, đừng nóng theo. Gặp người quyền lực, đừng mất mình. Gặp người yếu thế, đừng làm họ sợ. Gặp người mưu mô, đừng vội phơi bày cảm xúc. Gặp người chân thành, đừng để sự tinh tế của họ bị thiệt.\u003c/p>\n\u003cp>Cái đỉnh của EQ không phải là làm hài lòng tất cả mọi người. Đó là biết lúc nào cần mềm, lúc nào cần chắc, lúc nào cần nói, lúc nào cần im, lúc nào cần tiến, lúc nào cần lui. Một người làm được điều đó sẽ có thể giao tiếp linh hoạt với bất kỳ ai, trong bất kỳ hoàn cảnh nào, mà vẫn giữ được sự tử tế và cốt cách của mình.\u003c/p>"}]};</script>
<script type="module">
const playlist = document.querySelector("#playlist");
const trackCount = document.querySelector("#trackCount");
const trackTitle = document.querySelector("#trackTitle");
const partLabel = document.querySelector("#partLabel");
const chapterContent = document.querySelector("#chapterContent");
const miniTitle = document.querySelector("#miniTitle");
const miniMeta = document.querySelector("#miniMeta");
const audio = document.querySelector("#audio");
const playButton = document.querySelector("#playButton");
const prevButton = document.querySelector("#prevButton");
const nextButton = document.querySelector("#nextButton");
const backButton = document.querySelector("#backButton");
const forwardButton = document.querySelector("#forwardButton");
const seek = document.querySelector("#seek");
const currentTime = document.querySelector("#currentTime");
const duration = document.querySelector("#duration");
const speed = document.querySelector("#speed");
const installButton = document.querySelector("#installButton");

let book;
let currentIndex = Number(localStorage.getItem("currentTrack") || 0);
let deferredInstallPrompt = null;
let seeking = false;

const formatTime = (seconds) => {
  if (!Number.isFinite(seconds)) return "0:00";
  const total = Math.max(0, Math.floor(seconds));
  const minutes = Math.floor(total / 60);
  const rest = String(total % 60).padStart(2, "0");
  return `${minutes}:${rest}`;
};

const saveProgress = () => {
  localStorage.setItem("currentTrack", String(currentIndex));
  localStorage.setItem(`time:${book.tracks[currentIndex].id}`, String(audio.currentTime || 0));
};

const updateMediaSession = () => {
  if (!("mediaSession" in navigator)) return;
  const track = book.tracks[currentIndex];
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title,
    artist: "Đắc Nhân Tâm Trong Tiếp Khách",
    album: "Sách nói giao tiếp",
  });
  navigator.mediaSession.setActionHandler("play", () => audio.play());
  navigator.mediaSession.setActionHandler("pause", () => audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack", () => loadTrack(currentIndex - 1, true));
  navigator.mediaSession.setActionHandler("nexttrack", () => loadTrack(currentIndex + 1, true));
  navigator.mediaSession.setActionHandler("seekbackward", () => {
    audio.currentTime = Math.max(0, audio.currentTime - 15);
  });
  navigator.mediaSession.setActionHandler("seekforward", () => {
    audio.currentTime = Math.min(audio.duration || audio.currentTime + 30, audio.currentTime + 30);
  });
}

const renderPlaylist = () => {
  playlist.innerHTML = "";
  book.tracks.forEach((track, index) => {
    const button = document.createElement("button");
    button.className = `track-button level-${track.level}`;
    button.type = "button";
    button.dataset.index = String(index);
    button.innerHTML = `
      <span class="track-number">${index + 1}</span>
      <span class="track-name">${track.title}</span>
    `;
    button.addEventListener("click", () => loadTrack(index, true));
    playlist.append(button);
  });
  trackCount.textContent = `${book.tracks.length} mục`;
};

const markActive = () => {
  document.querySelectorAll(".track-button").forEach((button) => {
    button.classList.toggle("active", Number(button.dataset.index) === currentIndex);
  });
};

const loadTrack = async (index, autoplay = false) => {
  if (!book) return;
  currentIndex = (index + book.tracks.length) % book.tracks.length;
  const track = book.tracks[currentIndex];
  const priorTime = Number(localStorage.getItem(`time:${track.id}`) || 0);
  const wasPlaying = !audio.paused;

  audio.src = track.audio;
  audio.playbackRate = Number(speed.value);
  trackTitle.textContent = track.title;
  partLabel.textContent = track.level === 1 ? "Phần chính" : "Chương";
  chapterContent.innerHTML = track.html;
  miniTitle.textContent = track.title;
  miniMeta.textContent = "Đang tải audio...";
  markActive();
  updateMediaSession();
  saveProgress();

  audio.addEventListener(
    "loadedmetadata",
    () => {
      if (priorTime > 0 && priorTime < audio.duration - 4) {
        audio.currentTime = priorTime;
      }
      duration.textContent = formatTime(audio.duration);
      miniMeta.textContent = `${currentIndex + 1}/${book.tracks.length}`;
    },
    { once: true },
  );

  if (autoplay || wasPlaying) {
    try {
      await audio.play();
    } catch {
      miniMeta.textContent = "Chạm nút phát để nghe";
    }
  }
};

const setPlayingState = () => {
  playButton.textContent = audio.paused ? "▶" : "Ⅱ";
  miniMeta.textContent = audio.paused ? "Đã tạm dừng" : `${currentIndex + 1}/${book.tracks.length} đang phát`;
};

playButton.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch {
      miniMeta.textContent = "Trình duyệt cần bạn chạm lại để phát";
    }
  } else {
    audio.pause();
  }
});

prevButton.addEventListener("click", () => loadTrack(currentIndex - 1, true));
nextButton.addEventListener("click", () => loadTrack(currentIndex + 1, true));
backButton.addEventListener("click", () => {
  audio.currentTime = Math.max(0, audio.currentTime - 15);
});
forwardButton.addEventListener("click", () => {
  audio.currentTime = Math.min(audio.duration || audio.currentTime + 30, audio.currentTime + 30);
});
speed.addEventListener("change", () => {
  audio.playbackRate = Number(speed.value);
  localStorage.setItem("playbackRate", speed.value);
});

seek.addEventListener("input", () => {
  seeking = true;
});
seek.addEventListener("change", () => {
  if (Number.isFinite(audio.duration)) {
    audio.currentTime = (Number(seek.value) / 1000) * audio.duration;
  }
  seeking = false;
});

audio.addEventListener("play", setPlayingState);
audio.addEventListener("pause", () => {
  setPlayingState();
  saveProgress();
});
audio.addEventListener("timeupdate", () => {
  if (!seeking && Number.isFinite(audio.duration) && audio.duration > 0) {
    seek.value = String(Math.round((audio.currentTime / audio.duration) * 1000));
  }
  currentTime.textContent = formatTime(audio.currentTime);
  if (Math.floor(audio.currentTime) % 5 === 0) saveProgress();
});
audio.addEventListener("ended", () => loadTrack(currentIndex + 1, true));
audio.addEventListener("error", () => {
  miniMeta.textContent = "Chưa có file audio cho mục này";
});

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  installButton.classList.remove("hidden");
});

installButton.addEventListener("click", async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installButton.classList.add("hidden");
});



const start = async () => {
  const rate = localStorage.getItem("playbackRate");
  if (rate) speed.value = rate;
  book = window.__AUDIOBOOK_DATA__;
  currentIndex = Math.min(Math.max(currentIndex, 0), book.tracks.length - 1);
  renderPlaylist();
  await loadTrack(currentIndex, false);
};

start();

</script>

</html>
